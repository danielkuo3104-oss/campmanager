<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="營隊管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>系統管理｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
  <main id="app">
<div class="view-admin hidden">
  <div class="page-head">
    <div>
      <h1>系統管理</h1>
      <div class="sub" id="ad-sub"></div>
    </div>
  </div>
  <div class="tabs" id="ad-tabs">
    <button type="button" data-tab="staff" class="on">人員</button>
    <button type="button" data-tab="projects">專案</button>
    <button type="button" data-tab="templates">信件範本</button>
    <button type="button" data-tab="perms">權限與移交</button>
  </div>
  <div id="ad-body"><div class="loading"><div class="spinner"></div>載入中</div></div>
</div>
<div class="loading" id="page-loading"><div class="spinner"></div>載入中</div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
<script>
App.page('admin', function (root, params) {
  var D = null, tab = params.tab || 'staff';
  /** 每個分頁需要的權限（任一項） */
  var TAB_PERMS = { staff: ['approveStaff', 'manageStaff'], projects: ['approveProject', 'projectStatus', 'siteMaint'], templates: ['templates'], perms: ['__root'] };
  function can(k) { return D.me.isRoot || (k !== '__root' && D.me.perms.indexOf(k) >= 0); }
  function tabAllowed(t) { return (TAB_PERMS[t] || []).some(can); }

  function load() {
    return apiFast('getAdminData', function (d) {
      D = d;
      var first = null;
      $$('#ad-tabs button', root).forEach(function (b) {
        var t = b.getAttribute('data-tab'), okTab = tabAllowed(t);
        b.classList.toggle('hidden', !okTab);
        if (okTab && !first) first = t;
      });
      if (!tabAllowed(tab)) tab = first;
      $$('#ad-tabs button', root).forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
      render();
    }).catch(function (e) { toast(e.message, true); $('#ad-body', root).innerHTML = '<div class="card card-pad empty"></div>'; $('#ad-body .empty', root).textContent = e.message; });
  }

  $$('#ad-tabs button', root).forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-tab');
      $$('#ad-tabs button', root).forEach(function (x) { x.classList.toggle('on', x === b); });
      render();
    });
  });

  function render() {
    $('#ad-sub', root).textContent = '系統帳號：' + D.systemAccount + '　·　今日剩餘寄信額度 ' + D.quota + ' 封';
    var body = $('#ad-body', root);
    body.innerHTML = '';
    if (tab === 'staff') renderStaff(body);
    if (tab === 'projects') renderProjects(body);
    if (tab === 'templates') renderTemplates(body);
    if (tab === 'perms') renderPerms(body);
  }

  function permLabel(k) { var x = D.permDefs.filter(function (p) { return p.key === k; })[0]; return x ? x.label : k; }

  /* ---------- 人員 ---------- */
  function renderStaff(body) {
    var pending = D.staff.filter(function (s) { return s.applyStatus === '待審核'; });
    if (pending.length && can('approveStaff')) {
      var pc = el('<div class="card" style="margin-bottom:16px"><div class="toolbar"><h3 class="grow">待審核的註冊申請（' + pending.length + '）</h3></div>' +
        '<div class="table-wrap"><table class="simple"><thead><tr><th>名稱</th><th>信箱</th><th>申請說明</th><th>申請時間</th><th></th></tr></thead><tbody></tbody></table></div></div>');
      if (!D.approval.staffApproval) $('.toolbar', pc).insertAdjacentHTML('beforeend', '<span class="small muted">核准設定已關閉，之後的新人員會直接啟用</span>');
      pending.forEach(function (s) {
        var tr = el('<tr><td></td><td></td><td></td><td></td><td style="text-align:right;white-space:nowrap"><button class="btn sm danger" type="button">拒絕</button> <button class="btn sm primary" type="button">核准</button></td></tr>');
        var td = $$('td', tr);
        td[0].textContent = s.name; td[1].textContent = s.email; td[2].textContent = s.applyNote || '—'; td[3].textContent = fmtTime(s.createdAt);
        var b = $$('button', tr);
        b[0].addEventListener('click', function () { rejectApply(s); });
        b[1].addEventListener('click', function () { approveApply(s); });
        $('tbody', pc).appendChild(tr);
      });
      body.appendChild(pc);
    }
    var card = el('<div class="card"><div class="toolbar"><h3 class="grow">管理員</h3>' + (can('manageStaff') ? '<button class="btn primary sm" type="button">新增共同管理員</button>' : '') + '</div>' +
      '<div class="table-wrap"><table class="simple"><thead><tr><th>名稱</th><th>信箱</th><th>角色</th><th>可管理專案</th><th>總管授予的權限</th><th>狀態</th><th></th></tr></thead><tbody></tbody></table></div></div>');
    if (can('manageStaff')) $('.toolbar button', card).addEventListener('click', function () { editStaff(null); });
    var tb = $('tbody', card);
    D.staff.filter(function (s) { return s.applyStatus !== '待審核'; }).forEach(function (s) {
      var tr = el('<tr><td></td><td></td><td></td><td></td><td></td><td></td><td style="text-align:right;white-space:nowrap"></td></tr>');
      var td = $$('td', tr);
      td[0].textContent = s.name;
      td[1].textContent = s.email;
      td[2].innerHTML = '<span class="role-tag' + (s.isOwner ? ' owner' : s.isRoot ? ' root' : '') + '">' + esc(s.role) + '</span>' + (s.isOwner && s.isChief ? '<span class="role-tag root" style="margin-left:4px">總管</span>' : '');
      td[3].textContent = s.isRoot || s.perms.indexOf('allProjects') >= 0 ? '全部專案' : (s.projects.join('、') || '—');
      td[4].innerHTML = s.isRoot ? '<span class="small muted">全部</span>' : s.perms.length ? '<div class="perm-tags">' + s.perms.map(function (k) { return '<span class="perm-tag">' + esc(permLabel(k)) + '</span>'; }).join('') + '</div>' : '<span class="small muted">—</span>';
      td[5].innerHTML = (s.applyStatus === '已拒絕' ? '<span class="pill mute">申請未通過</span>' :
        s.enabled ? pill('運作中').replace('運作中', '啟用') : '<span class="pill mute">停用</span>') +
        '<div class="small ' + (s.termsVersion === D.terms.version ? 'muted' : 'warn-text') + '" style="margin-top:4px">' +
        (s.termsVersion ? '同意書第 ' + s.termsVersion + ' 版' + (s.termsVersion === D.terms.version ? '' : '（需重新同意）') : '尚未同意同意書') + '</div>';
      var acts = td[6];
      function btn(label, fn, cls) { var b = el('<button class="btn sm ' + (cls || '') + '" type="button" style="margin-left:6px"></button>'); b.textContent = label; b.addEventListener('click', fn); acts.appendChild(b); }
      // 有授權的人只有總管能停用或重設密碼（避免互相接管）
      var touchable = !s.isRoot && (D.me.isRoot || !s.perms.length || s.email === D.me.email);
      if (D.me.isRoot && !s.isRoot && s.enabled) btn('權限', function () { editPerms(s); });
      if (can('manageStaff') && (!s.isRoot || D.me.isRoot) && (!s.isOwner || D.me.isOwner)) btn('編輯', function () { editStaff(s); });
      if (can('manageStaff') && touchable) btn('重設密碼', function () { resetPw(s); });
      if (s.applyStatus === '已拒絕' && can('approveStaff')) btn('改為核准', function () { approveApply(s); });
      else if (can('manageStaff') && touchable) btn(s.enabled ? '停用' : '啟用', function () { toggleStaff(s); }, s.enabled ? 'danger' : '');
      tb.appendChild(tr);
    });
    body.appendChild(card);
  }

  function editStaff(s) {
    var isNew = !s;
    var form = el('<form style="display:flex;flex-direction:column;gap:14px" onsubmit="return false">' +
      '<label class="field"><span>名稱</span><input class="input" name="name"></label>' +
      '<label class="field"><span>信箱</span><input class="input" name="email" type="email"></label>' +
      (isNew ? '<label class="field"><span>密碼</span><input class="input" name="password" type="password" autocomplete="new-password"><span class="hint">至少 8 個字元</span></label>' : '') +
      (s && s.isRoot ? '<div class="hint">' + (s.isOwner ? esc(D.ownerTitle || '創辦人') : '總管') + '只能修改名稱；總管要換人請到「權限與移交」。</div>' :
        '<div class="field"><span class="small muted">可管理專案</span><div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">' +
        D.projects.map(function (p) { return '<label class="check"><input type="checkbox" name="proj" value="' + esc(p.prefix) + '"' + (s && s.projects.indexOf(p.prefix) >= 0 ? ' checked' : '') + '><span>' + esc(p.prefix + '　' + p.name) + '</span></label>'; }).join('') +
        '</div></div>') +
      '</form>');
    form.elements.name.value = s ? s.name : '';
    form.elements.email.value = s ? s.email : '';
    if (!isNew) form.elements.email.disabled = true;
    modal({
      title: isNew ? '新增共同管理員' : '編輯管理員', body: form,
      buttons: [{ label: '取消', value: null }, {
        label: '儲存', cls: 'primary', value: function () {
          return {
            isNew: isNew, name: form.elements.name.value.trim(), email: form.elements.email.value.trim(),
            password: isNew ? form.elements.password.value : '',
            projects: $$('input[name=proj]:checked', form).map(function (i) { return i.value; })
          };
        }
      }]
    }).then(function (d) {
      if (!d) return;
      withBusy(api('saveStaff', d)).then(function () { toast('已儲存'); load(); }).catch(function (e) { toast(e.message, true); });
    });
  }

  function approveApply(s) {
    var form = el('<form style="display:flex;flex-direction:column;gap:14px" onsubmit="return false">' +
      '<dl class="kv"><dt>信箱</dt><dd></dd><dt>申請說明</dt><dd></dd></dl>' +
      '<label class="field"><span>名稱</span><input class="input" name="name"></label>' +
      '<div class="field"><span class="small muted">可管理專案（可以之後再用「編輯」調整）</span><div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">' +
      (D.projects.length ? D.projects.filter(function (p) { return p.status !== '未核准'; }).map(function (p) { return '<label class="check"><input type="checkbox" name="proj" value="' + esc(p.prefix) + '"><span>' + esc(p.prefix + '　' + p.name) + '</span></label>'; }).join('') : '<span class="small muted">目前沒有專案</span>') +
      '</div></div></form>');
    var dd = $$('dd', form);
    dd[0].textContent = s.email; dd[1].textContent = s.applyNote || '—';
    form.elements.name.value = s.name;
    modal({
      title: '核准註冊：' + s.name, desc: '核准後此帳號可以登入，只能管理勾選的專案。', body: form,
      buttons: [{ label: '取消', value: null }, { label: '核准', cls: 'primary', value: function () {
        return { name: form.elements.name.value.trim(), projects: $$('input[name=proj]:checked', form).map(function (i) { return i.value; }) };
      } }]
    }).then(function (d) {
      if (!d) return;
      withBusy(api('approveStaff', s.email, d.projects, d.name)).then(function () { toast('已核准 ' + s.name); load(); }).catch(function (e) { toast(e.message, true); });
    });
  }

  function rejectApply(s) {
    formDialog({ title: '拒絕註冊：' + s.name, desc: s.email + '　拒絕後此帳號不能登入，本人可以重新申請。', okLabel: '拒絕', danger: true,
      fields: [{ name: 'reason', label: '原因（只記錄在操作紀錄，不會寄給申請人）', type: 'textarea' }] })
      .then(function (v) {
        if (!v) return;
        withBusy(api('rejectStaff', s.email, v.reason)).then(function () { toast('已拒絕'); load(); }).catch(function (e) { toast(e.message, true); });
      });
  }

  function resetPw(s) {
    formDialog({ title: '重設密碼：' + s.name, okLabel: '重設', fields: [{ name: 'pw', label: '新密碼', type: 'password', required: true, hint: '至少 8 個字元，請另行告知本人；本人登入後會被要求改成自己的密碼' }] })
      .then(function (v) {
        if (!v) return;
        withBusy(api('resetStaffPassword', s.email, v.pw)).then(function () { toast('已重設密碼'); }).catch(function (e) { toast(e.message, true); });
      });
  }

  function toggleStaff(s) {
    confirmDialog({ title: (s.enabled ? '停用' : '啟用') + ' ' + s.name, lines: [s.enabled ? '停用後此帳號無法登入' : '啟用後可再次登入'], danger: s.enabled, okLabel: s.enabled ? '停用' : '啟用' })
      .then(function (ok) {
        if (!ok) return;
        withBusy(api('setStaffEnabled', s.email, !s.enabled)).then(function () { toast('已更新'); load(); }).catch(function (e) { toast(e.message, true); });
      });
  }

  /* ---------- 專案 ---------- */
  function renderProjects(body) {
    var pend = D.projects.filter(function (p) { return p.status === '待核准'; });
    if (can('approveProject')) {
      var pc = el('<div class="card" style="margin-bottom:16px"><div class="toolbar"><div class="grow"><h3 style="margin:0">待核准的新專案（' + pend.length + '）</h3>' +
        '<div class="small muted">' + (D.approval.projectApproval ? '共同管理建立的專案核准後才開始收報名、寄信。' : '核准設定已關閉，之後的新專案會直接運作。') + '</div></div></div>' +
        '<div class="table-wrap"><table class="simple"><thead><tr><th>專案</th><th>營期</th><th>招生</th><th>建立者</th><th></th></tr></thead><tbody></tbody></table></div></div>');
      var ptb = $('tbody', pc);
      pend.forEach(function (p) {
        var tr = el('<tr><td><b></b><div class="small muted"></div></td><td></td><td></td><td></td><td style="text-align:right;white-space:nowrap"><button class="btn sm danger" type="button">退回</button> <button class="btn sm primary" type="button">核准</button></td></tr>');
        var td = $$('td', tr);
        $('b', td[0]).textContent = p.prefix + '　' + p.name;
        $('.small', td[0]).textContent = '表單：' + ((p.review && p.review.formTitle) || p.formUrl || '');
        td[1].textContent = fmtDate(p.start) + ' – ' + fmtDate(p.end);
        td[2].textContent = (p.regStart ? fmtDate(p.regStart) : '不限') + ' – ' + (p.regEnd ? fmtDate(p.regEnd) : '未定') + '，上限 ' + p.capacity + ' 人，原價 ' + p.price;
        td[3].innerHTML = esc(p.createdBy) + '<div class="small muted">' + esc(fmtTime(p.createdAt)) + '</div>';
        var b = $$('button', tr);
        b[0].addEventListener('click', function () { rejectProj(p); });
        b[1].addEventListener('click', function () { approveProj(p); });
        ptb.appendChild(tr);
      });
      if (!pend.length) ptb.innerHTML = '<tr><td colspan="5"><div class="empty">目前沒有待核准的專案</div></td></tr>';
      body.appendChild(pc);
    }
    if (!can('projectStatus') && !can('siteMaint')) return;
    var g = el('<div class="card card-pad" style="margin-bottom:16px"><div class="row"><div class="grow"><h3>停止全部專案</h3>' +
      '<div class="small muted">開啟後所有專案只能瀏覽：不抄寫新回覆、不寄信、不可修改。</div></div>' +
      '<button class="switch' + (D.globalStop ? ' on' : '') + '" type="button"></button></div></div>');
    $('.switch', g).addEventListener('click', function () {
      var on = !D.globalStop;
      confirmDialog({ title: on ? '停止全部專案' : '恢復全部專案', lines: on ? ['所有專案立即停止運作，只能瀏覽'] : ['恢復各專案原本的狀態'], danger: on, okLabel: on ? '全部停止' : '恢復' })
        .then(function (ok) {
          if (!ok) return;
          withBusy(api('setGlobalStop', on)).then(function () { toast(on ? '已停止全部專案' : '已恢復'); load(); }).catch(function (e) { toast(e.message, true); });
        });
    });
    if (can('projectStatus')) body.appendChild(g);

    var paused = D.sitePaused || {};
    var m = el('<div class="card card-pad" style="margin-bottom:16px"><div class="row"><div class="grow"><h3>全站維護</h3>' +
      '<div class="small muted">勾選要暫停的服務後按「套用」。暫停期間學員仍可填表，回覆會排隊，恢復後依提交時間補處理，不會遺失。' +
      (D.siteMaint && D.siteMaintBy ? '<br>目前由 ' + esc(D.siteMaintBy.split(' ')[0]) + ' 於 ' + esc(fmtTime(D.siteMaintBy.split(' ')[1])) + ' 設定。' : '') + '</div></div>' +
      '<span class="pill ' + (D.siteMaint ? 'warn' : 'ok') + '">' + (D.siteMaint ? '維護中' : '全部運作') + '</span></div>' +
      '<div class="maint-grid"></div>' +
      '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">' +
      (D.siteMaint ? '<button class="btn" type="button" data-act="resume">全部恢復</button>' : '') +
      '<button class="btn primary" type="button" data-act="apply">套用</button></div></div>');
    var grid = $('.maint-grid', m);
    (D.siteServices || []).forEach(function (x) {
      // 尚未開啟維護時，預設只勾「非總管登入」
      var checked = D.siteMaint ? !!paused[x.key] : x.key === 'login';
      var it = el('<label class="maint-item"><input type="checkbox"><span><b></b><span class="small muted"></span></span></label>');
      $('input', it).value = x.key; $('input', it).checked = checked;
      $('b', it).textContent = x.label; $('.small', it).textContent = x.desc;
      if (paused[x.key]) it.classList.add('paused');
      grid.appendChild(it);
    });
    function applyMaint(want) {
      var on = [], off = [];
      (D.siteServices || []).forEach(function (x) {
        if (want[x.key] && !paused[x.key]) on.push(x.label);
        if (!want[x.key] && paused[x.key]) off.push(x.label);
      });
      if (!on.length && !off.length) { toast('設定沒有變更'); return; }
      var lines = [];
      if (on.length) lines.push('暫停：' + on.join('、'));
      if (off.length) lines.push('恢復：' + off.join('、'));
      if (want.login && !paused.login) lines.push('總管以外的人立即無法登入，已登入的人會被登出（含保持登入）');
      if (!want.intake && paused.intake) lines.push('排隊中的表單回覆會立刻依提交時間補處理');
      confirmDialog({ title: '全站維護', lines: lines, danger: on.length > 0, okLabel: '套用' }).then(function (ok) {
        if (!ok) return;
        withBusy(api('setSiteMaintenance', want)).then(function (r) {
          toast('已套用' + (r && r.caughtUp ? '，補處理 ' + r.caughtUp + ' 筆排隊回覆' : ''));
          location.href = 'admin.html?tab=projects';
        }).catch(function (e) { toast(e.message, true); });
      });
    }
    $('[data-act=apply]', m).addEventListener('click', function () {
      var want = {};
      $$('input', grid).forEach(function (i) { if (i.checked) want[i.value] = true; });
      applyMaint(want);
    });
    if (D.siteMaint) $('[data-act=resume]', m).addEventListener('click', function () { applyMaint({}); });
    if (can('siteMaint')) body.appendChild(m);
    if (!can('projectStatus')) return;

    var card = el('<div class="card"><div class="table-wrap"><table class="simple"><thead><tr><th>專案代碼</th><th>營隊名稱</th><th>營期</th><th>設定狀態</th><th>實際狀態</th><th></th></tr></thead><tbody></tbody></table></div></div>');
    var tb = $('tbody', card);
    D.projects.forEach(function (p) {
      var tr = el('<tr><td></td><td></td><td></td><td></td><td></td><td style="text-align:right;white-space:nowrap"></td></tr>');
      var td = $$('td', tr);
      td[0].textContent = p.prefix;
      td[1].textContent = p.name;
      td[2].textContent = fmtDate(p.start) + ' – ' + fmtDate(p.end);
      td[3].innerHTML = pill(p.status) + (p.maintBy ? '<div class="small muted">' + esc(p.maintBy) + '</div>' : '');
      td[4].innerHTML = pill(p.effective);
      function btn(label, fn, cls) { var b = el('<button class="btn sm ' + (cls || '') + '" type="button" style="margin-left:6px"></button>'); b.textContent = label; b.addEventListener('click', fn); td[5].appendChild(b); }
      if (p.canOpen) btn('開啟', function () { go('students', { prefix: p.prefix, title: p.name }); });
      if (p.status !== '已封存' && p.status !== '待核准' && p.status !== '未核准') {
        if (p.status === '已停止') btn('恢復運作', function () { setStatus(p, '運作中'); });
        else btn('停止專案', function () { setStatus(p, '已停止'); }, 'danger');
        btn('封存', function () { archive(p); }, 'danger');
      }
      tb.appendChild(tr);
    });
    if (!D.projects.length) tb.innerHTML = '<tr><td colspan="6"><div class="empty">尚無專案</div></td></tr>';
    body.appendChild(card);
  }

  function approveProj(p) {
    confirmDialog({ title: '核准新專案：' + p.name, lines: ['專案代碼 ' + p.prefix + '，建立者 ' + p.createdBy, '核准後立即掛上表單觸發器、開始收報名與寄信',
      '表單上既有的回覆會匯入' + (p.review && p.review.notifyExisting ? '並寄出通知' : '，不寄通知'), '建立者會收到核准通知'], okLabel: '核准' })
      .then(function (ok) {
        if (!ok) return;
        withBusy(api('approveProject', p.prefix)).then(function (r) { toast('已核准' + (r.imported ? '，匯入 ' + r.imported + ' 筆回覆' : '')); load(); }).catch(function (e) { toast(e.message, true); });
      });
  }

  function rejectProj(p) {
    formDialog({ title: '退回新專案：' + p.name, desc: '退回後專案改為「未核准」，建立者會收到通知，可以修改後用同一個代碼重新送出。', okLabel: '退回', danger: true,
      fields: [{ name: 'reason', label: '原因（會寄給建立者）', type: 'textarea' }] })
      .then(function (v) {
        if (!v) return;
        withBusy(api('rejectProject', p.prefix, v.reason)).then(function () { toast('已退回'); load(); }).catch(function (e) { toast(e.message, true); });
      });
  }

  function setStatus(p, status) {
    var stop = status === '已停止';
    confirmDialog({ title: (stop ? '停止專案：' : '恢復專案：') + p.name, lines: stop ? ['停止後此專案只能瀏覽，不抄寫新回覆、不寄信'] : ['恢復為運作中'], danger: stop, okLabel: stop ? '停止' : '恢復' })
      .then(function (ok) {
        if (!ok) return;
        withBusy(api('setProjectStatus', p.prefix, status)).then(function () { toast('已更新'); load(); }).catch(function (e) { toast(e.message, true); });
      });
  }

  function archive(p) {
    confirmDialog({ title: '封存專案：' + p.name, lines: ['移除表單觸發器，不再抄寫新回覆', '隱藏並保護「' + p.prefix + '_」開頭的所有活頁', '封存後只能瀏覽，無法恢復運作'], danger: true, okLabel: '封存' })
      .then(function (ok) {
        if (!ok) return;
        withBusy(api('archiveProject', p.prefix)).then(function () { toast('已封存'); load(); }).catch(function (e) { toast(e.message, true); });
      });
  }

  /* ---------- 信件範本 ---------- */
  function editTemplate(t) {
    openTemplateEditor(t, {
      headerColor: D.defaultHeaderColor,
      footer: D.mailFooter, footerWhere: '系統管理 → 信件範本最下方；各專案也可在專案設定改', sigWhere: '各專案可在專案設定 → 信件署名改' }).then(function (v) {
      if (!v) return;
      withBusy(api('saveTemplate', t.code, v.subject, v.body, { footer: v.footer, signature: v.signature, headerColor: v.headerColor })).then(function () { toast('範本已儲存'); load(); }).catch(function (e) { toast(e.message, true); });
    });
  }

  function renderPresets(body) {
    var defs = D.presetDefs || [];
    var card = el('<div class="card" style="margin-top:16px"><div class="toolbar"><div class="grow"><h3 style="margin:0">常用清單</h3><div class="small muted">管理者執行匯款異常、取消報名等操作時，點一下就能填入，不用每次打字。每行一項。</div></div>' +
      '<button class="btn primary" type="button">儲存清單</button></div><div class="preset-list"></div></div>');
    var list = $('.preset-list', card);
    defs.forEach(function (d) {
      var f = el('<label class="field"><span></span><textarea class="input"></textarea></label>');
      $('span', f).textContent = d.label;
      $('textarea', f).name = d.key;
      $('textarea', f).value = (D.presets[d.key] || []).join('\n');
      list.appendChild(f);
    });
    $('button', card).addEventListener('click', function () {
      var out = {};
      defs.forEach(function (d) { out[d.key] = $('[name=' + d.key + ']', card).value.split('\n').map(function (x) { return x.trim(); }).filter(String); });
      withBusy(api('savePresets', out)).then(function () { toast('常用清單已儲存'); load(); }).catch(function (e) { toast(e.message, true); });
    });
    body.appendChild(card);
  }

  /** 系統預設的信件附註：每封信最後的灰色小字；各專案可自訂或不加 */
  function renderFooter(body) {
    var card = el('<div class="card card-pad" style="margin-top:16px"><div class="row"><div class="grow"><h3 style="margin:0">信件附註（系統預設）</h3>' +
      '<div class="small muted">每封信內容之後、署名之前，以分隔線隔開的灰色小字。各專案可在「專案設定 → 信件附註」改成自己的或不加；清空表示預設不加附註。</div></div></div>' +
      '<div class="field" style="margin-top:12px"><textarea class="input" rows="5"></textarea></div>' +
      '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn ghost" type="button" data-a="dflt">填入原始預設</button><button class="btn primary" type="button" data-a="save">儲存附註</button></div></div>');
    var ta = $('textarea', card);
    ta.value = D.mailFooter || '';
    var ed = chipEditor(ta);
    ta.parentNode.insertBefore(formatToolbar(ed, { vars: true }), ta);
    $('[data-a=dflt]', card).addEventListener('click', function () { ed.value = D.mailFooterDefault; });
    $('[data-a=save]', card).addEventListener('click', function () {
      withBusy(api('saveMailFooter', ed.value)).then(function (r) { toast(r ? '信件附註已儲存' : '內容沒有變更'); load(); }).catch(function (e) { toast(e.message, true); });
    });
    body.appendChild(card);
  }

  function renderTemplates(body) {
    var card = el('<div class="card"><div class="toolbar"><div class="grow small muted">這裡是系統預設範本，所有專案共用；各專案可在「報名與學員管理 → 信件範本」複製一份直接修改（例如加上飯店、總召資訊）。</div></div>' +
      '<table class="simple"><thead><tr><th>通知</th><th>主旨</th><th></th></tr></thead><tbody></tbody></table></div>');
    var tb = $('tbody', card);
    D.templates.forEach(function (t) {
      var tr = el('<tr><td></td><td></td><td style="text-align:right"><button class="btn sm" type="button">編輯</button></td></tr>');
      $$('td', tr)[0].innerHTML = '<span class="tpl-dot" style="background:' + (normHex(t.headerColor) || D.defaultHeaderColor || '#2f5d62') + '"></span>' + esc(t.name);
      $$('td', tr)[1].textContent = t.subject;
      $('button', tr).addEventListener('click', function () { editTemplate(t); });
      tb.appendChild(tr);
    });
    body.appendChild(card);
    renderFooter(body);
    renderPresets(body);
  }

  /* ---------- 權限與移交（總管與創辦人） ---------- */
  function editPerms(s) {
    var form = el('<form class="perm-form" onsubmit="return false"></form>');
    D.permDefs.forEach(function (x) {
      var it = el('<label class="maint-item"><input type="checkbox" name="perm"><span><b></b><span class="small muted"></span></span></label>');
      $('input', it).value = x.key; $('input', it).checked = s.perms.indexOf(x.key) >= 0;
      $('b', it).textContent = x.label; $('.small', it).textContent = x.desc;
      form.appendChild(it);
    });
    modal({
      title: '授予權限：' + s.name, desc: s.email + '　授予、移交總管與核准設定只有總管可以做；每一項變更都會記錄。', body: form, cls: 'wide',
      buttons: [{ label: '取消', value: null }, { label: '儲存', cls: 'primary', value: function () { return $$('input[name=perm]:checked', form).map(function (i) { return i.value; }); } }]
    }).then(function (perms) {
      if (!perms) return;
      withBusy(api('setStaffPerms', s.email, perms)).then(function (r) {
        var msg = [];
        if (r.added.length) msg.push('授予：' + r.added.join('、'));
        if (r.removed.length) msg.push('收回：' + r.removed.join('、'));
        toast(msg.join('；') || '權限沒有變更'); load();
      }).catch(function (e) { toast(e.message, true); });
    });
  }

  function renderPerms(body) {
    var ac = el('<div class="card card-pad" style="margin-bottom:16px"><h3>核准設定</h3><div class="small muted" style="margin-bottom:12px">決定新人員、新專案是否要先經過核准。總管與有「核准人員」「核准新專案」權限的人，自己新增的不用等核准。</div><div class="approval-list"></div></div>');
    var list = $('.approval-list', ac);
    D.approvalDefs.forEach(function (x) {
      var on = !!D.approval[x.key];
      var row = el('<div class="row approval-row"><div class="grow"><b></b><div class="small muted"></div></div><button class="switch' + (on ? ' on' : '') + '" type="button"></button></div>');
      $('b', row).textContent = x.label; $('.small', row).textContent = x.desc;
      $('.switch', row).setAttribute('aria-label', x.label);
      $('.switch', row).addEventListener('click', function () {
        var d = {}; d[x.key] = !on;
        confirmDialog({ title: (on ? '關閉：' : '開啟：') + x.label, lines: [x.desc], okLabel: on ? '關閉' : '開啟', danger: on && x.key !== 'coCreate' })
          .then(function (ok) {
            if (!ok) return;
            withBusy(api('setApprovalSettings', d)).then(function () { toast('已更新'); load(); }).catch(function (e) { toast(e.message, true); });
          });
      });
      list.appendChild(row);
    });
    body.appendChild(ac);

    var co = D.staff.filter(function (s) { return !s.isRoot && s.enabled; });
    var pc = el('<div class="card" style="margin-bottom:16px"><div class="toolbar"><div class="grow"><h3 style="margin:0">授予權限</h3><div class="small muted">把總管的部分功能交給信任的共同管理。點「設定」逐項勾選。</div></div></div>' +
      '<div class="table-wrap"><table class="simple perm-matrix"><thead><tr><th>人員</th>' + D.permDefs.map(function (x) { return '<th title="' + esc(x.desc) + '">' + esc(x.label) + '</th>'; }).join('') + '<th></th></tr></thead><tbody></tbody></table></div></div>');
    var tb = $('tbody', pc);
    co.forEach(function (s) {
      var tr = el('<tr><td><b></b><div class="small muted"></div></td>' + D.permDefs.map(function (x) { return '<td class="perm-cell">' + (s.perms.indexOf(x.key) >= 0 ? '<span class="perm-yes" aria-label="有">●</span>' : '<span class="muted" aria-label="無">·</span>') + '</td>'; }).join('') +
        '<td style="text-align:right"><button class="btn sm" type="button">設定</button></td></tr>');
      $('b', tr).textContent = s.name; $('.small', tr).textContent = s.email;
      $('button', tr).addEventListener('click', function () { editPerms(s); });
      tb.appendChild(tr);
    });
    if (!co.length) tb.innerHTML = '<tr><td colspan="' + (D.permDefs.length + 2) + '"><div class="empty">還沒有已啟用的共同管理員</div></td></tr>';
    body.appendChild(pc);

    var tm = el('<div class="card card-pad" style="margin-bottom:16px"><div class="row"><div class="grow"><h3 style="margin:0">聲明同意書</h3>' +
      '<div class="small muted">註冊時必須閱讀並勾選；已有帳號的人登入後也會被要求同意。修改內容後版本加一，所有人下次使用時要重新同意。</div></div>' +
      '<span class="pill brand">第 ' + D.terms.version + ' 版' + (D.terms.isDefault ? '（預設內容）' : '') + '</span></div>' +
      '<label class="field" style="margin-top:12px"><span>標題：' + esc(D.terms.title) + '</span><textarea class="input terms-edit" rows="14"></textarea></label>' +
      '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" type="button">儲存為新版本</button></div></div>');
    $('textarea', tm).value = D.terms.text;
    $('button', tm).addEventListener('click', function () {
      var text = $('textarea', tm).value;
      if (text.trim() === D.terms.text.trim()) { toast('內容沒有變更'); return; }
      confirmDialog({ title: '儲存聲明同意書第 ' + (D.terms.version + 1) + ' 版', lines: ['所有人（包含你）下次使用時都要重新閱讀並同意', '修改前後的內容會記錄在操作紀錄'], okLabel: '儲存' })
        .then(function (ok) {
          if (!ok) return;
          withBusy(api('saveTerms', text)).then(function (r) { toast('已儲存為第 ' + r.version + ' 版'); location.reload(); }).catch(function (e) { toast(e.message, true); });
        });
    });
    body.appendChild(tm);

    var OWN = D.ownerTitle || '創辦人';
    var chief = D.staff.filter(function (s) { return s.isChief; })[0];
    var owner = D.staff.filter(function (s) { return s.isOwner; })[0];
    var desc, btns;
    if (D.me.isOwner && D.me.isChief) {
      desc = '你是' + OWN + '，目前也擔任總管。可以把總管交給另一位管理員負責日常管理；你仍保有全部權限，隨時可以收回。雙方都會收到通知信，並記錄在操作紀錄。';
      btns = '<button class="btn danger" type="button" data-t="give">指派總管…</button>';
    } else if (D.me.isOwner) {
      desc = '目前的總管是 ' + (chief ? chief.name + '（' + chief.email + '）' : '（未指定）') + '。你是' + OWN + '，不受移交影響、保有全部權限，可以隨時收回總管或改指派給其他人。';
      btns = '<button class="btn" type="button" data-t="give">改指派…</button><button class="btn danger" type="button" data-t="reclaim">收回總管…</button>';
    } else {
      desc = '把總管交給另一位已啟用的管理員。移交後你會變成共同管理，系統管理的功能改由對方使用；雙方都會收到通知信，並記錄在操作紀錄。' +
        (owner ? OWN + ' ' + owner.name + ' 不受影響，隨時可以收回總管。' : '');
      btns = '<button class="btn danger" type="button" data-t="give">移交總管…</button>';
    }
    var tc = el('<div class="card card-pad transfer-card"><h3>' + (D.me.isOwner ? '總管指派' : '移交總管') + '</h3><div class="small muted" style="margin-bottom:12px"></div>' +
      '<div class="row" style="justify-content:flex-end;gap:8px">' + btns + '</div></div>');
    $('.small', tc).textContent = desc;
    $$('[data-t]', tc).forEach(function (b) { b.addEventListener('click', function () { transfer(b.getAttribute('data-t'), chief); }); });
    body.appendChild(tc);
  }

  function transfer(mode, chief) {
    var OWN = D.ownerTitle || '創辦人';
    var me = D.staff.filter(function (s) { return s.email === D.me.email; })[0] || { name: '你', email: D.me.email };
    function done(msg) {
      toast(msg);
      if (D.me.isOwner) load(); else setTimeout(function () { go('menu'); }, 1200);
    }
    if (mode === 'reclaim') {
      var other = chief && !chief.isOwner ? chief : null;
      formDialog({
        title: '收回總管', desc: '收回後你會重新擔任總管' + (other ? '，' + other.name + ' 改為共同管理' : '') + '。雙方都會收到通知信。', okLabel: '收回總管', danger: true,
        fields: (other ? [{ name: 'keep', label: other.name + ' 改為共同管理後，仍可以管理所有現有專案', type: 'checkbox', value: true }] : [])
          .concat([{ name: 'pw', label: '再輸入一次你的密碼', type: 'password', required: true }])
      }).then(function (v) {
        if (!v) return;
        withBusy(api('transferRoot', D.me.email, v.pw, !!v.keep)).then(function () { done('已收回總管'); }).catch(function (e) { toast(e.message, true); });
      });
      return;
    }
    var co = D.staff.filter(function (s) { return !s.isRoot && s.enabled; });
    if (!co.length) { toast('沒有可以指派的對象，請先新增並啟用一位共同管理員', true); return; }
    var keepLabel = D.me.isOwner
      ? (chief && !chief.isOwner ? '原總管 ' + chief.name + ' 改為共同管理後，仍可以管理所有現有專案' : null)
      : '移交後我仍可以管理所有現有專案';
    var fields = [{ name: 'to', label: '新總管', type: 'select', options: co.map(function (s) { return { value: s.email, label: s.name + '（' + s.email + '）' }; }), required: true }];
    if (keepLabel) fields.push({ name: 'keep', label: keepLabel, type: 'checkbox', value: true });
    fields.push({ name: 'pw', label: '再輸入一次你的密碼', type: 'password', required: true });
    formDialog({
      title: D.me.isOwner ? '指派總管' : '移交總管',
      desc: '這個操作會立即生效。' + (D.me.isOwner ? '你仍是' + OWN + '，隨時可以收回。' : OWN + '隨時可以收回總管。'),
      okLabel: '確認', danger: true, fields: fields
    }).then(function (v) {
      if (!v) return;
      var t = co.filter(function (s) { return s.email === v.to; })[0];
      var lines = [t.email + ' 會成為總管'];
      if (!D.me.isOwner) lines.push('你會改為共同管理' + (v.keep ? '，保留所有現有專案' : ''), '系統管理頁面會關閉，回到功能選單');
      else if (chief && !chief.isOwner) lines.push(chief.name + ' 改為共同管理' + (v.keep ? '，保留所有現有專案' : ''));
      else lines.push('你仍是' + OWN + '，保有全部權限');
      confirmDialog({ title: '確定把總管交給 ' + t.name + '？', lines: lines, danger: true, okLabel: '確認' })
        .then(function (ok) {
          if (!ok) return;
          withBusy(api('transferRoot', v.to, v.pw, !!v.keep)).then(function () { done('總管已交給 ' + t.name); }).catch(function (e) { toast(e.message, true); });
        });
    });
  }

  load();
});
</script>
</body>
</html>
