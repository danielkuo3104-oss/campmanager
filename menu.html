<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="營隊管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>功能選單｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
  <main id="app">
<div class="view-menu hidden">
  <div class="page-head">
    <div>
      <h1 id="menu-hello"></h1>
      <div class="sub">選擇要使用的功能</div>
    </div>
  </div>
  <div id="menu-global" class="hidden"></div>

  <div class="section-title">報名與學員管理</div>
  <div class="tiles" id="menu-projects"><div class="loading"><div class="spinner"></div>載入專案</div></div>

  <div class="section-title">系統</div>
  <div class="tiles" id="menu-system"></div>
</div>
<div class="loading" id="page-loading"><div class="spinner"></div>載入中</div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
<script>
App.page('menu', function (root) {
  $('#menu-hello', root).textContent = '你好，' + App.user.name;

  var sys = $('#menu-system', root);
  function sysTile(name, desc, onClick) {
    var t = el('<div class="tile"><div class="tile-name"></div><div class="tile-meta"></div></div>');
    $('.tile-name', t).textContent = name;
    $('.tile-meta', t).textContent = desc;
    t.addEventListener('click', onClick);
    sys.appendChild(t);
  }
  sysTile('操作紀錄', '查詢所有操作與寄信紀錄', function () { go('logs'); });
  if (App.user.adminAccess) sysTile('系統管理', App.user.isRoot ? '管理人員、專案狀態、信件範本、權限與核准' : '使用總管授予你的管理功能', function () { go('admin'); });

  api('listProjects').then(function (r) {
    if (r.globalStop) {
      var g = $('#menu-global', root);
      g.className = 'banner bad';
      g.textContent = '總管已停止全部專案：目前所有專案只能瀏覽，不會寄信或寫回。';
    }
    var ap = r.approvals || {};
    if (ap.projects || ap.staff) {
      var g2 = $('#menu-global', root);
      var parts = [];
      if (ap.projects) parts.push(ap.projects + ' 個新專案');
      if (ap.staff) parts.push(ap.staff + ' 位人員');
      var bn = el('<div class="banner warn" style="cursor:pointer"></div>');
      bn.textContent = '有 ' + parts.join('、') + '等待核准，點這裡前往系統管理';
      bn.addEventListener('click', function () { go('admin', { tab: ap.projects ? 'projects' : 'staff' }); });
      g2.parentNode.insertBefore(bn, g2.nextSibling);
    }
    var box = $('#menu-projects', root);
    box.innerHTML = '';
    r.projects.forEach(function (p) {
      var pct = p.capacity ? Math.min(100, Math.round(p.active / p.capacity * 100)) : 0;
      var t = el('<div class="tile' + (p.status === '已封存' ? ' archived' : '') + '">' +
        '<div class="tile-top"><span class="tile-meta"></span>' + pill(p.effective) + '</div>' +
        '<div class="tile-name"></div>' +
        '<div class="tile-meta"></div>' +
        '<div><div class="row small"><span>已錄取 ' + p.active + ' / ' + p.capacity + '</span><span class="spacer"></span><span class="muted">候補 ' + p.waitlist + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div></div>');
      $$('.tile-meta', t)[0].textContent = p.prefix;
      $('.tile-name', t).textContent = p.name;
      $$('.tile-meta', t)[1].textContent = '營期 ' + fmtDate(p.start) + ' – ' + fmtDate(p.end) + (p.reviewNote ? '　·　' + p.reviewNote : p.readOnly ? '　·　僅可瀏覽' : '');
      t.addEventListener('click', function () { go('students', { prefix: p.prefix, title: p.name }); });
      box.appendChild(t);
    });
    if (r.canCreate) {
      var add = el('<div class="tile add"><div class="plus">＋</div><div class="tile-name">開始新專案</div><div class="tile-meta">連結舉辦方的 Google 表單' + (r.needsApproval ? '（需總管核准）' : '') + '</div></div>');
      add.addEventListener('click', function () { go('newproject'); });
      box.appendChild(add);
    }
    if (!r.projects.length && !r.canCreate) {
      box.innerHTML = '<div class="card card-pad empty" style="grid-column:1/-1">目前沒有你可以管理的專案</div>';
    }
  }).catch(function (e) { toast(e.message, true); });
});
</script>
</body>
</html>
