<!DOCTYPE html>
<!-- 營隊報名管理系統　© 2026 Daniel GUO. All rights reserved. -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b5fb4">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>學員專區</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/loading.js"></script>
  <style>
    /* 學員專區：每個專案自己的入口，學員用姓名＋身分證字號登入，只看得到自己的報名 */
    /* 學員專區用藍色調（和管理後台的綠色區分） */
    :root {
      --bg: #f1f5fb; --surface-2: #f4f7fc; --line: #e2e8f2; --line-strong: #cbd5e5;
      --text: #15233b; --text-2: #50607a; --text-3: #8391a8;
      --brand: #2b5fb4; --brand-2: #3d78d4; --brand-soft: #e5edfb;
      --accent: #2b5fb4; --accent-soft: #e5edfb; --info: #2b5fb4; --info-soft: #e5edfb;
      --focus: 0 0 0 4px rgba(43, 95, 180, .18);
      --shadow: 0 1px 2px rgba(20, 40, 80, .04), 0 6px 24px rgba(20, 40, 80, .07);
    }
    body { background: radial-gradient(900px 480px at 0% -10%, #dfe9fb 0%, transparent 60%), radial-gradient(800px 460px at 100% 0%, #e3f1fb 0%, transparent 55%), var(--bg); background-attachment: fixed; }
    ::selection { background: var(--brand-soft); }
    .btn.primary { box-shadow: 0 4px 14px rgba(43, 95, 180, .25); }
    .pt-rich [style*="color:#2f5d62"], #pt-foot [style*="color:#2f5d62"] { color: var(--brand) !important; }
    .pt-rich a[style*="background:#2f5d62"] { background: var(--brand) !important; }
    .pt-wrap { max-width: 680px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
    .pt-head { padding: 18px 24px; color: #fff; font-weight: 700; font-size: 17px; background: linear-gradient(135deg, #2552a3 0%, #3a7bd5 100%); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pt-head .grow { flex: 1 1 auto; min-width: 0; }
    .pt-head small { display: block; font-weight: 400; font-size: 13px; opacity: .85; margin-top: 2px; }
    .pt-head button { background: rgba(255, 255, 255, .18); color: inherit; border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    .pt-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .pt-body h1 { margin: 0; font-size: 22px; }
    .pt-body h2 { margin: 0; font-size: 16px; color: var(--text); }
    .pt-sec { display: flex; flex-direction: column; gap: 10px; }
    .pt-blocks { display: flex; flex-direction: column; gap: 16px; }
    .pt-blocks:empty { display: none; }
    .pt-blk { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .pt-blk h2 { margin: 0; font-size: 16px; color: var(--text); }
    .pt-blk > .pt-rich > :first-child { margin-top: 0 !important; }
    .pt-blk > .pt-rich > :last-child { margin-bottom: 0 !important; }
    .pt-status { display: inline-flex; align-self: flex-start; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--accent-soft, #e5edfb); color: var(--accent, #2b5fb4); }
    .pt-status.gone { background: var(--bad-soft); color: var(--bad); }
    .pt-text { line-height: 1.8; }
    .pt-steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; list-style: none; margin: 0; padding: 0; }
    .pt-steps li { min-width: 0; padding: 9px 3px; border-radius: 10px; background: var(--surface-2, #f4f5f3); color: var(--text-3); font-size: 12.5px; line-height: 1.35; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; word-break: keep-all; overflow-wrap: anywhere; }
    .pt-steps li i { font-style: normal; font-size: 11px; line-height: 1; }
    .pt-steps li.done { background: var(--accent-soft, #e5edfb); color: var(--accent, #2b5fb4); font-weight: 500; }
    .pt-steps li.now { background: var(--accent, #2b5fb4); color: #fff; font-weight: 700; }
    .pt-info { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pt-info div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pt-info div:last-child { border-bottom: 0; }
    .pt-info b { color: var(--text-2); font-weight: 500; }
    .pt-info span { min-width: 0; word-break: break-word; }
    .pt-acts { display: flex; gap: 8px; flex-wrap: wrap; }
    .pt-acts .btn.done { background: var(--surface-2, #f4f5f3); color: var(--text-3); border-color: var(--line); box-shadow: none; }
    .pt-fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .pt-fold > summary::-webkit-details-marker { display: none; }
    .pt-fold > summary::after { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--text-3); border-bottom: 2px solid var(--text-3); transform: rotate(45deg); margin-left: auto; transition: transform .15s; }
    .pt-fold[open] > summary::after { transform: rotate(-135deg); }
    .pt-fold-hint { font-size: 12px; color: var(--text-3); }
    .pt-fold[open] .pt-fold-hint { display: none; }
    .pt-rich [data-cb] { display: flex !important; gap: 10px; align-items: flex-start; padding: 6px 0 !important; text-indent: 0 !important; cursor: pointer; }
    .pt-rich [data-cb] .pt-cbx { width: 18px; height: 18px; margin: 3px 0 0; flex: none; accent-color: var(--accent, #2b5fb4); }
    .pt-rich [data-cb].on { color: var(--text-3); text-decoration: line-through; }
    .pt-msg { padding: 14px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); line-height: 1.7; }
    .pt-err { color: var(--bad); min-height: 18px; font-size: 13px; }
    .pt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pt-row > * { min-width: 0; }
    .pt-foot { color: var(--text-3); font-size: 13px; text-align: center; line-height: 1.7; }
    .pt-rich { line-height: 1.8; min-width: 0; overflow-wrap: anywhere; }
    .pt-rich table { width: 100%; }
    .pt-rich img { max-width: 100%; height: auto; }
    .pt-map { display: block; width: 100%; height: 200px; border: 0; border-radius: 10px; margin-top: 10px; background: #eaf0fa; }
    .pt-squad { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .pt-squad b { font-size: 22px; color: var(--accent, #2b5fb4); }
    .pt-staff { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pt-staff div { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pt-staff div:last-child { border-bottom: 0; }
    .pt-staff em { font-style: normal; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2, #f4f5f3); color: var(--text-2); }
    .pt-staff a { color: inherit; }
    .pt-staff span { color: var(--text-2); min-width: 0; overflow-wrap: anywhere; }
    .pt-cd { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .pt-cd[hidden] { display: none; }
    .pt-cd .lbl { font-size: 14px; color: var(--text-2); }
    .pt-cd .nums { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .pt-cd .nums div { min-width: 64px; padding: 10px 6px; border-radius: 12px; background: var(--surface-2, #f4f5f3); display: flex; flex-direction: column; gap: 2px; }
    .pt-cd .nums b { font-size: 28px; line-height: 1.1; color: var(--accent, #2b5fb4); font-variant-numeric: tabular-nums; }
    .pt-cd .nums span { font-size: 12px; color: var(--text-3); }
    .pt-cd[data-lvl=yellow] .nums div { background: #fbf4dc; } .pt-cd[data-lvl=yellow] .nums b { color: #a37b06; }
    .pt-cd[data-lvl=orange] .nums div { background: #fcebd9; } .pt-cd[data-lvl=orange] .nums b { color: #d06a12; }
    .pt-cd[data-lvl=deep] .nums div { background: #fadfcc; } .pt-cd[data-lvl=deep] .nums b { color: #b4480b; }
    .pt-cd[data-lvl=red] .nums div { background: #fbe0de; } .pt-cd[data-lvl=red] .nums b { color: #c62828; }
    .pt-cd .big { font-size: 20px; font-weight: 700; color: var(--accent, #2b5fb4); }
    .pt-check { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pt-check label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; line-height: 1.6; }
    .pt-check label:last-child { border-bottom: 0; }
    .pt-check input { width: 18px; height: 18px; margin-top: 3px; flex: 0 0 auto; accent-color: var(--accent, #2b5fb4); }
    .pt-check input:checked + span { color: var(--text-3); text-decoration: line-through; }
    .pt-check span { min-width: 0; overflow-wrap: anywhere; }
    .pt-cnt { font-size: 13px; font-weight: 400; color: var(--text-3); }
    .pt-log { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    .pt-log div { display: flex; gap: 10px; flex-wrap: wrap; }
    .pt-log time { color: var(--text-3); white-space: nowrap; }
    /* iPhone 點到字級小於 16px 的輸入框會自動放大畫面 */
    .input { font-size: 16px; }
    .pt-wrap a.btn { text-decoration: none; }
    /* 待辦：還沒做的事放在報名進度最上面，用主要按鈕 */
    .pt-todo { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft, #e5edfb); }
    .pt-todo > b { font-size: 14px; color: var(--accent, #2b5fb4); }
    .pt-todo-item { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .pt-todo-item + .pt-todo-item { border-top: 1px solid rgba(43, 95, 180, .15); padding-top: 10px; }
    .pt-todo-t { line-height: 1.6; }
    /* 取消報名：放在最下面、次要樣式 */
    .pt-quiet { border-top: 1px solid var(--line); padding-top: 10px; display: flex; justify-content: flex-end; }
    .pt-quiet .btn { color: var(--text-3); background: transparent; border-color: transparent; box-shadow: none; font-size: 13px; }
    .pt-faq { display: flex; flex-direction: column; }
    .pt-faq details { border-top: 1px solid var(--line); padding: 10px 0; }
    .pt-faq details:first-child { border-top: 0; padding-top: 0; }
    .pt-faq summary { cursor: pointer; font-weight: 500; line-height: 1.6; }
    .pt-faq .pt-rich { margin-top: 6px; color: var(--text-2); }
    .pt-cal { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pt-cal .lbl { font-size: 13px; color: var(--text-3); }
    .pt-edit { display: flex; flex-direction: column; gap: 12px; }
    .pt-mask { position: fixed; inset: 0; background: rgba(20, 24, 40, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
    .pt-dlg { background: var(--surface, #fff); border-radius: 18px; width: 100%; max-width: 480px; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow: auto; }
    .pt-dlg h2 { margin: 0; font-size: 18px; }
    .pt-dlg .input { width: 100%; box-sizing: border-box; }
    .pt-dlg .pl-body { display: flex; flex-direction: column; gap: 14px; }
    .pt-dlg .pl-body .pt-text { line-height: 1.7; }
    .pt-dlg-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (min-width: 521px) { .pt-mask { align-items: center; } }
    @media (max-width: 520px) { .pt-row { grid-template-columns: 1fr; } .pt-body { padding: 20px 16px; } .pt-blk { padding: 18px 16px; } }
  </style>
</head>
<body>
  <div class="pt-wrap">
    <div class="card pt-cd" id="pt-cd" hidden></div>
    <div class="card" id="pt-top">
      <div class="pt-head" id="pt-head"><div class="grow" id="pt-camp">載入中…</div></div>
      <div class="pt-body" id="pt-body"><div class="ld"><div class="ld-spin"></div><div class="ld-msg">載入中…</div></div></div>
    </div>
    <div class="pt-blocks" id="pt-blocks"></div>
    <div class="pt-foot" id="pt-foot"></div>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var prefix = q.get('p') || '', key = q.get('k') || '';
  var body = document.getElementById('pt-body'), blocks = document.getElementById('pt-blocks'), top = document.getElementById('pt-top'), cdBox = document.getElementById('pt-cd'), head = document.getElementById('pt-head'), camp = document.getElementById('pt-camp');
  var I = null;
  var store = 'portal_' + prefix + '_' + key;   // 登入憑證只存在這個分頁，關掉就登出

  function esc(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function getTok() { try { return sessionStorage.getItem(store) || ''; } catch (e) { return ''; } }
  function setTok(t) { try { if (t) sessionStorage.setItem(store, t); else sessionStorage.removeItem(store); } catch (e) {} }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!window.CAMP_CONFIG || !CAMP_CONFIG.API_URL) return Promise.reject(new Error('網站尚未設定完成，請洽籌辦團隊'));
    return fetch(CAMP_CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('連線失敗，請稍後再試'); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || '發生錯誤'); return j.result; });
  }
  /** 沒登入的畫面：清掉區塊卡片，倒數回到最上面，聯絡人員放頁尾 */
  function plain() {
    blocks.innerHTML = '';
    top.parentNode.insertBefore(cdBox, top);
    foot(true);
  }
  function foot(withContacts) {
    if (!I) return;
    document.getElementById('pt-foot').innerHTML = (withContacts && I.contactsHtml ? '<div style="text-align:left;margin-bottom:16px">' + I.contactsHtml + '</div>' : '') + I.signatureHtml;
  }
  function closed(msg) {
    plain();
    camp.textContent = '學員專區';
    body.innerHTML = '<div class="pt-msg"></div>';
    body.firstChild.textContent = msg;
  }
  function logoutBtn(on) {
    var b = document.getElementById('pt-out');
    if (on && !b) {
      b = document.createElement('button'); b.type = 'button'; b.id = 'pt-out'; b.textContent = '登出';
      b.addEventListener('click', function () { var t = getTok(); setTok(''); call('portalLogout', t).catch(function () {}); login(); });
      head.appendChild(b);
    }
    if (!on && b) b.remove();
  }

  function login(msg) {
    logoutBtn(false);
    plain();
    body.innerHTML = '<h1>學員專區</h1><div class="pt-text">輸入報名時填的學員姓名與' + esc(I.keyLabel) + '，查看你的報名進度、繳費資訊與營隊資訊。</div>' +
      (msg ? '<div class="pt-msg"></div>' : '') +
      '<form class="pt-sec" id="pt-login" autocomplete="on"><div class="pt-row">' +
      '<label class="field"><span>學員姓名</span><input class="input" name="name" autocomplete="name" required></label>' +
      '<label class="field"><span>' + esc(I.keyLabel) + '</span><input class="input" name="key" required' + (I.keyLabel === '身分證字號' ? ' autocapitalize="characters" maxlength="10" autocomplete="off"' : ' type="email" autocomplete="email"') + '></label></div>' +
      '<div class="pt-err"></div><div><button class="btn primary" type="submit">登入</button></div></form>';
    if (msg) body.querySelector('.pt-msg').textContent = msg;
    var form = document.getElementById('pt-login');
    form.elements.name.value = q.get('n') || '';
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button'), err = form.querySelector('.pt-err');
      err.textContent = ''; btnBusy(btn, true, '登入', '登入中…');
      call('portalLogin', prefix, key, form.elements.name.value.trim(), form.elements.key.value.trim()).then(function (r) {
        setTok(r.token);
        if (r.data) { logoutBtn(true); render(r.data); } else show();
      }).catch(function (e2) { err.textContent = e2.message; btnBusy(btn, false, '登入'); });
    });
  }

  function infoTable(rows) {
    return '<div class="pt-info">' + rows.map(function (x) { return '<div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('') + '</div>';
  }

  function show() {
    var tok = getTok();
    if (!tok) { login(); return; }
    showLoading(body, '正在載入你的報名資料…');
    (pending || call('portalData', tok, prefix, key)).then(function (d) {
      logoutBtn(true);
      render(d);
    }).catch(function (e) {
      if (/重新登入|過期/.test(e.message)) { setTok(''); login('登入已過期，請重新登入'); return; }
      body.innerHTML = '<div class="pt-msg"></div><div><button class="btn" type="button">重新整理</button></div>';
      body.querySelector('.pt-msg').textContent = e.message;
      body.querySelector('button').onclick = show;
    });
  }

  /** 學員看到的主畫面：問候在上方卡片，其他資訊依管理員排的順序各自一張圓角卡片；preview 時按鈕不能點（管理員預覽） */
  function render(d, preview) {
      body.innerHTML = '<h1>' + esc(d.name) + ' 你好</h1>';
      foot(false);
      function card(title, inner, extra) { return '<section class="card pt-blk"' + (extra || '') + '>' + (title ? '<h2>' + title + '</h2>' : '') + inner + '</section>'; }
      var SYS = {
        countdown: function () { return '<div data-cd></div>'; },
        status: function () {
          // 按鈕分三種：待辦（最上面、主要按鈕）、一般（已回報、已簽、取消候補）、取消報名（最下面、次要樣式）
          function btn(a, cls) {
            var i = d.actions.indexOf(a);
            // 預覽時按鈕不會開表單，點了只提示
            return preview ? '<span class="' + cls + '" data-pv>' + esc(a.label) + '</span>' : '<a class="' + cls + '" data-a="' + i + '" href="' + esc(a.url) + '">' + esc(a.label) + (a.done && a.kind === 'pay' ? '（已回報）' : '') + '</a>';
          }
          var todo = d.actions.filter(function (a) { return a.todo; }), quiet = d.actions.filter(function (a) { return a.quiet; });
          var rest = d.actions.filter(function (a) { return !a.todo && !a.quiet; });
          return card('報名進度',
            (todo.length ? '<div class="pt-todo"><b>待辦</b>' + todo.map(function (a) {
              return '<div class="pt-todo-item"><div class="pt-todo-t">' + esc(a.todoText || a.label) + '</div><div class="pt-acts">' + btn(a, 'btn primary') +
                (a.parentLink ? (preview ? '<span class="btn ghost" data-pv>傳給家長</span>' : '<button class="btn ghost" type="button" data-parent>傳給家長</button>') : '') + '</div></div>';
            }).join('') + '</div>' : '') +
            '<span class="pt-status' + (d.gone ? ' gone' : '') + '">' + esc(d.status) + '</span>' +
            (d.steps.length ? '<ol class="pt-steps">' + d.steps.map(function (s) { return '<li class="' + s.state + '">' + (s.state === 'done' ? '<i>✓</i>' : '') + '<span>' + esc(s.label) + '</span>' + '</li>'; }).join('') + '</ol>' : '') +
            (d.statusText ? '<div class="pt-text" data-status-text></div>' : '') +
            (rest.length ? '<div class="pt-acts">' + rest.map(function (a) { return btn(a, 'btn ' + (a.done ? 'done' : 'ghost')); }).join('') + '</div>' : '') +
            (quiet.length ? '<div class="pt-quiet">' + quiet.map(function (a) { return btn(a, 'btn sm'); }).join('') + '</div>' : ''));
        },
        squad: function () {
          if (!d.squad) return '';
          return card('我的小隊', '<div class="pt-squad"><b>第 ' + esc(d.squad.no) + ' 小隊</b></div>' +
            (d.squad.staff.length ? '<div class="pt-staff">' + d.squad.staff.map(function (x) {
              var c = x.contact ? esc(x.contact) : '';   // 純文字，不做撥號連結
              return '<div><em>' + esc(x.role) + '</em><b>' + esc(x.name) + '</b>' + (c ? '<span>' + c + '</span>' : '') + '</div>';
            }).join('') + '</div>' : ''));
        },
        pay: function () { return d.payHtml ? card('繳費資訊', '<div class="pt-rich">' + d.payHtml + '</div>') : ''; },
        info: function () { return '<details class="card pt-blk pt-fold"><summary><h2>報名資訊</h2><span class="pt-fold-hint">點開查看</span></summary>' + infoTable(d.info) + '' + '</details>'; },
        // 報名資料：預設收起來，點標題展開；有開放自行修改的欄位時多一顆「修改資料」
        data: function () {
          if (!d.dataHtml && !editable.length) return '';
          return '<details class="card pt-blk pt-fold"' + (editOpen ? ' open' : '') + '><summary><h2>報名資料</h2><span class="pt-fold-hint">點開查看</span></summary>' + (d.dataHtml ? '<div class="pt-rich">' + d.dataHtml + '</div>' : '') + editHtml() + '</details>';
        },
        refund: function () { return d.refundHtml ? card('', '<div class="pt-rich">' + d.refundHtml + '</div>') : ''; },
        reports: function () { return d.reports.length ? card('我送出的表單', '<div class="pt-log">' + d.reports.map(function (r) { return '<div><time>' + esc(r.t) + '</time><span>' + esc(r.what) + '</span></div>'; }).join('') + '</div>') : ''; },
        hotel: function () { return d.hotelHtml ? card('飯店資訊', '<div class="pt-rich">' + d.hotelHtml + '</div>') : ''; },
        room: function () {
          var r = d.room;
          if (!r) return '';
          return card('我的房間', '<div class="pt-squad"><b>' + esc(r.no) + '</b>' + (r.label ? '<span class="muted">' + esc(r.label) + '</span>' : '') + '</div>' +
            (r.note ? '<div class="pt-rich">' + r.note + '</div>' : '') +
            (r.mates ? '<div class="pt-text"><span class="muted">室友：</span>' + (r.mates.length ? r.mates.map(esc).join('、') : '目前只有你') + '</div>' : ''));
        },
        contacts: function () { return I && I.contactsHtml ? card('', '<div class="pt-rich">' + I.contactsHtml + '</div>') : ''; }
      };
      var editable = d.editable || [], editOpen = !!render.editOpen;
      render.editOpen = false;
      function editHtml() {
        if (!editable.length) return '';
        return '<form class="pt-edit" data-edit><div class="small muted">下面這幾項可以自己修改，送出後籌辦團隊會收到通知。其他資料要修改請洽籌辦團隊。</div>' +
          editable.map(function (f) { return '<label class="field"><span>' + esc(f.label) + '</span><input class="input" name="' + esc(f.key) + '" maxlength="200" value="' + esc(f.value) + '"' + (/Phone$/.test(f.key) ? ' inputmode="tel" autocomplete="tel"' : '') + (preview ? ' disabled' : '') + '></label>'; }).join('') +
          '<div class="pt-err"></div><div><button class="btn primary" type="submit"' + (preview ? ' disabled' : '') + '>儲存修改</button></div></form>';
      }
      var h = '', hasData = false;
      (d.sections || []).forEach(function (x, i) {
        if (x.type === 'sys') { if (x.key === 'data') hasData = true; h += SYS[x.key] ? SYS[x.key]() : ''; return; }
        if (x.type === 'faq') {
          h += card(esc(x.title), '<div class="pt-faq">' + x.items.map(function (it) { return '<details><summary>' + esc(it.q) + '</summary><div class="pt-rich">' + it.a + '</div></details>'; }).join('') + '</div>');
          return;
        }
        if (x.type === 'checklist') {
          h += card(esc(x.title) + '<span class="pt-cnt" data-i="' + i + '"></span>', '<div class="pt-check">' + x.items.map(function (it, j) {
            return '<label><input type="checkbox" data-s="' + i + '" data-j="' + j + '"' + (preview ? ' disabled' : '') + '><span>' + it + '</span></label>';
          }).join('') + '</div>');
        } else h += card(esc(x.title), '<div class="pt-rich">' + x.html + '</div>');
      });
      // 管理員把「報名資料」隱藏了：修改資料另外放一張卡片
      if (!hasData && editable.length) h += card('修改我的資料', editHtml());
      // 報到 QR code（Checkin.gs）：營期前 3 天起放最上面，之前放最下面
      if (d.checkin) {
        var ck = card('營隊報到 QR code', '<div style="line-height:1.8">' + (d.checkin.done ? '你已在 ' + esc(d.checkin.t) + ' 完成報到。' : '報到當天請出示這個 QR code 給工作人員掃描；可以先截圖存在手機裡。') + '</div>' +
          '<div data-ckqr style="align-self:center;background:#fff;padding:12px;border-radius:12px;line-height:0"></div>');
        h = d.checkin.soon ? ck + h : h + ck;
      }
      // 姓名打錯但身分證字號對得上：一樣讓他看，最上方提示請籌辦團隊修改
      if (d.nameNotice) h = '<div class="pt-msg">' + esc(d.nameNotice) + '</div>' + h;
      blocks.innerHTML = h;
      var ckBox = blocks.querySelector('[data-ckqr]');
      if (ckBox) {
        var drawCk = function () { new QRCode(ckBox, { text: d.checkin.code, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); };
        if (window.QRCode) drawCk();
        else { var qs = document.createElement('script'); qs.src = 'assets/qrcode.min.js'; qs.onload = drawCk; qs.onerror = function () { ckBox.textContent = 'QR code 載入失敗，請重新整理'; }; document.head.appendChild(qs); }
      }
      blocks.querySelectorAll('[data-pv]').forEach(function (b) { b.addEventListener('click', function () { alert('這是管理員預覽，按鈕不會開啟表單；學員登入後點這裡就會開啟。'); }); });
      blocks.querySelectorAll('a[data-a]').forEach(function (b) {
        var a = d.actions[Number(b.getAttribute('data-a'))];
        if (a && a.warn) b.addEventListener('click', function (e) { if (!confirm(a.warn)) e.preventDefault(); });
      });
      blocks.querySelectorAll('[data-parent]').forEach(function (b) { b.addEventListener('click', function () { parentLink(); }); });
      blocks.querySelectorAll('[data-cal]').forEach(function (b) { b.addEventListener('click', function () { addCalendar(b); }); });
      var ef = blocks.querySelector('[data-edit]');
      if (ef && !preview) ef.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = ef.querySelector('button'), err = ef.querySelector('.pt-err'), changes = {}, n = 0;
        editable.forEach(function (f) { var v = ef.elements[f.key].value.trim(); if (v !== f.value.trim()) { changes[f.key] = v; n++; } });
        err.textContent = '';
        if (!n) { err.textContent = '沒有修改任何資料'; return; }
        btnBusy(btn, true, '儲存修改', '儲存中…');
        call('portalEdit', getTok(), prefix, key, changes).then(function (r) {
          render.editOpen = true;
          render(r.data);
          var ok = blocks.querySelector('[data-edit] .pt-err');
          if (ok) { ok.style.color = 'var(--ok, #2e7d4f)'; ok.textContent = '已儲存，籌辦團隊會收到通知'; }
        }).catch(function (e2) { err.textContent = e2.message; btnBusy(btn, false, '儲存修改'); });
      });
      // 核取方塊（編輯器的「☐ 核取」）：學員可以打勾，只記在這支手機
      blocks.querySelectorAll('.pt-rich [data-cb]').forEach(function (row, n) {
        var mark = row.firstElementChild, k = 'portal_cb_' + prefix + '_' + d.name + '_' + n + '_' + row.textContent.slice(1, 40), on = row.getAttribute('data-cb') === '1';
        try { var v = localStorage.getItem(k); if (v !== null) on = v === '1'; } catch (e) {}
        var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = on; cb.disabled = !!preview; cb.className = 'pt-cbx';
        if (mark) mark.replaceWith(cb); else row.insertBefore(cb, row.firstChild);
        row.classList.toggle('on', on);
        cb.addEventListener('change', function () { row.classList.toggle('on', cb.checked); try { localStorage.setItem(k, cb.checked ? '1' : '0'); } catch (e) {} });
        row.addEventListener('click', function (e) { if (e.target !== cb && !preview && !e.target.closest('a')) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); } });
      });
      // 營隊倒數放到管理員排的位置；隱藏時留在最上面（不顯示）
      noCd = !!(d.withdrawn || d.waiting);   // 已取消、候補中：不顯示營隊倒數
      if (noCd) { if (cdTimer) clearInterval(cdTimer); cdBox.hidden = true; }
      var slot = blocks.querySelector('[data-cd]');
      if (slot) slot.parentNode.replaceChild(cdBox, slot); else top.parentNode.insertBefore(cdBox, top);
      // 地點卡片下面加上嵌入的 Google 地圖
      blocks.querySelectorAll('.pt-rich [data-map]').forEach(function (m) {
        var f = document.createElement('iframe');
        f.className = 'pt-map'; f.loading = 'lazy'; f.title = '地圖'; f.referrerPolicy = 'no-referrer-when-downgrade';
        f.src = 'https://www.google.com/maps?q=' + m.getAttribute('data-map') + '&output=embed';
        m.appendChild(f);
      });
      // 報名進度的說明：用專用的標記找，區塊順序調換後也不會寫到別張卡片（例如「我的房間」的室友那行）
      if (d.statusText) blocks.querySelector('[data-status-text]').textContent = d.statusText;

      // 勾選清單：勾選狀態只存在這支手機（每個區塊依標題記住）
      (d.sections || []).forEach(function (x, i) {
        if (x.type !== 'checklist') return;
        var k = 'portal_chk_' + prefix + '_' + d.name + '_' + x.title, saved = {};
        try { saved = JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) {}
        var boxes = blocks.querySelectorAll('input[data-s="' + i + '"]'), cnt = blocks.querySelector('.pt-cnt[data-i="' + i + '"]');
        function count() { var n = 0; boxes.forEach(function (b) { if (b.checked) n++; }); cnt.textContent = '　' + n + ' / ' + boxes.length; }
        boxes.forEach(function (b) {
          var key2 = b.parentNode.textContent.trim();
          b.checked = !!saved[key2];
          b.addEventListener('change', function () { saved[key2] = b.checked; try { localStorage.setItem(k, JSON.stringify(saved)); } catch (e) {} count(); });
        });
        count();
      });
  }

  /* ---------- 加到行事曆：.ics（手機行事曆、Outlook）與 Google 日曆連結 ---------- */
  function ymd(s) { return String(s || '').replace(/-/g, ''); }
  function nextDay(s) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10).replace(/-/g, ''); }
  function gcalUrl() {
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(I.campName) +
      '&dates=' + ymd(I.startYmd) + '/' + nextDay(I.endYmd || I.startYmd) + '&details=' + encodeURIComponent((I.period ? '營期：' + I.period + '\n' : '') + location.href.split('?')[0] + '?p=' + encodeURIComponent(prefix) + '&k=' + encodeURIComponent(key));
  }
  function calRow() {
    if (!I || !I.startYmd) return '';
    return '<div class="pt-cal"><span class="lbl">把營期加到行事曆：</span><button class="btn sm" type="button" data-cal>手機行事曆（.ics）</button><a class="btn sm ghost" target="_blank" rel="noopener" href="' + esc(gcalUrl()) + '">Google 日曆</a></div>';
  }
  /** 倒數卡片下面也放一份（營隊開始前才放） */
  function calInCountdown() {
    if (!I || !I.startYmd || cdBox.hidden || cdBox.querySelector('.pt-cal') || !(I.startMs > Date.now())) return;
    var row = document.createElement('div');
    row.innerHTML = calRow();
    row = row.firstChild;
    row.style.justifyContent = 'center';
    row.querySelector('[data-cal]').addEventListener('click', function () { addCalendar(this); });
    cdBox.appendChild(row);
  }
  function addCalendar(btn) {
    var esc2 = function (v) { return String(v).replace(/[\\;,]/g, function (c) { return '\\' + c; }).replace(/\n/g, '\\n'); };
    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//camp-system//portal//ZH-TW', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      'UID:' + prefix + '-' + ymd(I.startYmd) + '@camp-system', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + ymd(I.startYmd), 'DTEND;VALUE=DATE:' + nextDay(I.endYmd || I.startYmd),
      'SUMMARY:' + esc2(I.campName), 'DESCRIPTION:' + esc2(I.period ? '營期：' + I.period : ''), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    // LINE、IG 等內建瀏覽器通常不能下載檔案：改顯示「用瀏覽器開啟」的提示
    var hint = inAppHint('把行事曆檔案加到手機');
    if (hint) {
      var row = btn.closest('.pt-cal'), old = row.parentNode.querySelector('.inapp-hint');
      if (old) old.remove();
      row.parentNode.insertBefore(hint, row.nextSibling);
      return;
    }
    var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = I.campName + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  /* ---------- 傳給家長（試辦）：產生只能簽這位學員同意書的連結 ---------- */
  function parentLink(regen) {
    var mask = document.createElement('div');
    mask.className = 'pt-mask';
    mask.innerHTML = '<div class="pt-dlg" role="dialog" aria-modal="true" aria-labelledby="pl-t"><h2 id="pl-t">傳給家長簽同意書</h2><div class="pl-body"><div class="ld"><div class="ld-spin"></div><div class="ld-msg">產生連結中…</div></div></div>' +
      '<div class="pt-dlg-btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close>關閉</button></div></div>';
    function close() { mask.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    mask.addEventListener('click', function (e) { if (e.target === mask || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(mask);
    var box = mask.querySelector('.pl-body');
    function draw(r) {
      box.innerHTML = '<div class="pt-text">把這個連結傳給家長（監護人），家長用自己的手機打開就能閱讀並簽名，不用輸入你的身分證字號。這個連結只能簽你的同意書，' + esc(r.days) + ' 天內有效（到 ' + esc(r.exp) + '）。</div>' +
        '<input class="input" readonly><div class="pt-dlg-btns"><button class="btn primary" type="button" data-copy>複製連結</button><button class="btn ghost" type="button" data-regen>重新產生</button></div>' +
        '<div class="small muted">重新產生後，舊的連結會失效。你和家長誰先簽都可以，兩位都簽好才算完成。</div>';
      var inp = box.querySelector('input'); inp.value = r.url;
      box.querySelector('[data-copy]').addEventListener('click', function () { copyBtn(this, r.url); });
      box.querySelector('[data-regen]').addEventListener('click', function () {
        if (!confirm('確定要重新產生連結嗎？舊的連結會立即失效，要把新連結再傳給家長。')) return;
        load(true);
      });
    }
    function load(re) {
      showLoading(box, '產生連結中…');
      call('portalParentLink', getTok(), prefix, key, re === true).then(draw).catch(function (e) {
        box.innerHTML = '<div class="pt-msg"></div>'; box.firstChild.textContent = e.message;
        if (/重新登入|過期/.test(e.message)) { close(); setTok(''); login('登入已過期，請重新登入'); }
      });
    }
    load(regen === true);
  }

  /** 營隊倒數：以伺服器時間校正，每秒更新 */
  var cdTimer = null, noCd = false;
  function countdown(info) {
    var box = document.getElementById('pt-cd');
    if (cdTimer) clearInterval(cdTimer);
    if (noCd || !info.startMs || info.countdown === false) { box.hidden = true; return; }
    var skew = info.now ? info.now - Date.now() : 0;
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    // 倒數的數字寫在 main 裡，下面「加到行事曆」那一列不會每秒被蓋掉
    box.innerHTML = '<div class="pt-cd-main" style="display:flex;flex-direction:column;gap:10px;align-items:center"></div>';
    var main = box.firstChild;
    function tick() {
      var now = Date.now() + skew, left = info.startMs - now;
      box.hidden = false;
      if (left > 0) {
        var s = Math.floor(left / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
        // 越接近越醒目：剩一個月內黃、一週內橘、剩一天深橘、不到一天紅
        box.setAttribute('data-lvl', d < 1 ? 'red' : d < 2 ? 'deep' : d < 7 ? 'orange' : d < 30 ? 'yellow' : '');
        main.innerHTML = '<div class="lbl">距離營隊開始還有</div><div class="nums"><div><b>' + d + '</b><span>天</span></div><div><b>' + pad(h) + '</b><span>時</span></div><div><b>' + pad(m) + '</b><span>分</span></div><div><b>' + pad(sec) + '</b><span>秒</span></div></div>';
      } else if (info.endMs && now < info.endMs) {
        box.setAttribute('data-lvl', '');
        main.innerHTML = '<div class="big">營隊進行中</div><div class="lbl">祝大家玩得開心！</div>';
        var c1 = box.querySelector('.pt-cal'); if (c1) c1.remove();
        clearInterval(cdTimer);
      } else {
        main.innerHTML = '<div class="big">營隊已圓滿結束</div><div class="lbl">謝謝你的參與，我們下次見！</div>';
        var c2 = box.querySelector('.pt-cal'); if (c2) c2.remove();
        clearInterval(cdTimer);
      }
    }
    tick();
    cdTimer = setInterval(tick, 1000);
  }

  function applyHead(info) {
    I = info;
    countdown(info);
    camp.innerHTML = esc(info.campName) + (info.period ? '<small>' + esc(info.period) + '</small>' : '');
    foot(!blocks.innerHTML);
  }

  /** 管理員預覽：從學員管理頁打開，用管理員的登入看某位學員的畫面 */
  function preview(sid) {
    var adminTok = '';
    try { adminTok = sessionStorage.getItem('camp_token') || localStorage.getItem('camp_token') || ''; } catch (e) {}
    if (!adminTok) { closed('預覽需要先登入管理系統，請從「報名與學員管理 → 學員專區 → 預覽」打開'); return; }
    showLoading(body, '正在載入學員看到的畫面…');
    call('portalPreview', adminTok, prefix, sid || '').then(function (r) {
      applyHead(r.head);
      document.title = '預覽學員專區｜' + r.head.campName;
      render(r.data, true);
      var bar = document.createElement('div');
      bar.className = 'pt-msg';
      bar.innerHTML = '<b>管理員預覽</b>：這是學員「<span></span>」登入後看到的畫面' + (r.open ? '' : '（學員專區目前沒有開放，學員還看不到）') + '。<label style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">換一位學員<select class="input" style="flex:1 1 160px;min-width:0"></select></label>';
      bar.querySelector('span').textContent = r.data.name;
      var sel = bar.querySelector('select');
      r.students.forEach(function (x) { var o = document.createElement('option'); o.value = x.id; o.textContent = x.name + '（' + x.status + '）'; sel.appendChild(o); });
      sel.value = r.studentId;
      sel.addEventListener('change', function () { preview(sel.value); });
      body.insertBefore(bar, body.firstChild);
    }).catch(function (e) { closed(e.message); });
  }

  if (prefix && q.get('preview') === '1') { preview(q.get('s') || ''); return; }
  if (!prefix || !key) { closed('網址不完整，請使用籌辦團隊提供的學員專區網址'); return; }
  // 已經登入過：專案資訊和報名資料同時載入，不用一個等一個
  var pending = getTok() ? call('portalData', getTok(), prefix, key) : null;
  if (pending) pending.catch(function () {});
  call('portalInfo', prefix, key).then(function (info) {
    if (info.closed) { closed(info.message); return; }
    applyHead(info);
    document.title = '學員專區｜' + info.campName;
    show();
    pending = null;
  }).catch(function (e) { closed(e.message); });
})();
</script>
