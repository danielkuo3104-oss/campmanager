<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>使用手冊｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* 使用手冊：之後整份換成完整內容；網址錨點 #troubleshoot 是「問題快速排除」 */
    .mn-wrap { max-width: 760px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
    .mn-wrap h1 { margin: 0; font-size: 26px; }
    .mn-card { padding: 22px 24px; border-radius: 16px; background: var(--surface, #fff); border: 1px solid var(--line); line-height: 1.8; }
    .mn-card h2 { margin: 0 0 6px; font-size: 18px; }
    .mn-foot { color: var(--text-3); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="mn-wrap">
    <h1>使用手冊</h1>
    <div class="mn-card" id="guide"><h2>操作說明</h2>手冊正在整理中，完成後會放在這一頁（依功能分類、附畫面截圖）。</div>
    <div class="mn-card" id="troubleshoot"><h2>問題快速排除</h2>常見狀況與處理步驟整理中。急需協助時，請用右上角選單的「聯絡開發人員」。</div>
    <div class="mn-foot">營隊報名管理系統　© 2026 Daniel GUO. All rights reserved.</div>
  </div>
</body>
</html>
