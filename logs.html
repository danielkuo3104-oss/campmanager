<!DOCTYPE html>
<!-- 營隊報名管理系統　© 2026 Daniel GUO. All rights reserved. -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="營隊管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>操作紀錄｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
  <main id="app">
<div class="view-logs hidden">
  <div class="page-head">
    <div>
      <h1>操作紀錄</h1>
      <div class="sub" id="lg-sub">所有操作與寄信都會留下紀錄，紀錄只能新增、不能修改</div>
    </div>
  </div>
  <div class="card">
    <div class="toolbar">
      <select class="input" id="lg-project" style="max-width:240px" aria-label="篩選專案"><option value="">全部專案</option></select>
      <input class="input" id="lg-q" type="search" aria-label="搜尋操作紀錄" placeholder="搜尋操作人、動作、對象…" style="max-width:300px">
      <button class="btn" type="button" id="lg-go">查詢</button>
      <span class="spacer"></span>
      <span class="muted small" id="lg-count"></span>
    </div>
    <div class="table-wrap">
      <table class="simple lg-table">
        <thead><tr><th>時間</th><th>操作人</th><th>專案</th><th>動作</th><th>對象</th><th>內容</th><th>結果</th></tr></thead>
        <tbody id="lg-body"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="loading" id="page-loading"><div class="spinner"></div>載入中</div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
<script>
App.page('logs', function (root) {
  var loadedProjects = false;
  /** 紀錄裡的舊值、新值常是 JSON（設定、學員資料）：能解析就逐欄比較 */
  function parseObj(v) {
    if (!v || typeof v !== 'string' || !/^\s*[\[{]/.test(v)) return null;
    try { var o = JSON.parse(v); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch (e) { return null; }
  }
  function show(v) {
    if (v === undefined || v === null || v === '') return '（空白）';
    var t = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return t.length > 120 ? t.slice(0, 120) + '…' : t;
  }
  /** 把「內容」做成好讀的樣子：每一行「欄位：舊 → 新」，原始資料收在「原始資料」裡 */
  function contentCell(td, l) {
    var bo = parseObj(l.before), ao = parseObj(l.after);
    var box = el('<div class="lg-diff"></div>');
    var raw = '';
    if (bo || ao) {
      bo = bo || {}; ao = ao || {};
      var keys = Object.keys(bo).concat(Object.keys(ao).filter(function (k) { return !(k in bo); }));
      var changed = keys.filter(function (k) { return JSON.stringify(bo[k]) !== JSON.stringify(ao[k]); });
      changed.slice(0, 30).forEach(function (k) {
        var row = el('<div><span class="k"></span><del></del><span class="arr"></span><ins></ins></div>');
        $('.k', row).textContent = k + '：';
        if (l.before) { $('del', row).textContent = show(bo[k]); $('.arr', row).textContent = ' → '; }
        $('ins', row).textContent = l.after ? show(ao[k]) : '（刪除）';
        box.appendChild(row);
      });
      if (changed.length > 30) box.appendChild(el('<div class="muted">…另有 ' + (changed.length - 30) + ' 個欄位</div>'));
      if (!changed.length) box.appendChild(el('<div class="muted">內容沒有變動</div>'));
      raw = (l.before ? '舊：' + l.before + '\n' : '') + (l.after ? '新：' + l.after : '');
    } else if (l.before || l.after) {
      var r = el('<div><del></del><span class="arr"></span><ins></ins></div>');
      if (l.before) { $('del', r).textContent = show(l.before); $('.arr', r).textContent = ' → '; }
      $('ins', r).textContent = show(l.after);
      box.appendChild(r);
      if (String(l.before).length > 120 || String(l.after).length > 120) raw = (l.before ? '舊：' + l.before + '\n' : '') + '新：' + l.after;
    }
    if (l.note) { var n = el('<div></div>'); n.textContent = l.note; box.appendChild(n); }
    td.appendChild(box);
    if (raw) {
      var d = el('<details class="lg-raw"><summary>原始資料</summary><pre></pre></details>');
      $('pre', d).textContent = raw;
      td.appendChild(d);
    }
  }
  function load() {
    var f = { project: $('#lg-project', root).value, q: $('#lg-q', root).value.trim() };
    $('#lg-body', root).innerHTML = '<tr><td colspan="7"><div class="loading"><div class="spinner"></div>載入中</div></td></tr>';
    api('getLogs', f).then(function (r) {
      if (!loadedProjects) {
        r.projects.forEach(function (p) { $('#lg-project', root).appendChild(new Option(p.prefix + '　' + p.name, p.prefix)); });
        loadedProjects = true;
      }
      $('#lg-count', root).textContent = '最新 ' + r.logs.length + ' 筆' + (r.logs.length >= r.limit ? '（上限 ' + r.limit + '，請縮小條件）' : '');
      var tb = $('#lg-body', root);
      tb.innerHTML = '';
      if (!r.logs.length) { tb.innerHTML = '<tr><td colspan="7"><div class="empty">沒有紀錄</div></td></tr>'; return; }
      r.logs.forEach(function (l) {
        var tr = el('<tr><td class="lg-time" style="white-space:nowrap"></td><td></td><td></td><td></td><td></td><td class="small"></td><td></td></tr>');
        var td = $$('td', tr);
        td[0].textContent = fmtTime(l.time);
        td[1].textContent = l.actor;
        td[2].textContent = l.project;
        td[3].textContent = l.action;
        td[4].textContent = l.target;
        contentCell(td[5], l);
        td[5].style.maxWidth = '420px';
        td[5].style.wordBreak = 'break-all';
        var cls = l.result === '成功' ? 'ok' : (l.result === '已取消' || l.result === '略過') ? 'mute' : 'bad';
        td[6].innerHTML = '<span class="pill ' + cls + '">' + esc(l.result) + '</span>';
        tb.appendChild(tr);
      });
    }).catch(function (e) {
      // 失敗時不要一直轉圈：顯示原因與重試
      var tb = $('#lg-body', root);
      tb.innerHTML = '<tr><td colspan="7"><div class="empty"><div></div><button class="btn sm" type="button">重試</button></div></td></tr>';
      $('.empty div', tb).textContent = '讀取紀錄失敗：' + e.message;
      $('.empty button', tb).addEventListener('click', load);
      toast(e.message, true);
    });
  }
  $('#lg-go', root).addEventListener('click', load);
  $('#lg-q', root).addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  $('#lg-project', root).addEventListener('change', load);
  load();
});
</script>
</body>
</html>
