<!DOCTYPE html>

<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>同意書簽署</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/loading.js"></script>
  <style>
    /* 同意書簽署頁：不用登入，版面跟預製表單一樣（標頭色條＋白底內容） */
    .pf-wrap { max-width: 640px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
    .pf-head { padding: 18px 24px; color: #fff; font-weight: 700; font-size: 17px; background: #2f5d62; }
    .pf-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .pf-body h1 { margin: 0; font-size: 22px; }
    .pf-intro { line-height: 1.8; color: var(--text); }
    .pf-steps { display: flex; flex-direction: column; gap: 14px; }
    .pf-info { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pf-info div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pf-info div:last-child { border-bottom: 0; }
    .pf-info b { color: var(--text-2); font-weight: 500; }
    .pf-msg { padding: 14px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); line-height: 1.7; }
    .pf-err { color: var(--bad); min-height: 18px; font-size: 13px; }
    .pf-done { line-height: 1.8; padding: 8px 0; }
    .pf-foot { color: var(--text-3); font-size: 13px; text-align: center; line-height: 1.7; }
    .pf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pf-row > * { min-width: 0; }
    /* iPhone 的日期欄位有固定的最小寬度、文字置中，會撐破版面：改成跟一般欄位一樣 */
    .pf-body input[type=date] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; text-align: left; }
    .pf-body input[type=date]::-webkit-date-and-time-value { text-align: left; }
    .pf-sec { font-weight: 700; color: var(--text); margin-top: 4px; }
    .pf-est { padding: 12px 16px; border-radius: 12px; background: var(--surface-2, #f4f5f3); line-height: 1.7; font-size: 14px; }
    .pf-policy table { width: 100%; }
    .pf-mask { position: fixed; inset: 0; background: rgba(20, 24, 22, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
    .pf-dlg { background: var(--surface, #fff); border-radius: 18px; width: 100%; max-width: 480px; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow: auto; }
    .pf-dlg h2 { margin: 0; font-size: 18px; }
    .pf-dlg .pf-info div { grid-template-columns: 96px 1fr; }
    .pf-dlg-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    @media (min-width: 521px) { .pf-mask { align-items: center; } }
    @media (max-width: 520px) { .pf-row { grid-template-columns: 1fr; } .pf-body { padding: 20px 16px; } }

    [hidden] { display: none !important; }
    /* iPhone 點到字級小於 16px 的輸入框會自動放大畫面 */
    .input { font-size: 16px; }
    /* 送出鍵下方：還缺哪幾項，點一下跳到那一欄 */
    .cs-miss { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); }
    .cs-miss button { border: 0; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .cs-later { padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line-strong, #cfd6d2); line-height: 1.6; }
    /* 同意書：閱讀框、閱讀進度、簽名板、上傳 */
    .cs-doc { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .cs-doc-head { padding: 12px 16px; background: var(--surface-2, #f4f5f3); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cs-doc-head h2 { margin: 0; font-size: 16px; flex: 1 1 auto; }
    .cs-scroll { max-height: 55vh; overflow-y: auto; padding: 16px 18px; line-height: 1.85; font-size: 15px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .cs-end { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 18px; }
    .cs-prog { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 6px; }
    .cs-prog .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .cs-prog .bar i { display: block; height: 100%; width: 0; background: var(--brand, #2f5d62); transition: width .3s; }
    .cs-prog .ok { color: var(--ok, #2e7d4f); font-weight: 600; }
    .cs-sign { padding: 14px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
    .cs-pad-wrap { display: flex; flex-direction: column; gap: 6px; }
    .cs-pad-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .cs-pad-head span { flex: 1; }
    .cs-pad { position: relative; height: 170px; border: 1.5px dashed var(--line-strong, #cfd6d2); border-radius: 12px; background: #fff; touch-action: none; }
    .cs-pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 12px; cursor: crosshair; }
    .cs-pad .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b4bcb8; font-size: 14px; pointer-events: none; }
    .cs-pad.inked .ph { display: none; }
    .cs-pad.inked { border-style: solid; border-color: var(--brand, #2f5d62); }
    .cs-pad .ph { text-align: center; padding: 0 12px; }
    .sg-full { position: fixed; inset: 0; z-index: 100; background: rgba(20, 24, 22, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .sg-stage { background: #fff; border-radius: 18px; width: min(1100px, 100%); height: min(600px, 100%); display: flex; flex-direction: column; overflow: hidden; color: #1d2621; }
    .sg-top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #e3e8e5; }
    .sg-top b { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sg-sp { flex: 1; }
    .sg-area { position: relative; flex: 1; margin: 14px; border: 1.5px dashed #cfd6d2; border-radius: 12px; background: #fff; touch-action: none; overflow: hidden; }
    .sg-area canvas { position: absolute; left: 0; top: 0; cursor: crosshair; touch-action: none; }
    .sg-area .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b4bcb8; font-size: 18px; pointer-events: none; }
    .sg-area.inked .ph { display: none; }
    .sg-line { position: absolute; left: 8%; right: 8%; bottom: 26%; border-bottom: 1px solid #e3e8e5; pointer-events: none; }
    .sg-full.touch { padding: 0; background: #fff; }
    .sg-full.touch .sg-stage { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; border-radius: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; }
    /* 手機直拿：簽名區轉 90 度，手機橫拿就是橫式簽名 */
    .sg-full.touch.rot .sg-stage { width: 100vh; width: 100dvh; height: 100vw; transform-origin: 0 0; transform: translateX(100vw) rotate(90deg); }
    .cs-tabs { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--surface-2, #f4f5f3); }
    .cs-tabs button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 10px; font: inherit; font-size: 14px; color: var(--text-2); cursor: pointer; }
    .cs-tabs button.on { background: #fff; color: var(--brand, #2f5d62); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .cs-files { display: flex; flex-direction: column; gap: 6px; }
    .cs-file { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
    .cs-file img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; }
    .cs-file span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cs-drop { border: 1.5px dashed var(--line-strong, #cfd6d2); border-radius: 12px; padding: 18px; text-align: center; color: var(--text-2); }
    .cs-ok { padding: 12px 16px; border-radius: 12px; background: var(--ok-soft, #e5f3ea); color: var(--ok, #2e7d4f); line-height: 1.7; }
    .pdf-host { position: fixed; left: -30000px; top: 0; }
    .cs-print { width: 794px; box-sizing: border-box; padding: 64px 72px; background: #fff; color: #1d2621; font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 15px; line-height: 1.9; }
    .cs-print h1 { font-size: 22px; text-align: center; margin: 0 0 6px; }
    .cs-print .camp { text-align: center; color: #5b665f; margin-bottom: 22px; }
    .cs-print .sigs { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 32px; }
    .cs-print .sigs div { border-bottom: 1px solid #1d2621; padding-top: 34px; font-size: 13px; color: #5b665f; }
    .cs-part + .cs-part { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
    .cs-part-t { margin: 0 0 8px; font-size: 16px; }
    .cs-print .gap { height: 36px; }
    .cs-print .note { margin-top: 36px; color: #5b665f; font-size: 13px; }
    .cs-print .date { margin-top: 30px; text-align: center; letter-spacing: .3em; }
  </style>
</head>
<body>
  <div class="pf-wrap">
    <div class="card">
      <div class="pf-head" id="pf-camp">載入中…</div>
      <div class="pf-body" id="pf-body"><div class="ld"><div class="ld-spin"></div><div class="ld-msg">載入中…</div></div></div>
    </div>
    <div class="pf-foot" id="pf-foot" style="margin-top:20px"></div>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var prefix = q.get('p') || '';
  var body = document.getElementById('pf-body'), head = document.getElementById('pf-camp');
  var F = null, who = null, R = null, timer = null;
  // 從學員專區打開（t=，免輸入身分證）或家長簽署連結（pl=，試辦）：用憑證直接查
  var ftok = /^[FL][0-9a-f]{32}$/.test(q.get('t') || q.get('pl') || '') ? (q.get('t') || q.get('pl')) : '';
  var PDF_LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];

  function esc(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!window.CAMP_CONFIG || !CAMP_CONFIG.API_URL) return Promise.reject(new Error('網站尚未設定完成，請洽籌辦團隊'));
    return fetch(CAMP_CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('連線失敗，請稍後再試'); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || '發生錯誤'); return j.result; });
  }
  function busy(btn, on, label, busyLabel) { btnBusy(btn, on, label, busyLabel); }
  function mmss(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      if (document.querySelector('script[data-src="' + src + '"]')) return resolve();
      var s = document.createElement('script');
      s.src = src; s.async = true; s.setAttribute('data-src', src);
      s.onload = function () { resolve(); };
      s.onerror = function () { s.remove(); reject(new Error('無法載入 PDF 程式庫，請確認網路連線後再試')); };
      document.head.appendChild(s);
    });
  }

  function closed(msg) {
    head.textContent = '同意書簽署';
    body.innerHTML = '<div class="pf-msg"></div>';
    body.firstChild.textContent = msg;
  }

  function startToken() {
    showLoading(body, ftok.charAt(0) === 'L' ? '正在打開同意書…' : '正在讀取你的報名資料…');
    who = { name: '', key: ftok };
    call('consentLookup', prefix, '', ftok).then(function (r) { who.name = r.info[0][1]; R = r; signStep(); })
      .catch(function (e) {
        // 家長連結失效：不能改用身分證查（家長沒有），只顯示原因
        if (ftok.charAt(0) === 'L') { closed(e.message); head.textContent = F.campName; return; }
        ftok = ''; start(e.message);
      });
  }

  function start(msg) {
    if (timer) { clearInterval(timer); timer = null; }
    body.innerHTML =
      '<h1>' + esc(F.title) + '</h1><div class="pf-intro">' + F.introHtml + '</div>' + (typeof msg === 'string' && msg ? '<div class="pf-msg" id="pf-tmsg"></div>' : '') +
      '<form class="pf-steps" id="pf-find" autocomplete="on">' +
      '<div class="pf-row"><label class="field"><span>學員姓名<em>*</em></span><input class="input" name="name" autocomplete="name" required></label>' +
      '<label class="field"><span>' + esc(F.keyLabel) + '<em>*</em></span><input class="input" name="key" required' + (F.keyLabel === '身分證字號' ? ' autocapitalize="characters" maxlength="10"' : ' type="email" autocomplete="email"') + '></label></div>' +
      '<div class="pf-err"></div><div><button class="btn primary" type="submit">查詢我的報名</button></div></form>';
    if (document.getElementById('pf-tmsg')) document.getElementById('pf-tmsg').textContent = msg;
    var form = document.getElementById('pf-find');
    form.elements.name.value = q.get('n') || '';
    (form.elements.name.value ? form.elements.key : form.elements.name).focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button'), err = form.querySelector('.pf-err');
      err.textContent = '';
      busy(btn, true, '查詢我的報名', '查詢中…');
      who = { name: form.elements.name.value.trim(), key: form.elements.key.value.trim() };
      call('consentLookup', prefix, who.name, who.key).then(function (r) { R = r; signStep(); })
        .catch(function (e2) { err.textContent = e2.message; busy(btn, false, '查詢我的報名'); });
    });
  }

  /* ---------- 簽名板：手指或滑鼠簽名，輸出白底 PNG ---------- */
  function makePad(box) {
    var cv = document.createElement('canvas'), ctx = cv.getContext('2d'), inked = false, drawing = false, last = null;
    box.appendChild(cv);
    function fit() {
      var r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      var keep = inked ? cv.toDataURL() : null;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.6;
      if (keep) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = keep; }
    }
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    var ext = null;   // 用「放大簽名」簽的高解析度簽名；在小簽名框再簽就換回小框
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); if (ext) { ext = null; ctx.clearRect(0, 0, cv.width, cv.height); inked = false; } drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); });
    cv.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      if (!inked && Math.abs(p.x - last.x) + Math.abs(p.y - last.y) > 0) { inked = true; box.classList.add('inked'); box.dispatchEvent(new Event('ink', { bubbles: true })); }
      last = p;
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { cv.addEventListener(t, function () { drawing = false; }); });
    fit();
    window.addEventListener('resize', fit);
    return {
      inked: function () { return inked; },
      clear: function () { ext = null; ctx.clearRect(0, 0, cv.width, cv.height); inked = false; box.classList.remove('inked'); box.dispatchEvent(new Event('ink', { bubbles: true })); },
      /** 放大簽名簽好後：小框顯示縮圖，送出時用大圖 */
      setFrom: function (big) {
        ext = big;
        var r = box.getBoundingClientRect(), k = Math.min(r.width / big.width, r.height / big.height);
        var w = big.width * k, h = big.height * k;
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(big, (r.width - w) / 2, (r.height - h) / 2, w, h);
        inked = true; box.classList.add('inked'); box.dispatchEvent(new Event('ink', { bubbles: true }));
      },
      png: function () {
        // 縮成寬 600（放大簽名的用寬 900）的白底圖，檔案小、在後台看得清楚
        var src = ext || cv, w = ext ? 900 : 600, h = Math.round(w * src.height / src.width), out = document.createElement('canvas');
        out.width = w; out.height = h;
        var o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, w, h); o.drawImage(src, 0, 0, w, h);
        return out.toDataURL('image/png');
      }
    };
  }

  /**
   * 放大簽名：手機滿版（轉成橫式；能鎖定螢幕方向就鎖，不能就把簽名區轉 90 度，手機橫拿著簽），
   * 電腦開一個大的簽名視窗。按「完成」後簽名放回原本的簽名框。
   */
  function bigSign(label, onDone) {
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var ov = document.createElement('div');
    ov.className = 'sg-full' + (touch ? ' touch' : '');
    ov.innerHTML = '<div class="sg-stage" role="dialog" aria-modal="true"><div class="sg-top"><b></b><span class="sg-sp"></span>' +
      '<button class="btn sm ghost" type="button" data-k="clear">清除</button><button class="btn sm ghost" type="button" data-k="cancel">取消</button><button class="btn sm primary" type="button" data-k="ok">完成</button></div>' +
      '<div class="sg-area"><div class="sg-line"></div><canvas></canvas><div class="ph">請在這裡簽名</div></div></div>';
    ov.querySelector('b').textContent = label;
    document.body.appendChild(ov);
    var stage = ov.querySelector('.sg-stage'), area = ov.querySelector('.sg-area'), cv = ov.querySelector('canvas'), ctx = cv.getContext('2d');
    var inked = false, drawing = false, last = null, rot = false;
    document.documentElement.style.overflow = 'hidden';
    function layout() {
      // 手機直拿：把簽名區轉 90 度變成橫的
      rot = touch && window.innerHeight > window.innerWidth;
      ov.classList.toggle('rot', rot);
      var keep = inked ? cv.toDataURL() : null, ow = cv.width, oh = cv.height;
      var w = area.clientWidth, h = area.clientHeight, dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = touch ? 3.4 : 3;
      if (keep) { var im = new Image(); im.onload = function () { var k = Math.min(w / (ow / dpr), h / (oh / dpr)); ctx.drawImage(im, 0, 0, ow / dpr * k, oh / dpr * k); }; im.src = keep; }
    }
    function pos(e) {
      var r = cv.getBoundingClientRect();
      // 轉了 90 度（順時針）：畫面的 y 是簽名區的 x，畫面的 x 由右往左是簽名區的 y
      if (rot) return { x: e.clientY - r.top, y: r.right - e.clientX };
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); });
    cv.addEventListener('pointermove', function (e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();

        b.type = 'button'; b.textContent = x.text;
        b.addEventListener('click', function () {
          x.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          var f = x.focus || x.el;
          if (f.focus) setTimeout(function () { f.focus({ preventScroll: true }); }, 300);
        });
        missBox.appendChild(b);
      });
    }
    form.addEventListener('ink', updateSubmit);
    form.addEventListener('input', updateSubmit);
    form.addEventListener('change', updateSubmit);
    $$tabs();
    function $$tabs() {
      Array.prototype.forEach.call(body.querySelectorAll('.cs-tabs button'), function (b) {
        b.onclick = function () {
          mode = b.getAttribute('data-m');
          Array.prototype.forEach.call(body.querySelectorAll('.cs-tabs button'), function (x) { x.classList.toggle('on', x === b); });
          onlineBox.hidden = mode !== 'online'; uploadBox.hidden = mode !== 'upload';
          updateSubmit();
        };
      });
      onlineBox.hidden = mode !== 'online'; uploadBox.hidden = mode !== 'upload';
    }
    updateSubmit();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var err = form.querySelector('.pf-err');
      var why = ready();
      if (why) { err.textContent = why; return; }
      err.textContent = '';
      var data = { mode: mode, parentName: needParentName() ? form.elements.parentName.value.trim() : '', ua: navigator.userAgent };
      if (later()) data.later = true;
      if (r.birthNeeded) data.birth = form.elements.birth.value;
      if (mode === 'online') {
        data.sigs = {};
        roles().forEach(function (role) { data.sigs[role] = pads[role].pad.png(); });
      } else data.files = files.map(function (f) { return { name: f.name, data: f.data }; });
      confirmSelf().then(function (yes) {
        if (!yes) return;
        data.confirm = true;
        busy(submitBtn, true, '送出同意書', '上傳中…');
        call('consentSubmit', prefix, who.name, who.key, data).then(function (res) {
          // 伺服器要求重新確認已閱讀（閱讀時間過期）：保留簽名，顯示原因，讓對方再送一次
          if (res && res.ok === false) { err.textContent = res.message || '請再確認一次後送出'; busy(submitBtn, false, '送出同意書'); return; }
          if (timer) { clearInterval(timer); timer = null; }
          body.innerHTML = '<h1>' + esc(F.title) + '</h1><div class="cs-ok">' + (res.partial ? '已收到你的簽名（還差另一位）' : '已收到你的同意書') + '</div><div class="pf-done">' + res.doneHtml + '</div>';
          window.scrollTo(0, 0);
        }).catch(function (e2) { err.textContent = e2.message; busy(submitBtn, false, '送出同意書'); });
      });
    });
  }

  /** 線上無法當面確認身分：送出前請本人勾選確認親簽並願負責任 */
  function confirmSelf() {
    return new Promise(function (resolve) {
      var mask = document.createElement('div');
      mask.className = 'pf-mask';
      mask.innerHTML = '<div class="pf-dlg" role="dialog" aria-modal="true"><h2>確認本人親簽</h2>' +
        '<div class="pf-msg">線上簽署無法當面確認簽名的是不是本人，但我們希望由本人親自簽署。</div>' +
        '<label class="check"><input type="checkbox"><span></span></label>' +
        '<div class="pf-dlg-btns"><button class="btn ghost" type="button" data-v="0">返回</button><button class="btn primary" type="button" data-v="1" disabled>確認並送出</button></div></div>';
      mask.querySelector('.check span').textContent = (F.confirmText || '');
      var ok = mask.querySelector('[data-v="1"]');
      mask.querySelector('input').addEventListener('change', function (e) { ok.disabled = !e.target.checked; });
      function done(v) { mask.remove(); resolve(v); }
      mask.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && !b.disabled) done(b.getAttribute('data-v') === '1'); else if (e.target === mask) done(false); });
      document.body.appendChild(mask);
    });
  }

  if (!prefix) { closed('網址不完整，請從信裡的按鈕重新打開'); return; }
  showLoading(document.getElementById('pf-body'));
  call('publicForm', prefix, 'consent').then(function (f) {
    if (f.closed) { closed(f.message); return; }
    F = f;
    document.title = f.title + '｜' + f.campName;
    head.textContent = f.campName;
    head.style.background = f.headerColor;
    document.getElementById('pf-foot').innerHTML = (f.contactsHtml ? '<div style="text-align:left;margin-bottom:16px">' + f.contactsHtml + '</div>' : '') + f.signatureHtml;
    if (ftok) startToken(); else start();
  }).catch(function (e) { closed(e.message); });
})();
</script>
