  /* ---------- 群發 ----------
   * 編輯 → 預覽（確認畫面）→ 寄出；確認畫面按「返回修改」回到同一個編輯視窗，內容都還在。
   * 也可以「先寄一封給自己」看實際排版，或「排程寄出」由定時工作在指定時間寄。 */
  var bulkBody = null;   // 這次開啟頁面期間保留群發草稿
  var bulkBase;          // 草稿剛建立時的內容（判斷有沒有改動）
  function bulkForm() {
    var statuses = Object.keys(D.statuses).map(function (k) { return D.statuses[k]; }).filter(function (x) { return x !== '報名失敗'; });
    var body = el('<form style="display:flex;flex-direction:column;gap:14px" onsubmit="return false">' +
      '<div class="bulk-sched" data-nodirty></div>' +
      '<div class="field bulk-st"><span class="small muted">收件對象（依狀態）</span><div class="row wrap" style="gap:14px;margin-top:6px">' +
      statuses.map(function (x) { return '<label class="check"><input type="checkbox" name="st" value="' + esc(x) + '"' + (x === '程序完成' ? ' checked' : '') + '><span>' + esc(x) + '</span></label>'; }).join('') +
      '</div><span class="hint">只寄給勾選的狀態；候補中、申請取消、報名取消預設不勾，要寄給他們才勾。</span></div>' +
      (consentOpen() ? '<label class="check"><input type="checkbox" name="unsigned"><span>只寄給還沒簽同意書的人（含被要求重簽的）</span></label>' : '') +
      '<label class="field"><span>通知類型</span><select class="input" name="code"><option value="PRE_CAMP">營前通知（使用範本）</option><option value="CUSTOM">特殊訊息（自訂主旨與內容）</option></select></label>' +
      '<div class="field" data-for="PRE_CAMP"><span>通知內容</span><textarea class="input" name="message" placeholder="例如：報到時間、地點、攜帶物品…"></textarea></div>' +
      '<label class="field hidden" data-for="CUSTOM"><span>主旨</span><input class="input" name="subject"></label>' +
      '<div class="field hidden" data-for="CUSTOM"><span>內容</span><textarea class="input" name="body"></textarea><span class="hint">可用粗體、顏色、連結、按鈕與 {{姓名}} 等變數</span></div>' +
      '</form>');
    var msgTa = body.elements.message, bodyTa = body.elements.body;
    var msgEd = chipEditor(msgTa), bodyEd = chipEditor(bodyTa);
    msgTa.parentNode.insertBefore(formatToolbar(msgEd, { vars: true }), msgTa);
    msgTa.parentNode.appendChild(presetChips(msgEd, P('message'), '\n'));
    bodyTa.parentNode.insertBefore(formatToolbar(bodyEd, { vars: true }), bodyTa);
    bodyEd.el.parentNode.insertBefore(presetChips(bodyEd, P('message'), '\n'), bodyEd.el.nextSibling);
    // 勾「只寄給還沒簽同意書的人」：特殊訊息還沒寫時帶入提醒簽署的範例
    if (body.elements.unsigned) body.elements.unsigned.addEventListener('change', function () {
      if (!this.checked || body.elements.subject.value.trim() || bodyEd.value.trim()) return;
      body.elements.code.value = 'CUSTOM'; body.elements.code.dispatchEvent(new Event('change'));
      body.elements.subject.value = '【{{營隊名稱}}】請完成同意書簽署';
      bodyEd.value = ('{{姓名}} 您好：\n\n我們還沒有收到您的同意書，請在營隊開始前完成簽署（未滿 18 歲需要家長一起簽名）。\n{{簽署同意書按鈕}}\n{{學員專區}}');
    });
    body.elements.code.addEventListener('change', function () {
      $$('[data-for]', body).forEach(function (x) { x.classList.toggle('hidden', x.getAttribute('data-for') !== body.elements.code.value); });
    });
    return body;
  }
  function bulkOpts(body) {
    return {
      statuses: $$('input[name=st]:checked', body).map(function (i) { return i.value; }),
      consent: body.elements.unsigned && body.elements.unsigned.checked ? 'unsigned' : '',
      code: body.elements.code.value, message: body.elements.message.value,
      subject: body.elements.subject.value, body: body.elements.body.value
    };
  }
  /** 視窗內檢查：錯誤顯示在欄位旁 */
  function bulkCheck(body) {
    clearFieldErrors(body);
    var o = bulkOpts(body);
    if (!o.statuses.length) { fieldError($('input[name=st]', body), '請至少勾選一種狀態'); return false; }
    if (o.code === 'PRE_CAMP' && !o.message.trim()) { fieldError(body.elements.message, '請填寫通知內容'); return false; }
    if (o.code === 'CUSTOM' && !o.subject.trim()) { fieldError(body.elements.subject, '請填寫主旨'); return false; }
    if (o.code === 'CUSTOM' && !o.body.trim()) { fieldError(body.elements.body, '請填寫內容'); return false; }
    return true;
  }
  /** 已排程的群發：列在群發視窗最上方，可以取消 */
  function drawScheduled(box) {
    var list = D.scheduled || [];
    box.innerHTML = '';
    if (!list.length) return;
    box.appendChild(el('<div class="small muted">已排程（到時間由系統自動寄出）</div>'));
    list.forEach(function (x) {
      var row = el('<div class="sched-row"><span class="grow"><b></b> <span class="small muted"></span></span><button class="btn sm ghost" type="button">取消排程</button></div>');
      $('b', row).textContent = fmtTime(x.at) + '　' + x.label + (x.subject ? '「' + x.subject + '」' : '');
      $('.small', row).textContent = '寄給：' + x.statuses.join('、') + '・' + x.byName;
      $('button', row).addEventListener('click', function () {
        confirmDialog({ title: '取消這封排程群發？', lines: [fmtTime(x.at) + ' 寄出的' + x.label], okLabel: '取消排程', cancelLabel: '保留', danger: true }).then(function (ok) {
          if (!ok) return;
          withBusy(api('cancelScheduledBulk', prefix, x.id)).then(function (l) { D.scheduled = l; drawScheduled(box); toast('已取消排程'); }).catch(function (e) { toast(e.message, true); });
        });

  function openBulk() {
    if (!bulkBody) { bulkBody = bulkForm(); bulkBase = undefined; }

    drawScheduled($('.bulk-sched', body));
    if (bulkBase === undefined) setTimeout(function () { bulkBase = formSnapshot(body); }, 70);
    modal({
      title: '群發通知', desc: '寄出前會再顯示收件人數與信件預覽', body: body, wide: true, base: bulkBase,
      buttons: [{ label: '關閉', value: null }, {
        label: '先寄一封給自己', cls: 'ghost',
        validate: function () { return bulkCheck(body); },
        value: function () { return bulkOpts(body); },
        run: function (o) {
          return api('testBulk', prefix, o).then(function (r) { toast('已寄一封測試信到 ' + r.to + '（用「' + r.sample + '」的資料代入）'); return false; });
        }
      }, {
        label: '排程寄出…', cls: 'ghost',
        validate: function () { return bulkCheck(body); },
        value: function () { return bulkOpts(body); },
        run: function (o) {
          var d0 = new Date(Date.now() + 3600000);
          var def = d0.getFullYear() + '-' + pad(d0.getMonth() + 1) + '-' + pad(d0.getDate()) + 'T' + pad(d0.getHours()) + ':00';
          return formDialog({
            title: '排程寄出', okLabel: '排程', desc: '到時間由系統的定時工作寄出（約 5 分鐘內），收件人依當時的狀態決定。排程後可在群發視窗最上方取消。',
            fields: [{ name: 'at', label: '寄出時間', type: 'datetime-local', required: true, value: def }],
            check: function (v) { var t = new Date(v.at); return isNaN(t) ? { name: 'at', msg: '請選擇日期與時間' } : t.getTime() < Date.now() + 5 * 60000 ? { name: 'at', msg: '至少要在 5 分鐘之後' } : ''; },
            submit: function (v) { return api('scheduleBulk', prefix, o, new Date(v.at).toISOString()).then(function () { return v; }); }
          }).then(function (v) {
            if (!v) return false;
            toast('已排程：' + fmtTime(new Date(v.at)) + ' 寄出');
            bulkBody = null;
            return load().then(function () { return 'scheduled'; });
          });
        }
      }, {
        label: '預覽', cls: 'primary',
        validate: function () { return bulkCheck(body); },
        value: function () { return bulkOpts(body); },
        run: function (o) { return api('previewBulk', prefix, o).then(function (pv) { return { opts: o, pv: pv }; }); }
      }]
    }).then(function (r) {
      if (!r) { bulkBody = null; return; }   // 關閉（有改動時已確認放棄）
      if (r === 'scheduled') return;
      var pv = r.pv, opts = r.opts;
      var extra = ['收件人 ' + pv.count + ' 人：' + pv.names.slice(0, 12).join('、') + (pv.count > 12 ? '…' : '')];
      if (!pv.enough) extra.push('注意：今日剩餘額度 ' + pv.quota + ' 封，不足以寄出全部');
      pv.summary = [];
      return mailConfirm(pv, extra, { cancelLabel: '返回修改' }).then(function (ok) {
        if (!ok) { api('cancelBulk', prefix, pv.label).catch(function () {}); openBulk(); return; }   // 回到編輯畫面，內容保留
        return withBusy(api('runBulk', prefix, opts)).then(function (res) {
          toast('已寄出 ' + res.sent + ' 封' + (res.failed.length ? '，失敗 ' + res.failed.length + ' 封：' + res.failed.join('、') : ''), !!res.failed.length);
          bulkBody = null;
          load();
        });
      });
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 名單顯示欄位與強調顯示 ---------- */
  function openColumns() {
    var p = D.project, nameCol = p.mapping.name, ro = RO(), hl = JSON.parse(JSON.stringify(p.highlight || {}));
    // 每題實際出現過的答案（多選題拆開），依次數排序，給「答案是…」勾選
    function answers(q) {
      var cnt = {};
      D.students.forEach(function (st) {
        String((st.data || {})[q] === undefined ? '' : st.data[q]).split(/,\s*/).forEach(function (x) { x = x.trim(); if (x && x.length <= 40 && !/^https?:/i.test(x)) cnt[x] = (cnt[x] || 0) + 1; });
      });
      return Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 30);
    }
    var body = el('<div><div class="small muted" style="margin-bottom:10px">勾選要在名單顯示的表單題目，學員姓名一定顯示在第一欄。右邊的「強調」可以讓符合條件的格子標上淡淡的底色（例如飲食是素食、過敏有填寫），匯出 PDF 也會一起標。</div>' +
      '<div class="col-list"></div></div>');
    var list = $('.col-list', body);
    (p.questions || []).forEach(function (q) {
      var isName = q === nameCol, r = hl[q] || null;
      var row = el('<div class="col-row" data-q="' + esc(q) + '"><div class="col-main">' +
        '<label class="check grow"><input type="checkbox" name="disp" value="' + esc(q) + '"' + (isName || p.display.indexOf(q) >= 0 ? ' checked' : '') + (isName || ro ? ' disabled' : '') + '><span>' + esc(q) + (isName ? '（姓名，固定顯示）' : '') + '</span></label>' +
        (isName ? '' : '<select class="input sm col-hl" aria-label="強調"' + (ro ? ' disabled' : '') + '><option value="">不強調</option><option value="filled">有填寫就強調（「無」不算）</option><option value="match">答案是…</option></select>') +
        '</div><div class="col-vals" hidden></div></div>');
      list.appendChild(row);
      if (isName) return;
      var sel = $('.col-hl', row), box = $('.col-vals', row);
      sel.value = r ? r.mode : '';
      function drawVals() {
        box.hidden = sel.value !== 'match';
        if (box.hidden || box.childNodes.length) return;
        var have = (hl[q] && hl[q].mode === 'match') ? hl[q].values : [];
        var opts = answers(q);
        var extra = have.filter(function (x) { return opts.indexOf(x) < 0; });
        box.innerHTML = (opts.length ? '<div class="col-opts">' + opts.map(function (x) {
          return '<label class="check"><input type="checkbox" value="' + esc(x) + '"' + (have.indexOf(x) >= 0 ? ' checked' : '') + (ro ? ' disabled' : '') + '><span>' + esc(x) + '</span></label>';
        }).join('') + '</div>' : '<div class="small muted">目前還沒有人回答這題，可以直接在下面輸入答案</div>') +
          '<input class="input sm col-extra" placeholder="其他答案（完全相同才算，多個用「、」分隔）" maxlength="400"' + (ro ? ' disabled' : '') + '>';
        $('.col-extra', box).value = extra.join('、');
      }
      sel.addEventListener('change', drawVals);
      drawVals();
    });
    var patch = null;
    // 檢查在視窗內：選了「答案是…」卻沒有答案時，錯誤顯示在那一題旁邊
    function collect() {
      clearFieldErrors(body);
      var disp = $$('input[name=disp]:checked', body).map(function (i) { return i.value; });
      var out = {}, badRow = null;
      $$('.col-row', body).forEach(function (row) {
        var hs = $('.col-hl', row); if (!hs || !hs.value) return;
        var q = row.getAttribute('data-q');
        if (hs.value === 'filled') { out[q] = { mode: 'filled', values: [] }; return; }
        var vals = $$('.col-opts input:checked', row).map(function (i) { return i.value; })
          .concat(String(($('.col-extra', row) || {}).value || '').split(/[、,，\n]+/).map(function (x) { return x.trim(); }).filter(String));
        if (!vals.length) { badRow = badRow || row; return; }
        out[q] = { mode: 'match', values: vals };
      });
      if (badRow) { fieldError($('.col-extra', badRow) || $('.col-hl', badRow), '選了「答案是…」，請勾選或輸入要強調的答案'); return false; }
      patch = {};
      // 比對前正規化：顯示欄位依題目順序、去掉空值；強調規則依題目排序
      var norm = function (arr) { return (arr || []).filter(function (x) { return x && (p.questions || []).indexOf(x) >= 0; }); };
      var sortObj = function (o) { var r = {}; Object.keys(o || {}).sort().forEach(function (k) { r[k] = o[k]; }); return JSON.stringify(r); };
      var oldDisp = (p.questions || []).filter(function (q) { return norm(p.display).indexOf(q) >= 0; });
      if (JSON.stringify(disp) !== JSON.stringify(oldDisp)) patch.display = disp;
      if (sortObj(out) !== sortObj(p.highlight)) patch.highlight = out;
      return true;
    }

  /* ---------- 分小隊 ---------- */
  function genderOf(s) {
    var q = (D.project.questions || []).filter(function (t) { return /性別/.test(t); })[0];
    var v = q ? String(s.data[q] || '') : '';
    return /女/.test(v) ? '女' : /男/.test(v) ? '男' : '';
  }
  function openSquads() {
    var n = D.project.squads || 0;

      if (RO()) { toast('這個專案沒有設定小隊數', true); return; }
      formDialog({ title: '設定小隊數', desc: '要分幾個小隊？之後可在專案設定修改。', okLabel: '下一步',
        fields: [{ name: 'squads', label: '小隊數', type: 'number', required: true, value: 4 }] }).then(function (v) {
        if (!v) return;
        withBusy(api('updateProjectSettings', prefix, { squads: v.squads })).then(function () { return load(); }).then(openSquads).catch(function (e) { toast(e.message, true); });
      });
      return;
    }
    var list = D.students.filter(function (s) { return tierOk(s); }).sort(function (a, b) {
      return (a.squad === '' ? 99 : a.squad) - (b.squad === '' ? 99 : b.squad) || STROKE(a.name, b.name);
    });
    var cur = {};
    list.forEach(function (s) { cur[s.id] = s.squad === '' ? '' : String(s.squad); });
    var opts = '<option value="">未分隊</option>';
    for (var q = 1; q <= n; q++) opts += '<option value="' + q + '">第 ' + q + ' 隊</option>';
    var body = el('<div class="squad-dlg"><div class="squad-sum"></div>' +
      '<div class="row wrap" style="gap:8px"><button class="btn sm" type="button" data-a="auto">自動分配未分隊的人</button><button class="btn sm ghost" type="button" data-a="clear">全部改為未分隊</button>' +
      '<span class="small muted">自動分配會平均人數' + (list.some(genderOf) ? '並平衡男女' : '') + '，同團報的人盡量同隊</span></div>' +
      '<div class="squad-list">' + list.map(function (s) {
        return '<div class="squad-row" data-id="' + esc(s.id) + '"><div class="grow"><b>' + esc(s.name) + '</b> <span class="small muted">' + esc(s.status) + (genderOf(s) ? '・' + genderOf(s) : '') + (s.groupId ? '・團報' : '') + '</span></div>' +
          '<select class="input"' + (RO() ? ' disabled' : '') + '>' + opts + '</select></div>';
      }).join('') + '</div></div>');
    function sync() {
      $$('.squad-row', body).forEach(function (r) { $('select', r).value = cur[r.getAttribute('data-id')]; });
      var cnt = [];
      for (var i = 1; i <= n; i++) cnt.push('第 ' + i + ' 隊 ' + list.filter(function (s) { return cur[s.id] === String(i); }).length + ' 人');
      var un = list.filter(function (s) { return cur[s.id] === ''; }).length;
      $('.squad-sum', body).textContent = cnt.join('　') + (un ? '　未分隊 ' + un + ' 人' : '');
    }
    body.addEventListener('change', function (e) { var r = e.target.closest('.squad-row'); if (r) { cur[r.getAttribute('data-id')] = e.target.value; sync(); } });
    $('[data-a=clear]', body).addEventListener('click', function () { list.forEach(function (s) { cur[s.id] = ''; }); sync(); });
    $('[data-a=auto]', body).addEventListener('click', function () {
      var size = [], sex = [];
      for (var i = 0; i <= n; i++) { size.push(0); sex.push({ '男': 0, '女': 0, '': 0 }); }
      list.forEach(function (s) { var sqn = Number(cur[s.id]); if (sqn) { size[sqn]++; sex[sqn][genderOf(s)]++; } });
      var todo = list.filter(function (s) { return cur[s.id] === ''; });
      // 團報的人先排在一起，再依性別、筆畫
      var groupSquad = {};
      list.forEach(function (s) { if (s.groupId && cur[s.id]) groupSquad[s.groupId] = cur[s.id]; });
      todo.sort(function (a, b) { return (a.groupId ? 0 : 1) - (b.groupId ? 0 : 1) || String(a.groupId).localeCompare(String(b.groupId)) || genderOf(a).localeCompare(genderOf(b)) || STROKE(a.name, b.name); });
      var cap = Math.ceil(list.length / n);
      todo.forEach(function (s) {
        var g = genderOf(s), best = 0;
        var pref = s.groupId && groupSquad[s.groupId] ? Number(groupSquad[s.groupId]) : 0;
        if (pref && size[pref] < cap) best = pref;
        if (!best) {
          for (var k = 1; k <= n; k++) {
            if (!best || sex[k][g] < sex[best][g] || (sex[k][g] === sex[best][g] && size[k] < size[best])) best = k;
          }
        }
        cur[s.id] = String(best); size[best]++; sex[best][g]++;

      buttons: RO() ? [{ label: '關閉', value: null }] : [{ label: '取消', value: null }, {
        label: '儲存', cls: 'primary', value: true,
        run: function () {
          var diff = {};
          list.forEach(function (s) { var before = s.squad === '' ? '' : String(s.squad); if (cur[s.id] !== before) diff[s.id] = cur[s.id]; });
          if (!Object.keys(diff).length) { toast('沒有變更'); return true; }
          return api('setSquads', prefix, diff).then(function (r) { toast('已更新 ' + r.changed + ' 人的小隊'); return load(); }).then(function () { return true; });
        }
      }] });
  }

  /* ---------- 分房：房間清單＋每位學員的房間 ---------- */
  /** 房間性別：設定的「性別」優先；舊資料沒有設定時，看類型有沒有寫「男」「女」 */
  function roomGender(x) { return x.sex || (/女/.test(x.label || '') ? '女' : /男/.test(x.label || '') ? '男' : ''); }
  function openRooms() {
    var ro = RO(), cfg = D.project.rooms || { show: true, mates: true, rooms: [] };
    var list = D.students.filter(function (s) { return tierOk(s); }).sort(function (a, b) { return STROKE(a.name, b.name); });
    var cur = {};

    var body = el('<div class="room-dlg">' +

      '<div class="room-head"><span>房號</span><span>類型</span><span>性別</span><span>床位</span><span>備註（學員看得到）</span><span></span></div><div class="room-list"></div></div>' +
      '<div class="room-sec"><div class="row wrap" style="gap:8px"><h3 class="grow">分配</h3>' + (ro ? '' : '<button class="btn sm" type="button" data-a="auto">自動分配未分房的人</button><button class="btn sm ghost" type="button" data-a="clear">全部改為未分房</button>') + '</div>' +
      '<div class="squad-sum room-sum"></div><div class="squad-list room-assign"></div></div></div>');
    var rl = $('.room-list', body);
    function roomRow(x) {
      var r = el('<div class="room-row"><input class="input" data-k="no" maxlength="20" placeholder="301"><input class="input" data-k="label" maxlength="20" placeholder="四人房"><select class="input" data-k="sex"><option value="">不限</option><option value="男">男</option><option value="女">女</option></select><input class="input" data-k="beds" type="number" min="1" max="50" placeholder="不限"><input class="input" data-k="note" maxlength="200" placeholder="例如：3 樓，靠電梯"><button class="btn sm ghost" type="button" data-a="del"' + (ro ? ' disabled' : '') + '>刪除</button></div>');
      if (x.no && !x.sex) x.sex = roomGender(x);   // 舊資料：類型寫了男女就帶入性別
      ['no', 'label', 'sex', 'beds', 'note'].forEach(function (k) { var i = $('[data-k=' + k + ']', r); i.value = x[k] === undefined || x[k] === null ? '' : x[k]; i.disabled = ro; });

    }
    function rooms() {
      return $$('.room-row', rl).map(function (r) {
        var o = {}; ['no', 'label', 'sex', 'beds', 'note'].forEach(function (k) { o[k] = $('[data-k=' + k + ']', r).value.trim(); });
        o.beds = o.beds === '' ? '' : Number(o.beds);
        return o;
      }).filter(function (x) { return x.no || x.label || x.note || x.sex || x.beds !== ''; });
    }
    cfg.rooms.forEach(roomRow);
    function draw() {
      var rs = rooms().filter(function (x) { return x.no; }), cnt = {};
      list.forEach(function (s) { if (cur[s.id]) cnt[cur[s.id]] = (cnt[cur[s.id]] || 0) + 1; });
      var known = {}; rs.forEach(function (x) { known[x.no] = true; });
      var opts = '<option value="">未分房</option>' + rs.map(function (x) {
        return '<option value="' + esc(x.no) + '">' + esc(x.no) + (x.label ? ' ' + esc(x.label) : '') + (roomGender(x) ? '・' + roomGender(x) : '') + '（' + (cnt[x.no] || 0) + (x.beds ? '/' + x.beds : '') + '）</option>';

      $('.room-assign', body).innerHTML = list.map(function (s) {
        var lost = cur[s.id] && !known[cur[s.id]] ? '<option value="' + esc(cur[s.id]) + '">' + esc(cur[s.id]) + '（已不在房間清單）</option>' : '';
        return '<div class="squad-row" data-id="' + esc(s.id) + '"><div class="grow"><b>' + esc(s.name) + '</b> <span class="small muted">' + esc(s.status) + (genderOf(s) ? '・' + genderOf(s) : '') + (s.groupId ? '・團報' : '') + '</span></div>' +
          '<select class="input"' + (ro ? ' disabled' : '') + '>' + opts + lost + '</select></div>';
      }).join('') || '<div class="small muted">還沒有學員</div>';
      $$('.squad-row', body).forEach(function (r) { $('select', r).value = cur[r.getAttribute('data-id')]; });
      var full = rs.filter(function (x) { return x.beds && (cnt[x.no] || 0) > x.beds; }).map(function (x) { return x.no; });
      var un = list.filter(function (s) { return !cur[s.id]; }).length;
      // 混住檢查：同一間有男有女，或學員性別跟房間設定不同

        var m = list.filter(function (s) { return cur[s.id] === x.no; }), b = m.filter(function (s) { return genderOf(s) === '男'; }), g = m.filter(function (s) { return genderOf(s) === '女'; });
        if (b.length && g.length) { mixed.push(x.no + '（男 ' + b.length + '、女 ' + g.length + '）'); m.forEach(function (s) { if (genderOf(s)) bad[s.id] = true; }); }
      });
      list.forEach(function (s) { var rg = sexOf[cur[s.id]]; if (cur[s.id] && rg && genderOf(s) && genderOf(s) !== rg) { wrong.push(s.name + '（' + genderOf(s) + '）在 ' + cur[s.id] + ' ' + rg + '生房'); bad[s.id] = true; } });
      $$('.squad-row', body).forEach(function (r) { r.style.background = bad[r.getAttribute('data-id')] ? 'var(--bad-soft, #fdecea)' : ''; });
      $('.room-sum', body).innerHTML = esc(rs.length + ' 間房，已分 ' + (list.length - un) + ' 人' + (un ? '，未分房 ' + un + ' 人' : '')) +

        (mixed.length ? '<div style="color:var(--bad)">' + esc('男女混住：' + mixed.join('、')) + '</div>' : '') +
        (wrong.length ? '<div style="color:var(--bad)">' + esc('性別不符：' + wrong.join('、')) + '</div>' : '') +
        (!mixed.length && !wrong.length && list.some(function (s) { return cur[s.id]; }) ? '<div class="small muted">沒有混住' + (list.some(genderOf) ? '' : '（報名表沒有「性別」欄位，無法檢查）') + '</div>' : '');
    }
    body.addEventListener('change', function (e) {
      var r = e.target.closest('.squad-row');
      if (r) cur[r.getAttribute('data-id')] = e.target.value;

    if (!ro) {

      $('[data-a=add]', body).addEventListener('click', function () { $('[data-k=no]', roomRow({})).focus(); });
      $('[data-a=batch]', body).addEventListener('click', function () {
        formDialog({ title: '一次新增多間房', desc: '房號是數字時，從起始號碼連續新增，例如 301 到 310。', okLabel: '新增',
          fields: [{ name: 'from', label: '起始房號', type: 'number', required: true }, { name: 'to', label: '結束房號', type: 'number', required: true },
            { name: 'label', label: '類型（選填，例如 四人房）' }, { name: 'sex', label: '性別', type: 'select', options: [{ value: '', label: '不限' }, { value: '男', label: '男' }, { value: '女', label: '女' }] }, { name: 'beds', label: '每間床位（選填）', type: 'number' }],
          check: function (v) { var a0 = Number(v.from), z0 = Number(v.to); return a0 > 0 && z0 >= a0 && z0 - a0 < 100 ? '' : { name: 'to', msg: '房號範圍不正確（結束要大於等於起始，一次最多 100 間）' }; } }).then(function (v) {
          if (!v) return;
          var a = Number(v.from), z = Number(v.to);
          var have = {}; rooms().forEach(function (x) { have[x.no] = true; });
          for (var i = a; i <= z; i++) if (!have[String(i)]) roomRow({ no: String(i), label: v.label || '', sex: v.sex || '', beds: v.beds || '' });

      $('[data-a=clear]', body).addEventListener('click', function () { list.forEach(function (s) { cur[s.id] = ''; }); draw(); });
      $('[data-a=auto]', body).addEventListener('click', function () {
        var rs = rooms().filter(function (x) { return x.no; });
        if (!rs.length) { toast('請先新增房間', true); return; }
        var cnt = {}, groupRoom = {};
        list.forEach(function (s) { if (cur[s.id]) { cnt[cur[s.id]] = (cnt[cur[s.id]] || 0) + 1; if (s.groupId) groupRoom[s.groupId] = cur[s.id]; } });
        function fits(x, s) { var g = roomGender(x); return (!g || !genderOf(s) || g === genderOf(s)) && (!x.beds || (cnt[x.no] || 0) < x.beds); }
        var todo = list.filter(function (s) { return !cur[s.id]; });
        todo.sort(function (a, b) { return (a.groupId ? 0 : 1) - (b.groupId ? 0 : 1) || String(a.groupId).localeCompare(String(b.groupId)) || genderOf(a).localeCompare(genderOf(b)) || STROKE(a.name, b.name); });
        var left = 0;
        todo.forEach(function (s) {
          var pick = null, pref = s.groupId && groupRoom[s.groupId];

    // 檢查在視窗內：房號空白、重複、床位錯誤時標在那一間房旁邊，房間和分配都不會不見

    modal({ title: '分房', desc: list.length + ' 位學員（已取消、失敗的不列入）。改完按儲存才會寫回；學員專區與信件的 {{房號}} 會顯示房間。', body: body, wide: true,
      buttons: ro ? [{ label: '關閉', value: null }] : [{ label: '取消', value: null }, {
        label: '儲存', cls: 'primary', value: true, validate: check,
        run: function () {

  /* ---------- 勾選多人批次操作 ----------

  var BATCH = {
    confirmPaid: { label: '確認繳款', mail: true },

  function pickedIds() {

  }
  function renderBatchBar() {
    var bar = $('#st-batch', root), ids = D ? pickedIds() : [];
    if (!ids.length || RO()) { bar.classList.add('hidden'); bar.innerHTML = ''; return; }
    bar.classList.remove('hidden');

    return modal({

  /* ---------- 報名趨勢圖：每天累計的報名人數與確認繳款人數（inline SVG） ---------- */
  function dayKey(t) { var d = new Date(t); return isNaN(d) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  /** 確認繳款的時間：狀態紀錄裡第一次變成「程序完成」的時間（舊資料找不到時不計入） */
  function paidDay(s) {
    var h = (s.history || []).filter(function (x) { return /→ 程序完成/.test(x.msg); })[0];
    return h ? dayKey(h.t) : '';
  }
  function trendData() {
    var reg = {}, paid = {}, days = [];
    D.students.forEach(function (s) {
      var k = dayKey(s.time); if (k) reg[k] = (reg[k] || 0) + 1;
      var pk = paidDay(s); if (pk) paid[pk] = (paid[pk] || 0) + 1;
    });
    var keys = Object.keys(reg).concat(Object.keys(paid)).sort();
    if (!keys.length) return null;
    var d = new Date(keys[0] + 'T00:00:00'), end = new Date(keys[keys.length - 1] + 'T00:00:00');
    var today = new Date(); today.setHours(0, 0, 0, 0);
    if (today > end && today - end < 120 * 86400000) end = today;
    var r = 0, p = 0;
    while (d <= end && days.length < 400) {
      var k2 = dayKey(d);
      r += reg[k2] || 0; p += paid[k2] || 0;
      days.push({ day: k2, reg: r, paid: p, newReg: reg[k2] || 0, newPaid: paid[k2] || 0 });
      d.setDate(d.getDate() + 1);
    }
    return days;
  }
  function renderTrend() {
    var box = $('#st-trend', root), days = trendData();
    if (!days) { box.innerHTML = '<div class="small muted">還沒有報名資料</div>'; return; }
    var W = 720, H = 240, L = 40, R = 16, T = 16, B = 30;
    var max = Math.max(4, days[days.length - 1].reg, D.stats.capacity || 0);
    var step = max <= 10 ? 2 : max <= 50 ? 10 : max <= 200 ? 50 : 100;
    max = Math.ceil(max / step) * step;
    var n = days.length;
    function x(i) { return L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)); }
    function y(v) { return T + (H - T - B) * (1 - v / max); }
    function path(key) { return days.map(function (d, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[key]).toFixed(1); }).join(' '); }
    var grid = '';
    for (var v = 0; v <= max; v += step) grid += '<line class="tr-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="tr-ax" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    var ticks = '', every = Math.max(1, Math.ceil(n / 6));
    days.forEach(function (d, i) { if (i % every === 0 || i === n - 1) ticks += '<text class="tr-ax" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.day.slice(5).replace('-', '/') + '</text>'; });
    var cap = D.stats.capacity ? '<line class="tr-cap" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(D.stats.capacity) + '" y2="' + y(D.stats.capacity) + '"/><text class="tr-ax" x="' + (W - R) + '" y="' + (y(D.stats.capacity) - 5) + '" text-anchor="end">名額上限 ' + D.stats.capacity + '</text>' : '';
    var last = days[n - 1];
    box.innerHTML = '<div class="row wrap tr-head"><b>報名趨勢（累計）</b><span class="tr-key"><i class="tr-sw reg"></i>報名人數 ' + last.reg + '</span><span class="tr-key"><i class="tr-sw paid"></i>確認繳款 ' + last.paid + '</span><span class="small muted grow" style="text-align:right">含之後取消的人；確認繳款依狀態紀錄的日期</span></div>' +
      '<div class="tr-wrap"><svg class="tr-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每天累計報名人數與確認繳款人數，最新：報名 ' + last.reg + ' 人、確認繳款 ' + last.paid + ' 人">' +
      grid + cap + ticks +
      '<path class="tr-line reg" d="' + path('reg') + '"/><path class="tr-line paid" d="' + path('paid') + '"/>' +
      '<line class="tr-cross hidden" y1="' + T + '" y2="' + (H - B) + '"/><circle class="tr-dot reg hidden" r="4"/><circle class="tr-dot paid hidden" r="4"/>' +
      '<rect class="tr-hit" x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '"/></svg><div class="tr-tip hidden" role="status"></div></div>' +
      '<details class="tr-table"><summary class="small">以表格查看</summary><div class="table-wrap"><table class="simple"><thead><tr><th>日期</th><th>當天報名</th><th>累計報名</th><th>當天確認繳款</th><th>累計確認繳款</th></tr></thead><tbody>' +
      days.filter(function (d) { return d.newReg || d.newPaid; }).map(function (d) { return '<tr><td>' + d.day.replace(/-/g, '/') + '</td><td>' + d.newReg + '</td><td>' + d.reg + '</td><td>' + d.newPaid + '</td><td>' + d.paid + '</td></tr>'; }).join('') +
      '</tbody></table></div></details>';
    // 滑過：十字線＋當天的數字
    var svg = $('svg', box), tip = $('.tr-tip', box), cross = $('.tr-cross', box), dr = $('.tr-dot.reg', box), dp = $('.tr-dot.paid', box);
    function show(ev) {
      var rc = svg.getBoundingClientRect(), px = (ev.clientX - rc.left) * W / rc.width;
      var i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - R) / (n - 1)))));
      var d = days[i];
      [cross, dr, dp, tip].forEach(function (e) { e.classList.remove('hidden'); });
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
      dr.setAttribute('cx', x(i)); dr.setAttribute('cy', y(d.reg)); dp.setAttribute('cx', x(i)); dp.setAttribute('cy', y(d.paid));
      tip.textContent = d.day.replace(/-/g, '/') + '　報名 ' + d.reg + '（+' + d.newReg + '）　確認繳款 ' + d.paid + '（+' + d.newPaid + '）';
      var left = x(i) / W * rc.width;
      tip.style.left = Math.max(0, Math.min(rc.width - tip.offsetWidth, left - tip.offsetWidth / 2)) + 'px';
    }
    $('.tr-hit', box).addEventListener('mousemove', show);
    $('.tr-hit', box).addEventListener('mouseleave', function () { [cross, dr, dp, tip].forEach(function (e) { e.classList.add('hidden'); }); });
  }

  var watching = false, pending = null, updBar = null;
  function hideUpdate() { pending = null; if (updBar) { updBar.remove(); updBar = null; } }
  function applyUpdate() {
    if (!pending) return;

  function showUpdate(d) {
    var old = {}, added = 0, changed = 0;
    D.students.forEach(function (x) { old[x.id] = x.status; });
    d.students.forEach(function (x) { if (!(x.id in old)) added++; else if (old[x.id] !== x.status) changed++; });
    var parts = [];
    if (added) parts.push(added + ' 筆新報名');

    pending = d;

      $('.btn.primary', updBar).addEventListener('click', applyUpdate);

      document.body.appendChild(updBar);
    }
    updBar.classList.remove('hidden');

    }).catch(function () { /* 背景檢查失敗就略過 */ }).then(function () { watching = false; });
  }

  load().then(function () {
    // 從開始新專案的完成頁點進來：直接打開專案設定的那一區
    if (params.settings && D) { openSettings(params.settings); return; }
    // 從通知鈴鐺點進來：直接打開那位學員
    if (!params.student || !D) return;
    var hit = D.students.filter(function (x) { return x.id === params.student; })[0];
    if (hit) openDetail(hit); else toast('找不到這位學員，可能已被移除', true);
  });
});
</script>
</body>
</html>
