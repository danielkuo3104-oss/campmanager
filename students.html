<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="營隊管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>報名與學員管理｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/export.js"></script>
</head>
<body>
  <main id="app">
<div class="view-students hidden">
  <div class="page-head">
    <div>
      <div class="row wrap"><h1 id="st-title">載入中</h1><span id="st-status"></span></div>
      <div class="sub" id="st-sub"></div>
    </div>
    <div class="spacer"></div>
    <div class="row wrap">
      <button class="btn" type="button" id="st-sync">同步表單</button>
      <button class="btn" type="button" id="st-bulk">群發通知</button>
      <button class="btn" type="button" id="st-export">匯出 PDF</button>
      <button class="btn primary" type="button" id="st-settings">專案設定</button>
    </div>
  </div>
  <div id="st-banner"></div>
  <div class="stats" id="st-stats"></div>
  <div class="card">
    <div class="toolbar">
      <input class="input" id="st-search" placeholder="搜尋姓名、電話、身分證…" style="max-width:260px">
      <div class="chips" id="st-chips"></div>
      <span class="spacer"></span>
      <span class="muted small" id="st-count"></span>
    </div>
    <div class="table-wrap">
      <table class="list"><thead id="st-head"></thead><tbody id="st-body"></tbody></table>
    </div>
  </div>
</div>
<div class="loading" id="page-loading"><div class="spinner"></div>載入中</div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
<script>
App.page('students', function (root, params) {
  var prefix = params.prefix;
  var D = null;               // 伺服器回傳的專案資料
  var filter = 'all';
  var search = '';

  var FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'warn', label: '警示' },
    { key: 'todo', label: '待繳款／核對' },
    { key: 'done', label: '程序完成' },
    { key: 'wait', label: '候補中' },
    { key: 'gone', label: '取消／失敗' }
  ];

  function load() {
    return api('getProjectData', prefix).then(function (d) { D = d; render(); })
      .catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 排序：警示 → 已報名（期限近的在上）→ 程序完成 → 候補 → 取消；同層依報名時間；團報相鄰 ---------- */
  function tier(s) {
    if (D.warningStatuses.indexOf(s.status) >= 0) return 0;
    if (s.status === '程序完成') return 2;
    if (D.activeStatuses.indexOf(s.status) >= 0) return 1;
    if (s.status === '候補中') return 3;
    if (s.status === '報名取消') return 4;
    return 5;
  }
  function keyOf(s) {
    var t = tier(s);
    var k2 = 0;
    if (t === 1 || t === 0) { var d = Date.parse(s.deadline); k2 = isNaN(d) ? 9e15 : d; }
    if (t === 3 && D.project.waitOrder === '人工') k2 = s.rank === '' ? 9e15 : Number(s.rank);
    return [t, k2, Date.parse(s.time) || 0];
  }
  function cmp(a, b) { for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; }

  function sorted(list) {
    var keys = {};
    list.forEach(function (s) { keys[s.id] = keyOf(s); });
    var groupKey = {};
    list.forEach(function (s) {
      if (!s.groupId || tier(s) >= 4) return;
      var k = keys[s.id];
      if (!groupKey[s.groupId] || cmp(k, groupKey[s.groupId]) < 0) groupKey[s.groupId] = k;
    });
    return list.slice().sort(function (a, b) {
      var ga = a.groupId && tier(a) < 4 ? groupKey[a.groupId] : keys[a.id];
      var gb = b.groupId && tier(b) < 4 ? groupKey[b.groupId] : keys[b.id];
      var c = cmp(ga, gb);
      if (c) return c;
      var ida = a.groupId && tier(a) < 4 ? a.groupId : a.id, idb = b.groupId && tier(b) < 4 ? b.groupId : b.id;
      if (ida !== idb) return ida < idb ? -1 : 1;
      return cmp(keys[a.id], keys[b.id]);
    });
  }

  function matches(s) {
    var t = tier(s);
    if (filter === 'warn' && t !== 0) return false;
    if (filter === 'todo' && t !== 1 && t !== 0) return false;
    if (filter === 'done' && t !== 2) return false;
    if (filter === 'wait' && t !== 3) return false;
    if (filter === 'gone' && t < 4) return false;
    if (search) {
      var hay = (s.name + ' ' + s.email + ' ' + Object.keys(s.data).map(function (k) { return s.data[k]; }).join(' ')).toLowerCase();
      if (hay.indexOf(search) < 0) return false;
    }
    return true;
  }

  /* ---------- 版面 ---------- */
  function render() {
    var p = D.project;
    $('#st-title', root).textContent = p.name;
    $('#st-status', root).innerHTML = pill(D.effective);
    var regText = p.regStart || p.regEnd ? (p.regStart ? fmtDate(p.regStart) : '不限') + ' – ' + (p.regEnd ? fmtDate(p.regEnd) : '未定') : '未設定';
    var regTag = p.regState === 'before' ? '（尚未開始）' : p.regState === 'after' ? '（已結束）' : '';
    $('#st-sub', root).textContent = p.prefix + '　·　招生 ' + regText + regTag + '　·　營期 ' + fmtDate(p.start) + ' – ' + fmtDate(p.end) + '　·　遞補：' + p.promoteMode + '　·　候補順序：' + p.waitOrder;

    var banner = $('#st-banner', root);
    banner.className = ''; banner.textContent = '';
    if (D.readOnly) {
      banner.className = 'banner bad';
      banner.textContent = '此專案目前為「' + D.effective + '」，只能瀏覽，不能寄信或修改資料。';
    } else if (p.status === '系統維護') {
      banner.className = 'banner warn';
      banner.textContent = '系統維護中：所有寄出的信件會改寄到 ' + p.maintBy + '，不會寄給學員。';
    }
    ['#st-sync', '#st-bulk'].forEach(function (id) { $(id, root).disabled = D.readOnly; });

    var st = D.stats;
    var pct = st.capacity ? Math.min(100, Math.round(st.active / st.capacity * 100)) : 0;
    $('#st-stats', root).innerHTML =
      stat('報名人數', st.active + '<small>/ ' + st.capacity + '</small>', '剩餘名額 ' + st.available + (st.reserved ? '（團報預留 ' + st.reserved + '）' : ''), pct) +
      stat('完成度', st.completion + '<small>%</small>', '程序完成 ' + st.done + ' 人', st.completion) +
      stat('預計收入', money(st.expectedIncome) + '<small>元</small>', '已錄取者應繳合計') +
      stat('已確認繳款', money(st.confirmedIncome) + '<small>元</small>', '程序完成者合計') +
      stat('警示', st.warnings + '<small>人</small>', st.outside ? '含招生期外 ' + st.outside + ' 人待決定' : '招生期外、匯款逾期、匯款異常') +
      stat('候補中', st.waitlist + '<small>人</small>', '取消 ' + st.cancelled + '　失敗 ' + st.failed);

    var chips = $('#st-chips', root);
    chips.innerHTML = '';
    FILTERS.forEach(function (f) {
      var c = el('<button class="chip' + (filter === f.key ? ' on' : '') + '" type="button"></button>');
      c.textContent = f.label;
      c.addEventListener('click', function () { filter = f.key; render(); });
      chips.appendChild(c);
    });
    renderTable();
  }

  function stat(label, value, foot, bar) {
    return '<div class="stat"><div class="label">' + esc(label) + '</div><div class="value">' + value + '</div>' +
      (bar !== undefined ? '<div class="bar"><i style="width:' + bar + '%"></i></div>' : '') +
      '<div class="foot">' + esc(foot) + '</div></div>';
  }

  function columns() {
    var cols = (D.project.display || []).filter(function (t) { return t; });
    if (!cols.length && D.project.mapping.name) cols = [D.project.mapping.name];
    return cols;
  }

  function valueHtml(v) {
    var s = String(v === undefined || v === null ? '' : v);
    if (!s) return '<span class="muted">—</span>';
    var parts = s.split(/,\s*/);
    var links = parts.filter(function (x) { return /^https?:\/\//i.test(x); });
    if (links.length && links.length === parts.length) {
      return links.map(function (u, i) {
        var label = /drive\.google\.com/.test(u) ? '查看檔案' : '開啟連結';
        return '<a class="link-btn" target="_blank" rel="noopener" href="' + esc(u) + '" onclick="event.stopPropagation()">' + label + (links.length > 1 ? ' ' + (i + 1) : '') + '</a>';
      }).join('');
    }
    return esc(s);
  }

  function renderTable() {
    var cols = columns();
    $('#st-head', root).innerHTML = '<tr><th>狀態</th>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th>備註（狀態紀錄）</th><th></th></tr>';
    var list = sorted(D.students).filter(matches);
    $('#st-count', root).textContent = '顯示 ' + list.length + ' / ' + D.students.length + ' 筆';
    var body = $('#st-body', root);
    body.innerHTML = '';
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="' + (cols.length + 3) + '"><div class="empty">' + (D.students.length ? '沒有符合條件的學員' : '還沒有報名資料') + '</div></td></tr>';
      return;
    }
    var prevGroup = null;
    list.forEach(function (s) {
      var grouped = s.groupId && tier(s) < 4;
      var tr = document.createElement('tr');
      if (tier(s) >= 4) tr.className = 'faded';
      if (grouped) {
        tr.classList.add('in-group');
        if (prevGroup !== s.groupId) tr.classList.add('group-start');
      }
      prevGroup = grouped ? s.groupId : null;

      var tags = '';
      if (grouped) {
        tags += '<span class="tag group">團報</span>';
        if (s.groupIncomplete) tags += '<span class="tag group">未齊</span>';
      }
      if (s.status === '候補中' && s.rank !== '') tags += '<span class="tag">候補 ' + esc(s.rank) + '</span>';
      var deadlineNote = (tier(s) <= 1 && s.deadline) ? '<div class="small muted" style="margin-top:4px">期限 ' + esc(fmtTime(s.deadline)) + '</div>' : '';

      var html = '<td>' + pill(s.status) + deadlineNote + '</td>';
      cols.forEach(function (c, i) {
        html += '<td class="cell-clip">' + valueHtml(s.data[c]) + (i === 0 ? tags : '') + '</td>';
      });
      var last = s.history && s.history.length ? s.history[s.history.length - 1] : null;
      html += '<td class="note-cell">' + (last ? '<div class="last">' + esc(last.msg) + '</div><div class="small" style="color:var(--text-3)">' + esc(fmtTime(last.t)) + '　·　共 ' + s.history.length + ' 筆</div>' : '') + '</td>';
      html += '<td style="text-align:right"><button class="btn ghost icon" type="button" aria-label="操作">⋯</button></td>';
      tr.innerHTML = html;
      $('button', tr).addEventListener('click', function (e) { e.stopPropagation(); openActions(this, s); });
      tr.addEventListener('click', function () { openDetail(s); });
      body.appendChild(tr);
    });
  }

  /* ---------- 學員操作選單（每位學員列最後方） ---------- */
  function has(s, list) { return list.indexOf(s.status) >= 0; }
  var ACTIVE_NOT_DONE = ['已報名', '繳款待核覆', '匯款逾期', '匯款異常'];

  function openActions(anchor, s) {
    var ro = D.readOnly;
    var items = [{ header: s.name }];
    function add(label, ok, fn, danger) { items.push({ label: label, disabled: ro || !ok, onClick: fn, danger: danger }); }
    if (s.status === '招生期外') {
      items.push({ header: '招生期外的報名' });
      add('受理報名…', true, function () {
        ask('受理報名', [{ name: 'sendMail', label: '寄送結果通知給學員（下一步可預覽）', type: 'checkbox', value: true }], function (v) { run(s, 'accept', v); });
      });
      items.push({ sep: true });
    }
    items.push({ header: '寄送通知' });
    add('補寄報名與繳款通知', has(s, ACTIVE_NOT_DONE.concat(['候補中'])), function () { run(s, 'resend', {}); });
    add('匯款期限鄰近通知', has(s, ['已報名', '匯款逾期']), function () { run(s, 'deadline', {}); });
    add('匯款異常通知…', has(s, ACTIVE_NOT_DONE), function () {
      ask('匯款異常通知', [{ name: 'reason', label: '異常原因', type: 'textarea', required: true, placeholder: '例如：匯款金額不足 500 元／查無後五碼' }], function (v) { run(s, 'abnormal', v); });
    });
    add('報名費用異動通知…', has(s, ACTIVE_NOT_DONE.concat(['候補中'])), function () {
      ask('報名費用異動通知', [
        { name: 'amount', label: '新的應繳金額（元）', type: 'number', required: true, value: s.price, hint: '目前 ' + money(s.price) + ' 元。金額只能透過此通知修改，會寫回後端並寄信。' },
        { name: 'reason', label: '異動原因', type: 'textarea', required: true }
      ], function (v) { run(s, 'feeChange', v); });
    });
    add('寄送特殊訊息…', !!s.email, function () {
      ask('寄送特殊訊息', [{ name: 'subject', label: '主旨', required: true }, { name: 'body', label: '內容', type: 'textarea', required: true, hint: '可使用 {{姓名}}、{{營隊名稱}}、{{應繳金額}} 等變數' }], function (v) { run(s, 'custom', v); });
    });
    items.push({ sep: true }, { header: '報名狀態' });
    add('確認繳款…', has(s, ACTIVE_NOT_DONE), function () {
      ask('確認繳款', [{ name: 'amount', label: '核對到的匯款金額（元）', type: 'number', required: true, value: s.price, hint: '應繳 ' + money(s.price) + ' 元；金額一致才會標為程序完成並寄出確認信' }], function (v) { run(s, 'confirmPaid', v); });
    });
    add('標記繳款待核覆', has(s, ['已報名', '匯款逾期', '匯款異常']), function () { run(s, 'markPending', {}); });
    add('遞補錄取', s.status === '候補中', function () { run(s, 'promote', {}); });
    add('調整候補順位…', s.status === '候補中', function () {
      ask('調整候補順位', [{ name: 'rank', label: '新的順位', type: 'number', required: true, value: s.rank }], function (v) { run(s, 'setRank', v); });
    });
    add('調整團報歸屬…', tierOk(s), function () { askGroup(s); });
    add('手動變更狀態…', true, function () {
      var opts = Object.keys(D.statuses).map(function (k) { return D.statuses[k]; }).filter(function (x) { return x !== s.status; });
      ask('手動變更狀態', [{ name: 'status', label: '新狀態', type: 'select', options: opts, required: true }, { name: 'reason', label: '變更原因', type: 'textarea', required: true }], function (v) { run(s, 'setStatus', v); });
    });
    items.push({ sep: true });
    add('取消報名…', !has(s, ['報名取消', '報名失敗']), function () {
      ask('取消報名', [
        { name: 'reason', label: '取消原因', type: 'textarea', required: true },
        { name: 'sendMail', label: '寄送取消報名通知給學員', type: 'checkbox', value: true }
      ], function (v) { run(s, 'cancel', v); }, true);
    }, true);
    popMenu(anchor, items);
  }

  function tierOk(s) { return ['報名取消', '報名失敗'].indexOf(s.status) < 0; }

  function ask(title, fields, then, danger) {
    formDialog({ title: title, fields: fields, danger: danger }).then(function (v) { if (v) then(v); });
  }

  function askGroup(s) {
    var others = D.students.filter(function (x) { return x.id !== s.id && tierOk(x); })
      .map(function (x) { return { value: x.id, label: x.name + '（' + x.status + '）' }; });
    var opts = [{ value: '', label: s.groupId ? '移出團報，改為個人報名' : '（請選擇）' }].concat(others);
    ask('調整團報歸屬', [{ name: 'withId', label: '與誰同一團', type: 'select', options: opts }], function (v) { run(s, 'setGroup', v); });
  }

  /** 兩段式：先預覽 → 確認視窗 → 執行；取消也留紀錄 */
  function run(s, action, extra) {
    withBusy(api('previewAction', prefix, s.id, action, extra)).then(function (pv) {
      return mailConfirm(pv).then(function (ok) {
        if (!ok) { api('cancelAction', prefix, s.id, action); return; }
        return withBusy(api('runAction', prefix, s.id, action, extra)).then(function (r) {
          if (r.note) toast(r.note, true); else toast('已完成：' + pv.label);
          if (r.promoted && r.promoted.length) toast('已自動遞補：' + r.promoted.join('、'));
          closeDetail();
          return load();
        });
      });
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 學員詳細資料 ---------- */
  var detail = null;
  function closeDetail() { if (detail) { detail.close(); detail = null; } }

  function openDetail(s) {
    closeDetail();
    var p = D.project;
    detail = drawer({ title: s.name || '(未填姓名)', sub: pill(s.status) + '　' + esc(s.email), onClose: function () { detail = null; } });
    var head = $('.drawer-head', detail.el);
    var actBtn = el('<button class="btn sm" type="button">操作</button>');
    actBtn.addEventListener('click', function (e) { e.stopPropagation(); openActions(actBtn, s); });
    head.insertBefore(actBtn, head.lastElementChild);

    var g = s.groupId ? D.groups[s.groupId] : null;
    var sys = [
      ['報名時間', fmtTime(s.time)],
      ['應繳金額', money(s.price) + ' 元' + (s.priceType ? '（' + s.priceType + '）' : '')],
      ['匯款期限', fmtTime(s.deadline) || '—'],
      ['已繳金額', s.paid === '' ? '—' : money(s.paid) + ' 元'],
      ['候補順位', s.rank === '' ? '—' : s.rank],
      ['團報', g ? g.names.join('、') + '（預期 ' + g.expected + ' 人' + (s.groupIncomplete ? '，未齊' : '') + (g.reserved ? '，預留 ' + g.reserved + ' 名額至 ' + fmtTime(g.holdUntil) : '') + '）' : (s.partners && s.partners.length ? '填寫同伴：' + s.partners.join('、') : '個人報名')],
      ['結果通知', /^\d{4}-\d{2}-\d{2}T/.test(s.notified) ? '已寄出（' + fmtTime(s.notified.split(' ')[0]) + '）' : (s.notified || '—')]
    ];
    var html = '<div class="drawer-section"><h3>報名資訊</h3><dl class="kv">' +
      sys.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl></div>';

    var titles = (p.questions || []).slice();
    Object.keys(s.data).forEach(function (k) { if (titles.indexOf(k) < 0) titles.push(k); });
    html += '<div class="drawer-section"><h3>表單資料</h3>' + titles.map(function (t, i) {
      return '<div class="field-row"><div class="k">' + esc(t) + '</div><div class="v">' + valueHtml(s.data[t]) + '</div>' +
        (D.readOnly ? '<span></span>' : '<button class="btn ghost sm" type="button" data-edit="' + i + '">修改</button>') + '</div>';
    }).join('') + '</div>';

    var hist = (s.history || []).slice().reverse();
    html += '<div class="drawer-section"><h3>狀態紀錄</h3><ul class="timeline">' + hist.map(function (h) {
      return '<li><div>' + esc(h.msg) + '</div><div class="t">' + esc(fmtTime(h.t)) + '　·　' + esc(h.by) + '</div></li>';
    }).join('') + '</ul></div>';
    detail.body.innerHTML = html;

    $$('[data-edit]', detail.body).forEach(function (b) {
      b.addEventListener('click', function () {
        var t = titles[Number(b.getAttribute('data-edit'))];
        formDialog({
          title: '修改資料', desc: '修改會記錄在狀態紀錄與操作紀錄中', okLabel: '儲存',
          fields: [{ name: 'value', label: t, type: 'textarea', value: s.data[t] || '' }]
        }).then(function (v) {
          if (!v) return;
          withBusy(api('updateStudentField', prefix, s.id, t, v.value)).then(function () {
            toast('已修改「' + t + '」');
            return load().then(function () {
              var fresh = D.students.filter(function (x) { return x.id === s.id; })[0];
              if (fresh) openDetail(fresh);
            });
          }).catch(function (e) { toast(e.message, true); });
        });
      });
    });
  }

  /* ---------- 專案設定 ---------- */
  function openSettings() {
    var p = D.project;
    var d = drawer({ title: '專案設定', sub: esc(p.prefix + '　·　' + p.name) });
    var ro = D.readOnly;
    var fk = D.fieldKeys;
    var qOpts = function (sel) {
      return '<option value="">（未對應）</option>' + (p.questions || []).map(function (q) {
        return '<option value="' + esc(q) + '"' + (q === sel ? ' selected' : '') + '>' + esc(q) + '</option>';
      }).join('');
    };
    d.body.innerHTML =
      '<div class="drawer-section"><h3>系統維護</h3><div class="row"><button class="switch' + (p.status === '系統維護' ? ' on' : '') + '" type="button" id="set-maint"' + (ro ? ' disabled' : '') + '></button>' +
      '<span class="small muted">開啟後，所有寄出的信件改寄給你（設定者），不會寄給學員。</span></div></div>' +
      '<form id="set-form"><div class="drawer-section"><h3>名額與遞補</h3><div class="grid-2">' +
      f('capacity', '招生人數上限', 'number', p.capacity, '目前已錄取 ' + D.stats.active + ' 人，只能設為 ' + D.stats.active + ' 以上；要更低請先取消特定學員報名') +
      f('holdHours', '團報預留名額保留時數', 'number', p.holdHours) +
      sel('promoteMode', '遞補模式', ['手動', '自動'], p.promoteMode) +
      sel('waitOrder', '候補順序', ['報名時間', '人工'], p.waitOrder) +
      '</div></div><div class="drawer-section"><h3>費用與匯款</h3><div class="grid-2">' +
      f('price', '原價', 'number', p.price) + f('groupPrice', '團報價', 'number', p.groupPrice) +
      f('earlyPrice', '早鳥價', 'number', p.earlyPrice) + f('earlyDeadline', '早鳥期限', 'date', p.earlyDeadline) +
      f('account', '匯款帳號', 'text', p.account) + f('payDays', '匯款期限（報名後幾天）', 'number', p.payDays) +
      '</div><div class="hint" style="margin-top:8px">價格變更只影響之後的報名；已報名學員的金額請用「報名費用異動通知」。</div></div>' +
      '<div class="drawer-section"><h3>營隊資訊</h3><div class="grid-2">' +
      f('name', '營隊名稱', 'text', p.name) + '<span></span>' + f('regStart', '開始招生日期', 'date', p.regStart, '這天 00:00 起受理報名') + f('regEnd', '預計結束招生日期', 'date', p.regEnd, '這天 23:59 後的報名會先記為「招生期外」') +
      f('start', '營期開始', 'date', p.start) + f('end', '營期結束', 'date', p.end) +
      '</div></div>' +
      '<div class="drawer-section"><h3>表單欄位對應</h3><p class="hint" style="margin-top:0">系統用關鍵字找欄位，找錯或找不到時請手動指定。</p><div class="grid-2">' +
      fk.map(function (k) { return '<label class="field"><span>' + esc(k.label) + '</span><select class="input" name="map_' + k.key + '">' + qOpts(p.mapping[k.key]) + '</select></label>'; }).join('') +
      '</div></div>' +
      '<div class="drawer-section"><div class="row"><h3 class="grow">名單顯示欄位</h3><button class="btn sm" type="button" id="set-refresh"' + (ro ? ' disabled' : '') + '>重新讀取表單題目</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">' + (p.questions || []).map(function (q) {
        return '<label class="check"><input type="checkbox" name="disp" value="' + esc(q) + '"' + (p.display.indexOf(q) >= 0 ? ' checked' : '') + '><span>' + esc(q) + '</span></label>';
      }).join('') + '</div></div>' +
      '<div class="row" style="position:sticky;bottom:0;background:var(--surface);padding:12px 0"><span class="spacer"></span><button class="btn primary" type="submit"' + (ro ? ' disabled' : '') + '>儲存設定</button></div></form>';

    function f(name, label, type, value, hint) {
      return '<label class="field"><span>' + esc(label) + '</span><input class="input" name="' + name + '" type="' + type + '" value="' + esc(value === undefined ? '' : value) + '"' + (ro ? ' disabled' : '') + '>' + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>';
    }
    function sel(name, label, options, value) {
      return '<label class="field"><span>' + esc(label) + '</span><select class="input" name="' + name + '"' + (ro ? ' disabled' : '') + '>' +
        options.map(function (o) { return '<option' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>';
    }

    $('#set-maint', d.body).addEventListener('click', function () {
      var on = p.status !== '系統維護';
      confirmDialog({
        title: on ? '設為系統維護' : '解除系統維護',
        lines: on ? ['之後所有寄出的信件都會改寄到 ' + App.user.email, '不會寄給學員'] : ['恢復正常寄信給學員'],
        okLabel: on ? '設為系統維護' : '解除'
      }).then(function (ok) {
        if (!ok) return;
        withBusy(api('setMaintenance', prefix, on)).then(function () { toast(on ? '已設為系統維護' : '已解除系統維護'); d.close(); load(); })
          .catch(function (e) { toast(e.message, true); });
      });
    });

    $('#set-refresh', d.body).addEventListener('click', function () {
      withBusy(api('refreshFormQuestions', prefix)).then(function (r) {
        var msg = r.added.length || r.removed.length ? '新增題目：' + (r.added.join('、') || '無') + '；消失題目：' + (r.removed.join('、') || '無') + '。請確認欄位對應。' : '表單題目沒有變動';
        toast(msg, !!(r.added.length || r.removed.length));
        return load().then(function () { d.close(); openSettings(); });
      }).catch(function (e) { toast(e.message, true); });
    });

    $('#set-form', d.body).addEventListener('submit', function (e) {
      e.preventDefault();
      var form = e.target;
      var patch = {};
      ['capacity', 'holdHours', 'promoteMode', 'waitOrder', 'price', 'groupPrice', 'earlyPrice', 'earlyDeadline', 'account', 'payDays', 'name', 'regStart', 'regEnd', 'start', 'end'].forEach(function (k) {
        var v = form.elements[k].value;
        if (String(v) !== String(p[k] === undefined ? '' : p[k])) patch[k] = v;
      });
      var mapping = {};
      fk.forEach(function (k) { var v = form.elements['map_' + k.key].value; if (v) mapping[k.key] = v; });
      if (JSON.stringify(mapping) !== JSON.stringify(p.mapping)) patch.mapping = mapping;
      var disp = $$('input[name=disp]:checked', form).map(function (i) { return i.value; });
      if (JSON.stringify(disp) !== JSON.stringify(p.display)) patch.display = disp;
      if (!Object.keys(patch).length) { toast('沒有變更'); return; }
      withBusy(api('updateProjectSettings', prefix, patch)).then(function (r) {
        toast('已儲存 ' + r.changed + ' 項設定' + (r.promoted ? '，自動遞補 ' + r.promoted + ' 人' : ''));
        d.close();
        load();
      }).catch(function (err) { toast(err.message, true); });
    });
  }

  /* ---------- 群發 ---------- */
  function openBulk() {
    var statuses = Object.keys(D.statuses).map(function (k) { return D.statuses[k]; }).filter(function (x) { return x !== '報名失敗'; });
    var body = el('<form style="display:flex;flex-direction:column;gap:14px" onsubmit="return false">' +
      '<div class="field"><span class="small muted">收件對象（依狀態）</span><div class="row wrap" style="gap:14px;margin-top:6px">' +
      statuses.map(function (s) { return '<label class="check"><input type="checkbox" name="st" value="' + esc(s) + '"' + (s === '程序完成' ? ' checked' : '') + '><span>' + esc(s) + '</span></label>'; }).join('') +
      '</div></div>' +
      '<label class="field"><span>通知類型</span><select class="input" name="code"><option value="PRE_CAMP">營前通知（使用範本）</option><option value="CUSTOM">特殊訊息（自訂主旨與內容）</option></select></label>' +
      '<label class="field" data-for="PRE_CAMP"><span>通知內容</span><textarea class="input" name="message" placeholder="例如：報到時間、地點、攜帶物品…"></textarea></label>' +
      '<label class="field hidden" data-for="CUSTOM"><span>主旨</span><input class="input" name="subject"></label>' +
      '<label class="field hidden" data-for="CUSTOM"><span>內容</span><textarea class="input" name="body"></textarea><span class="hint">可使用 {{姓名}}、{{營隊名稱}}、{{營期}} 等變數</span></label>' +
      '</form>');
    body.elements.code.addEventListener('change', function () {
      $$('[data-for]', body).forEach(function (x) { x.classList.toggle('hidden', x.getAttribute('data-for') !== body.elements.code.value); });
    });
    modal({
      title: '群發通知', desc: '寄出前會再顯示收件人數與信件預覽', body: body, wide: true,
      buttons: [{ label: '取消', value: null }, {
        label: '預覽', cls: 'primary', value: function () {
          return {
            statuses: $$('input[name=st]:checked', body).map(function (i) { return i.value; }),
            code: body.elements.code.value, message: body.elements.message.value,
            subject: body.elements.subject.value, body: body.elements.body.value
          };
        }
      }]
    }).then(function (opts) {
      if (!opts) return;
      withBusy(api('previewBulk', prefix, opts)).then(function (pv) {
        var extra = ['收件人 ' + pv.count + ' 人：' + pv.names.slice(0, 12).join('、') + (pv.count > 12 ? '…' : '')];
        if (!pv.enough) extra.push('注意：今日剩餘額度 ' + pv.quota + ' 封，不足以寄出全部');
        pv.summary = [];
        return mailConfirm(pv, extra).then(function (ok) {
          if (!ok) { api('cancelBulk', prefix, pv.label); return; }
          return withBusy(api('runBulk', prefix, opts)).then(function (r) {
            toast('已寄出 ' + r.sent + ' 封' + (r.failed.length ? '，失敗 ' + r.failed.length + ' 封：' + r.failed.join('、') : ''), !!r.failed.length);
            load();
          });
        });
      }).catch(function (e) { toast(e.message, true); });
    });
  }

  /* ---------- 事件 ---------- */
  $('#st-search', root).addEventListener('input', function (e) { search = e.target.value.trim().toLowerCase(); if (D) renderTable(); });
  $('#st-settings', root).addEventListener('click', function () { if (D) openSettings(); });
  $('#st-bulk', root).addEventListener('click', function () { if (D) openBulk(); });
  $('#st-export', root).addEventListener('click', function () {
    if (!D) return;
    var f = FILTERS.filter(function (x) { return x.key === filter; })[0];
    openExportDialog({
      prefix: prefix, project: D.project, groups: D.groups || {},
      filtered: sorted(D.students).filter(matches), all: sorted(D.students),
      filterLabel: (f ? f.label : '全部') + (search ? '＋搜尋「' + search + '」' : ''),
      displayCols: columns()
    });
  });
  $('#st-sync', root).addEventListener('click', function () {
    withBusy(api('syncNow', prefix)).then(function (r) {
      toast('同步完成：新增 ' + r.added + ' 筆' + (r.overdue ? '，標記逾期 ' + r.overdue + ' 筆' : '') + (r.promoted ? '，自動遞補 ' + r.promoted + ' 人' : ''));
      return load();
    }).catch(function (e) { toast(e.message, true); });
  });

  load();
});
</script>
</body>
</html>
