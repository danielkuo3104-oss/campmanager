<body>
  <main id="app">
<div class="view-students hidden">
  <div class="page-head">
    <div>
      <div class="row wrap"><h1 id="st-title">載入中</h1><span id="st-status"></span></div>
      <div class="sub" id="st-sub"></div>
    </div>
    <div class="spacer"></div>
    <div class="row wrap">
      <button class="btn" type="button" id="st-sync">同步表單</button>
      <button class="btn" type="button" id="st-bulk">群發通知</button>
      <button class="btn" type="button" id="st-export">匯出 PDF</button>
      <button class="btn desk-only" type="button" id="st-tpl">信件範本</button>
      <button class="btn desk-only" type="button" id="st-forms">預製表單</button>
      <button class="btn" type="button" id="st-portal">學員專區</button>
      <button class="btn" type="button" id="st-checkin">報到模式</button>
      <button class="btn desk-only" type="button" id="st-squad">分小隊</button>
      <button class="btn desk-only" type="button" id="st-room">分房</button>
      <button class="btn primary" type="button" id="st-settings">專案設定</button>
      <span class="sync-note" id="st-synced"></span>
    </div>
    <div class="phone-note">手機版提供瀏覽、寄信等操作與專案設定。信件範本、預製表單、分小隊、分房、顯示欄位與學員專區的區塊編輯，請用電腦操作。</div>
  </div>
  <div id="st-banner"></div>
  <div class="stats" id="st-stats"></div>
  <div class="trend-box">
    <button class="btn sm ghost" type="button" id="st-trend-toggle" aria-expanded="false" aria-controls="st-trend">報名趨勢圖</button>
    <div class="card card-pad trend-card hidden" id="st-trend"></div>
  </div>
  <div class="batch-bar hidden" id="st-batch" role="region" aria-label="批次操作"></div>
  <div class="card">
    <div class="toolbar">
      <input class="input" id="st-search" type="search" placeholder="搜尋姓名、電話、身分證…" aria-label="搜尋學員" style="max-width:260px">
      <div class="chips" id="st-chips"></div>
      <button class="chip chip-drop hidden" type="button" id="st-consent-filter" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="chip chip-drop hidden" type="button" id="st-squad-filter" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="btn sm ghost" type="button" id="st-saved" aria-haspopup="menu">常用篩選</button>
      <span class="spacer"></span>
      <div class="seg seg-sm" id="st-density" role="radiogroup" aria-label="列表檢視">
        <label><input type="radio" name="density" value=""><span>預設</span></label>
        <label><input type="radio" name="density" value="dense"><span>窄</span></label>
      </div>
      <button class="btn sm ghost desk-only" type="button" id="st-cols">顯示欄位</button>
      <span class="muted small" id="st-count"></span>
    </div>
    <div class="active-filter hidden" id="st-active" aria-live="polite"></div>
    <div class="table-wrap cards">
      <table class="list cards"><thead id="st-head"></thead><tbody id="st-body"></tbody></table>
    </div>
  </div>
</div>
<div class="loading" id="page-loading"><div class="spinner"></div>載入中</div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
<script>
App.page('students', function (root, params) {
  var prefix = params.prefix;
  var D = null;               // 伺服器回傳的專案資料
  var fset = {};              // 狀態類篩選（可複選，彼此是「或」）；空的代表全部
  var search = '';
  var squadSet = {};          // 小隊（可複選）：'0' 未分隊、'1'… 第幾隊；空的代表全部
  var selected = {};          // 勾選的學員 {學員ID: true}（批次操作）
  var shownList = [];         // 目前篩選後顯示的學員
  var consentSet = {};        // 同意書（可複選），見 CONSENT_FILTERS；空的代表全部
  /** 'a,b' → {a: true, b: true}（網址參數、常用篩選都用逗號分隔） */
  function toSet(str) {
    var o = {};
    String(str || '').split(',').forEach(function (k) { k = k.trim(); if (k && k !== 'all') o[k] = true; });
    return o;
  }
  function keysOf(o) { return Object.keys(o).filter(function (k) { return o[k]; }); }
  // 主選單的今日待辦、其他頁面的連結：直接套用對應篩選（filter、consent、squad 都可用逗號複選）
  fset = toSet(params.filter); consentSet = toSet(params.consent); squadSet = toSet(params.squad);
  var ISSUE_TAG = { id: '身分證有誤', email: '信箱有誤', phone: '電話有誤', dup: '可能重複', group: '團報超過上限', mail: '信件寄不出' };
  /** 標籤滑過時，說明之後怎麼處理（各種問題不一樣） */
  var ISSUE_HINT = { id: '報名信已提醒更正', email: '報名信已提醒更正', phone: '報名信已提醒更正', dup: '請點開比對，確認是不是同一人報名兩次', group: '超過的人沒有保留名額，請和團報聯絡人確認', mail: '請確認信箱正確後，從「操作」補寄' };
  var STROKE = (window.Intl && Intl.Collator) ? new Intl.Collator('zh-Hant-TW').compare : function (a, b) { return a < b ? -1 : a > b ? 1 : 0; };
  function hasIssue(s) { return !!(s.issues && s.issues.length) && tier(s) < 4; }
  /** 警示（統計卡、篩選、主選單待辦同一個規則）：警示狀態、待退款、報名資料有誤，且沒有取消 */
  function isWarn(s) { return tierOk(s) && (D.warningStatuses.indexOf(s.status) >= 0 || !!refundReq(s) || hasIssue(s)); }
  /** 已過期（營期結束、未封存）：仍可寄信與處理退款，只有封存後才完全唯讀 */
  function expired() { return !!D.intakeClosed || D.effective === '已過期'; }
  /** 唯讀：已停止、已封存等（舊版後端在已過期時也回傳 readOnly，這裡一律以封存才唯讀為準） */
  function RO() { return !!D.readOnly && D.effective !== '已過期'; }
  /** 已繳費的學員填了取消報名表單、還沒處理：回傳最後一筆申請（含退款帳戶），否則 null */
  function refundReq(s) {
    if (['報名取消', '報名失敗'].indexOf(s.status) >= 0) return null;
    var list = (s.forms || []).filter(function (f) { return f.kind === 'cancel' && f.refund && !f.revoked; });
    return list.length ? list[list.length - 1] : null;
  }
  function lastRefundReq(s) {
    var list = (s.forms || []).filter(function (f) { return f.kind === 'cancel' && f.refund; });
    return list.length ? list[list.length - 1] : null;
  }

  var FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'warn', label: '警示', count: isWarn },
    { key: 'todo', label: '待繳款／核對', count: function (s) { return tier(s) <= 1; } },
    { key: 'done', label: '程序完成', count: function (s) { return tier(s) === 2; } },
    { key: 'wait', label: '候補中', count: function (s) { return tier(s) === 3; } },
    { key: 'gone', label: '取消／失敗', count: function (s) { return tier(s) >= 4; } }
  ];
  var FILTER_NAMES = { pay: '待確認繳款', refund: '待退款', consent: '同意書待審', nocheckin: '未報到' };
  /** 狀態類篩選的判斷（勾多個時符合任一個就顯示） */
  var STATUS_TEST = {
    warn: function (s) { return isWarn(s); },
    todo: function (s) { return tier(s) <= 1; },
    done: function (s) { return tier(s) === 2; },
    wait: function (s) { return tier(s) === 3; },
    gone: function (s) { return tier(s) >= 4; },
    pay: function (s) { return s.status === '繳款待核覆'; },
    refund: function (s) { return refundReq(s); },
    consent: function (s) { return consentWait(s); },
    nocheckin: function (s) { return noCheckin(s); }
  };
  function statusLabel(k) {
    var f = FILTERS.filter(function (x) { return x.key === k; })[0];
    return f ? f.label : FILTER_NAMES[k] || k;
  }
  function consentLabel(k) {
    var c = CONSENT_FILTERS.filter(function (x) { return x[0] === k; })[0];
    return c ? c[1] : k;
  }
  function squadLabel(k) { return k === '0' ? '未分隊' : '第 ' + k + ' 隊'; }
  /** 目前的篩選組合，用文字說明（名單上方、匯出 PDF、存常用篩選都用這個）；沒有任何篩選時回傳 '' */
  function describeFilter(rawSearch) {
    var parts = [];
    var ks = keysOf(fset).filter(function (k) { return STATUS_TEST[k]; });
    if (ks.length) parts.push(ks.map(statusLabel).join(' 或 '));
    var cs = keysOf(consentSet);
    if (cs.length) parts.push(cs.map(consentLabel).join(' 或 '));
    var qs = keysOf(squadSet).sort(function (a, b) { return (a === '0' ? 999 : +a) - (b === '0' ? 999 : +b); });
    if (qs.length && D && D.project.squads > 0) parts.push(qs.map(squadLabel).join('、'));
    var q = rawSearch === undefined ? $('#st-search', root).value.trim() : rawSearch;
    if (q) parts.push('搜尋「' + q + '」');
    return parts.join('＋');
  }

  function load() {
    return apiFast('getProjectData', prefix, function (d, fresh) {
      D = d;
      if (fresh) hideUpdate();   // 自己重新載入過，就是最新的名單
      if (fresh && $('#menu-pop')) return;   // 操作選單開著時不重畫，資料已更新
      render();
    })
      .catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 排序：警示 → 已報名（期限近的在上）→ 程序完成 → 候補 → 取消；同層依報名時間；團報相鄰 ---------- */
  function tier(s) {
    if (refundReq(s)) return 0;   // 申請取消待退款：排最上面
    if (D.warningStatuses.indexOf(s.status) >= 0) return 0;
    if (s.status === '程序完成') return 2;
    if (D.activeStatuses.indexOf(s.status) >= 0) return 1;
    if (s.status === '候補中') return 3;
    if (s.status === '報名取消') return 4;
    return 5;
  }
  function keyOf(s) {
    var t = tier(s);
    var k2 = 0;
    if (t === 1 || t === 0) { var d = Date.parse(s.deadline); k2 = isNaN(d) ? 9e15 : d; }
    if (t === 3 && D.project.waitOrder === '人工') k2 = s.rank === '' ? 9e15 : Number(s.rank);
    return [t, k2, Date.parse(s.time) || 0];
  }
  function cmp(a, b) { for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; }

  function sorted(list) {
    var keys = {};
    list.forEach(function (s) { keys[s.id] = keyOf(s); });
    var groupKey = {};
    list.forEach(function (s) {
      if (!s.groupId || tier(s) >= 4) return;
      var k = keys[s.id];
      if (!groupKey[s.groupId] || cmp(k, groupKey[s.groupId]) < 0) groupKey[s.groupId] = k;
    });
    return list.slice().sort(function (a, b) {
      var ga = a.groupId && tier(a) < 4 ? groupKey[a.groupId] : keys[a.id];
      var gb = b.groupId && tier(b) < 4 ? groupKey[b.groupId] : keys[b.id];
      var c = cmp(ga, gb);
      if (c) return c;
      var ida = a.groupId && tier(a) < 4 ? a.groupId : a.id, idb = b.groupId && tier(b) < 4 ? b.groupId : b.id;
      if (ida !== idb) return ida < idb ? -1 : 1;
      return cmp(keys[a.id], keys[b.id]);
    });
  }

  /** 報到（checkin.html）：有效錄取但還沒正式報到的人 */
  function noCheckin(s) { return D.activeStatuses.indexOf(s.status) >= 0 && s.status !== '申請取消' && !(s.checkin && s.checkin.real); }
  function checkinPeriod() {
    if (D.students.some(function (s) { return s.checkin && s.checkin.real; })) return true;
    var st = Date.parse(D.project.start + 'T00:00:00+08:00'), en = Date.parse(D.project.end + 'T23:59:59+08:00');
    return !isNaN(st) && Date.now() >= st - 86400000 && !(Date.now() > en);
  }

  function matches(s) {
    // 同一類（狀態、同意書、小隊）之內是「或」，不同類之間是「且」
    var ks = keysOf(fset).filter(function (k) { return STATUS_TEST[k]; });
    if (ks.length && !ks.some(function (k) { return STATUS_TEST[k](s); })) return false;
    var cs = keysOf(consentSet);
    if (cs.length && cs.indexOf(consentState(s)) < 0) return false;
    var qs = keysOf(squadSet);
    if (qs.length && D.project.squads > 0 && qs.indexOf(String(s.squad === '' ? 0 : s.squad)) < 0) return false;
    if (search) {
      var hay = (s.name + ' ' + s.email + ' ' + Object.keys(s.data).map(function (k) { return s.data[k]; }).join(' ')).toLowerCase();
      if (hay.indexOf(search) < 0) return false;
    }
    return true;
  }

  /* ---------- 版面 ---------- */
  function render() {
    var p = D.project;
    $('#st-title', root).textContent = p.name;
    $('#st-status', root).innerHTML = pill(D.effective);
    var regText = p.regStart || p.regEnd ? (p.regStart ? fmtDate(p.regStart) : '不限') + ' – ' + (p.regEnd ? fmtDate(p.regEnd) : '未定') : '未設定';
    var regTag = p.regState === 'before' ? '（尚未開始）' : p.regState === 'after' ? '（已結束）' : '';
    $('#st-sub', root).textContent = p.prefix + '　·　招生 ' + regText + regTag + '　·　營期 ' + fmtDate(p.start) + ' – ' + fmtDate(p.end) + '　·　遞補：' + p.promoteMode + '　·　候補順序：' + p.waitOrder;

    var banner = $('#st-banner', root);
    banner.className = ''; banner.textContent = '';
    if (RO()) {
      banner.className = 'banner bad';
      banner.textContent = '此專案目前為「' + D.effective + '」，只能瀏覽，不能寄信或修改資料。';
    } else if (expired()) {
      banner.className = 'banner warn';
      banner.textContent = '營期已結束：仍可寄信與處理學員，封存後才完全唯讀。已不再接收新的報名，學員表單與學員專區也已關閉。';
    } else if (p.status === '系統維護') {
      banner.className = 'banner warn';
      banner.textContent = '系統維護中：所有寄出的信件會改寄到 ' + p.maintBy + '，不會寄給學員。';
    }
    $('#st-bulk', root).disabled = RO();
    $('#st-sync', root).disabled = RO() || expired();
    $('#st-sync', root).title = expired() ? '營期已結束，不再接收報名' : '';
    var ls = D.lastSync;
    $('#st-synced', root).textContent = ls && ls.t ? '上次同步 ' + fmtTime(ls.t) + (/^系統/.test(ls.by) ? '（自動）' : '') : '尚未同步';
    $('#st-synced', root).title = ls && ls.t ? '由 ' + ls.by + ' 同步' : '';

    var st = D.stats;
    var pct = st.capacity ? Math.min(100, Math.round(st.active / st.capacity * 100)) : 0;
    var rpct = st.capacity && st.reserved ? Math.min(100 - pct, Math.round(st.reserved / st.capacity * 100)) : 0;
    // 團報還沒填完的同伴先預留：顯示「已錄取 + 預留」，例如 4+2，同伴填完一位就變 5+1
    $('#st-stats', root).innerHTML =
      stat('報名人數', st.active + (st.reserved ? '<span class="plus-rsv">+' + st.reserved + '</span>' : '') + '<small>/ ' + st.capacity + '</small>',
        (st.reserved ? '團報預留 ' + st.reserved + ' 位（同伴還沒填表）　' : '') + '剩餘名額 ' + st.available, pct, rpct) +
      stat('完成度', st.completion + '<small>%</small>', '程序完成 ' + st.done + ' 人', st.completion) +
      stat('預計收入', money(st.expectedIncome) + '<small>元</small>', '已錄取者應繳合計') +
      stat('已確認繳款', money(st.confirmedIncome) + '<small>元</small>', st.refunded || st.retained ? '含取消後保留 ' + money(st.retained) + '（已退 ' + money(st.refunded) + '）' : '程序完成者合計', paidPct(st)) +
      stat('警示', D.students.filter(isWarn).length + '<small>人</small>', warnFoot(st)) +
      stat('候補中', st.waitlist + '<small>人</small>', '取消 ' + st.cancelled + '　失敗 ' + st.failed);
    $$('#st-stats .stat', root).forEach(function (card, i) {
      var kind = ['count', 'done', 'income', 'paid', 'warn', 'wait'][i];
      card.classList.add('clickable'); card.tabIndex = 0; card.setAttribute('role', 'button');
      card.title = '點開看摘要';
      card.addEventListener('click', function () { openStatDetail(kind); });
      card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStatDetail(kind); } });
    });

    var chips = $('#st-chips', root);
    chips.innerHTML = '';
    var nRefund = D.students.filter(refundReq).length;
    var nConsent = D.students.filter(consentWait).length;
    var nPay = D.students.filter(function (x) { return x.status === '繳款待核覆'; }).length;
    // 待確認繳款、待退款、同意書待審：有人才出現（已勾選的保留，才能取消）
    var extra = [];
    if (nPay || fset.pay) extra.push({ key: 'pay', label: '待確認繳款 ' + nPay });
    if (nRefund || fset.refund) extra.push({ key: 'refund', label: '待退款 ' + nRefund, bad: true });
    if (nConsent || fset.consent) extra.push({ key: 'consent', label: '同意書待審 ' + nConsent });
    var ckOn = checkinPeriod();   // 報到期間（營期前一天起，或已經有人報到）才顯示「未報到」
    if (!ckOn) delete fset.nocheckin;
    if (ckOn) extra.push({ key: 'nocheckin', label: '未報到 ' + D.students.filter(noCheckin).length });
    var noStatus = !keysOf(fset).length;
    FILTERS.concat(extra).forEach(function (f) {
      var on = f.key === 'all' ? noStatus : !!fset[f.key];
      var c = el('<button class="chip' + (f.bad ? ' chip-bad' : '') + (on ? ' on' : '') + '" type="button"></button>');
      c.textContent = f.label + (f.count ? ' ' + D.students.filter(f.count).length : '');
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.title = f.key === 'all' ? '清除狀態篩選' : '可複選：符合任一個勾選的狀態就顯示';
      c.addEventListener('click', function () {
        if (f.key === 'all') fset = {};
        else if (fset[f.key]) delete fset[f.key];
        else fset[f.key] = true;
        render();
        var again = $$('#st-chips .chip', root).filter(function (x) { return x.textContent === c.textContent; })[0];
        if (again) again.focus();
      });
      chips.appendChild(c);
    });
    if (!(p.squads > 0)) squadSet = {};
    else keysOf(squadSet).forEach(function (k) { if (Number(k) > p.squads) delete squadSet[k]; });
    // 同意書：有開線上同意書、或已經有人簽過時才出現
    var csOn = (p.forms || []).some(function (x) { return x.kind === 'consent' && x.open; }) || D.students.some(function (x) { return x.consent; });
    if (!csOn) consentSet = {};
    $('#st-consent-filter', root).classList.toggle('hidden', !csOn);
    $('#st-squad-filter', root).classList.toggle('hidden', !(p.squads > 0));
    if (!$('#st-trend', root).classList.contains('hidden')) renderTrend();
    renderTable();
  }

  /* ---------- 統計卡點開：快速摘要＋名單，可直接篩選或打開學員 ---------- */
  function openStatDetail(kind) {
    var st = D.stats, all = D.students;
    var isActive = function (s) { return D.activeStatuses.indexOf(s.status) >= 0; };
    var paidOf = function (s) { return s.paid === '' || s.paid === undefined ? (s.status === '程序完成' ? Number(s.price) || 0 : 0) : Number(s.paid) || 0; };
    var title = '', filterKey = null, rows = [], list = [], cols = null, progress = null;
    function countBy(arr, fn) { var m = {}; arr.forEach(function (s) { var k = fn(s); m[k] = (m[k] || 0) + 1; }); return m; }
    if (kind === 'count') {
      title = '報名人數';
      var by = countBy(all, function (s) { return s.status; });
      rows = [['已錄取', st.active + (st.reserved ? ' + 預留 ' + st.reserved : '') + ' / ' + st.capacity + ' 人'], ['剩餘名額', st.available + ' 人' + (st.reserved ? '（團報預留 ' + st.reserved + ' 位已扣除）' : '')]]
        .concat(Object.keys(by).map(function (k) { return [k, by[k] + ' 人']; }));
      if (D.project.squads > 0) {
        var sq = countBy(all.filter(isActive), function (s) { return s.squad === '' ? '未分隊' : '第 ' + s.squad + ' 隊'; });
        rows.push(['小隊', Object.keys(sq).sort().map(function (k) { return k + ' ' + sq[k]; }).join('、')]);
      }
      var groups = Object.keys(D.groups || {}).map(function (k) { return D.groups[k]; }).filter(function (g) { return g.expected > g.active; });
      if (groups.length) rows.push(['團報未齊', groups.map(function (g) { return (g.names || []).join('、') + '（' + g.active + '/' + g.expected + '）'; }).join('；')]);
      filterKey = 'all';
    } else if (kind === 'done') {
      title = '完成度';
      rows = [['程序完成', st.done + ' 人'], ['還沒完成', (st.active - st.done) + ' 人'], ['完成度', st.completion + '%']];
      list = all.filter(function (s) { return isActive(s) && s.status !== '程序完成'; })
        .sort(function (a, b) { return (Date.parse(a.deadline) || 9e15) - (Date.parse(b.deadline) || 9e15); });
      cols = function (s) { return [s.status, s.deadline ? '期限 ' + fmtTime(s.deadline) : '—', money(s.price) + ' 元']; };
      filterKey = 'todo';
    } else if (kind === 'income') {
      title = '預計收入';
      var types = {};
      all.filter(isActive).forEach(function (s) { var k = s.priceType || '未分類'; types[k] = types[k] || { n: 0, sum: 0 }; types[k].n++; types[k].sum += Number(s.price) || 0; });
      rows = Object.keys(types).map(function (k) { return [k, types[k].n + ' 人，' + money(types[k].sum) + ' 元']; });
      if (st.retained) rows.push(['取消後保留', money(st.retained) + ' 元']);
      rows.push(['合計', money(st.expectedIncome) + ' 元'], ['已確認', money(st.confirmedIncome) + ' 元'], ['尚未收到', money(Math.max(0, st.expectedIncome - st.confirmedIncome)) + ' 元']);
      list = all.filter(isActive);
      cols = function (s) { return [s.priceType || '—', money(s.price) + ' 元', s.status]; };
    } else if (kind === 'paid') {
      title = '已確認繳款';
      var paidList = all.filter(function (s) { return s.status === '程序完成' || (s.status === '報名取消' && paidOf(s) > 0); });
      rows = [['程序完成', st.done + ' 人'], ['已確認金額', money(st.confirmedIncome) + ' 元'], ['預計收入', money(st.expectedIncome) + ' 元'], ['尚未收到', money(Math.max(0, st.expectedIncome - st.confirmedIncome)) + ' 元']];
      progress = { label: '收款進度', pct: paidPct(st), text: '已確認 ' + money(st.confirmedIncome) + ' / 預計 ' + money(st.expectedIncome) + ' 元' };
      if (st.refunded || st.retained) rows.push(['取消後已退', money(st.refunded) + ' 元'], ['取消後保留', money(st.retained) + ' 元']);
      var diff = paidList.filter(function (s) { return s.status === '程序完成' && s.paid !== '' && Number(s.paid) !== Number(s.price); });
      if (diff.length) rows.push(['金額與應繳不同', diff.length + ' 人']);
      list = paidList;
      cols = function (s) { return [s.status, '已繳 ' + money(paidOf(s)) + ' 元', s.status === '報名取消' ? '退 ' + money(s.refund || 0) + ' 元' : (s.paid !== '' && Number(s.paid) !== Number(s.price) ? '應繳 ' + money(s.price) : '')]; };
      filterKey = 'done';
    } else if (kind === 'warn') {
      title = '警示';
      rows = [['招生期外', (st.outside || 0) + ' 人'], ['匯款逾期／異常', ((st.statusWarnings || 0) - (st.outside || 0)) + ' 人'],
        ['身分證有誤', (st.idInvalid || 0) + ' 人'], ['信箱有誤', (st.emailInvalid || 0) + ' 人'], ['電話有誤', (st.phoneInvalid || 0) + ' 人']]
        .filter(function (r) { return !/^0 /.test(r[1]); });
      if (!rows.length) rows = [['目前沒有警示', '']];
      if (D.students.filter(refundReq).length) rows.unshift(['申請取消待退款', D.students.filter(refundReq).length + ' 人']);
      list = all.filter(isWarn);
      cols = function (s) {
        var why = [];
        if (refundReq(s)) why.push('申請取消待退款');
        if (D.warningStatuses.indexOf(s.status) >= 0) why.push(s.status);
        (s.issues || []).forEach(function (x) { why.push((ISSUE_TAG[x.key] || '資料待確認') + '：' + x.value); });
        return [why.join('、')];
      };
      filterKey = 'warn';
    } else if (kind === 'wait') {
      title = '候補中';
      rows = [['候補中', st.waitlist + ' 人'], ['候補順序', D.project.waitOrder], ['遞補模式', D.project.promoteMode], ['報名取消', st.cancelled + ' 人'], ['報名失敗', st.failed + ' 人']];
      list = all.filter(function (s) { return s.status === '候補中'; }).sort(function (a, b) { return cmp(keyOf(a), keyOf(b)); });
      cols = function (s, i) { return ['第 ' + (s.rank !== '' && s.rank !== undefined ? s.rank : i + 1) + ' 位', '報名 ' + fmtTime(s.time)]; };
      filterKey = 'wait';
    }
    var body = el('<div class="stat-detail">' + (progress ? '<div class="sd-progress"><div class="row"><span class="small muted grow">' + esc(progress.label) + '</span><b>' + progress.pct + '<small>%</small></b></div>' +
      '<div class="bar"><i style="width:' + progress.pct + '%"></i></div><div class="small muted">' + esc(progress.text) + '</div></div>' : '') + '<dl class="sd-rows"></dl><div class="sd-list"></div></div>');
    rows.forEach(function (r) {
      var dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = r[0]; dd.textContent = r[1];
      $('.sd-rows', body).appendChild(dt); $('.sd-rows', body).appendChild(dd);
    });
    if (cols) {
      var box = $('.sd-list', body);
      if (!list.length) box.innerHTML = '<div class="small muted">沒有學員</div>';
      list.slice(0, 200).forEach(function (s, i) {
        var it = el('<button type="button" class="sd-item"><b></b><span class="sd-cols"></span></button>');
        $('b', it).textContent = s.name;
        $('.sd-cols', it).textContent = cols(s, i).filter(String).join('　·　');
        it.addEventListener('click', function () { if (statCtl) statCtl.close(null); openDetail(s); });
        box.appendChild(it);
      });
      if (list.length > 200) box.appendChild(el('<div class="small muted">只列出前 200 位，其餘請用名單篩選</div>'));
    }
    var buttons = [{ label: '關閉', value: null }];
    if (filterKey) buttons.push({ label: '在名單中篩選', cls: 'primary', value: filterKey });
    var statCtl = null;
    modal({ title: title, body: body, buttons: buttons, onOpen: function (ov, c) { statCtl = c; } }).then(function (v) {
      if (!v) return;
      fset = {}; if (v !== 'all') fset[v] = true;
      render();
      var t = $('#st-chips', root); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function warnFoot(st) {
    var parts = [];
    if (st.outside) parts.push('招生期外 ' + st.outside);
    var pay = (st.statusWarnings || 0) - (st.outside || 0);
    if (pay) parts.push('匯款逾期／異常 ' + pay);
    var nr = D.students.filter(refundReq).length;
    if (nr) parts.push('待退款 ' + nr);
    if (st.idInvalid) parts.push('身分證有誤 ' + st.idInvalid);
    if (st.emailInvalid) parts.push('信箱有誤 ' + st.emailInvalid);
    if (st.phoneInvalid) parts.push('電話有誤 ' + st.phoneInvalid);
    ['dup', 'group', 'mail'].forEach(function (k) {
      var n = D.students.filter(function (s) { return tierOk(s) && (s.issues || []).some(function (x) { return x.key === k; }); }).length;
      if (n) parts.push(ISSUE_TAG[k] + ' ' + n);
    });
    return parts.length ? parts.join('、') + (D.students.filter(isWarn).length < parts.length ? '（同一人可能有多項）' : '') : '招生期外、匯款逾期異常、待退款、資料有誤、可能重複';
  }

  /** 收款進度：已確認繳款佔預計收入的比例 */
  function paidPct(st) { return st.expectedIncome > 0 ? Math.min(100, Math.round(st.confirmedIncome / st.expectedIncome * 100)) : 0; }

  function stat(label, value, foot, bar, bar2) {
    return '<div class="stat"><div class="label">' + esc(label) + '</div><div class="value">' + value + '</div>' +
      (bar !== undefined ? '<div class="bar' + (bar2 ? ' split' : '') + '"><i style="width:' + bar + '%"></i>' + (bar2 ? '<i class="rsv" style="width:' + bar2 + '%"></i>' : '') + '</div>' : '') +
      '<div class="foot">' + esc(foot) + '</div></div>';
  }

  /** 名單欄位：學員姓名一律放第一欄（就算沒勾選顯示），其他依專案設定 */
  function columns() {
    var nameCol = D.project.mapping.name;
    var cols = (D.project.display || []).filter(function (t) { return t && t !== nameCol; });
    return nameCol ? [nameCol].concat(cols) : cols;
  }
  function squadText(s) { return s.squad === '' || s.squad === undefined ? '未分隊' : '第 ' + s.squad + ' 隊'; }

  function valueHtml(v) {
    var s = String(v === undefined || v === null ? '' : v);
    if (!s) return '<span class="muted">—</span>';
    var parts = s.split(/,\s*/);
    var links = parts.filter(function (x) { return /^https?:\/\//i.test(x); });
    if (links.length && links.length === parts.length) {
      return links.map(function (u, i) {
        var label = /drive\.google\.com/.test(u) ? '查看檔案' : '開啟連結';
        return '<a class="link-btn" target="_blank" rel="noopener" href="' + esc(u) + '" onclick="event.stopPropagation()">' + label + (links.length > 1 ? ' ' + (i + 1) : '') + '</a>';
      }).join('');
    }
    return esc(s);
  }

  /** 同意書、小隊兩個複選按鈕的文字，以及名單上方「目前篩選」那一行 */
  function renderFilterBits() {
    var cs = keysOf(consentSet), qs = keysOf(squadSet);
    var cb = $('#st-consent-filter', root), qb = $('#st-squad-filter', root);
    cb.textContent = '同意書：' + (cs.length ? cs.map(consentLabel).join('、') : '全部') + ' ▾';
    cb.classList.toggle('on', !!cs.length);
    cb.setAttribute('aria-label', '依同意書篩選（可複選），目前：' + (cs.length ? cs.map(consentLabel).join('、') : '全部'));
    var qsSorted = qs.slice().sort(function (a, b) { return (a === '0' ? 999 : +a) - (b === '0' ? 999 : +b); });
    qb.textContent = '小隊：' + (qs.length ? (qs.length > 2 ? qs.length + ' 個' : qsSorted.map(squadLabel).join('、')) : '全部') + ' ▾';
    qb.classList.toggle('on', !!qs.length);
    qb.setAttribute('aria-label', '依小隊篩選（可複選），目前：' + (qs.length ? qsSorted.map(squadLabel).join('、') : '全部'));
    var box = $('#st-active', root);
    var d = describeFilter();
    box.classList.toggle('hidden', !d);
    if (!d) { box.innerHTML = ''; return; }
    box.innerHTML = '<span>目前篩選：</span><b></b><button class="btn sm ghost" type="button">清除全部篩選</button>';
    $('b', box).textContent = d;
    $('button', box).addEventListener('click', clearFilters);
  }
  function clearFilters() {
    fset = {}; consentSet = {}; squadSet = {}; search = '';
    $('#st-search', root).value = '';
    render();
  }
  function openConsentMenu() {
    var live = D.students.filter(function (x) { return tier(x) < 4; });
    var items = [{ header: '同意書（可複選，符合任一個就顯示）' }];
    CONSENT_FILTERS.forEach(function (c) {
      items.push({ label: c[1] + '（' + live.filter(function (x) { return consentState(x) === c[0]; }).length + '）', checked: !!consentSet[c[0]],
        onClick: function (on) { if (on) consentSet[c[0]] = true; else delete consentSet[c[0]]; renderTable(); } });
    });
    items.push({ sep: true }, { label: '清除同意書篩選', onClick: function () { consentSet = {}; renderTable(); } });
    popMenu($('#st-consent-filter', root), items);
  }
  function openSquadMenu() {
    var n = D.project.squads || 0;
    var live = D.students.filter(function (x) { return tier(x) < 4; });
    var items = [{ header: '小隊（可複選，符合任一個就顯示）' }];
    function add(k, label, cnt) {
      items.push({ label: label + '（' + cnt + '）', checked: !!squadSet[k], onClick: function (on) { if (on) squadSet[k] = true; else delete squadSet[k]; renderTable(); } });
    }
    for (var q = 1; q <= n; q++) add(String(q), '第 ' + q + ' 隊', live.filter(function (x) { return String(x.squad) === String(q); }).length);
    add('0', '未分隊', live.filter(function (x) { return x.squad === ''; }).length);
    items.push({ sep: true }, { label: '清除小隊篩選', onClick: function () { squadSet = {}; renderTable(); } });
    popMenu($('#st-squad-filter', root), items);
  }

  function renderTable() {
    renderFilterBits();
    var cols = columns();
    var hl = D.project.highlight || {};
    var sq = D.project.squads > 0;
    $('#st-head', root).innerHTML = '<tr><th class="th-check"><input type="checkbox" id="st-all" aria-label="全選目前篩選結果"></th><th>狀態</th>' + cols.map(function (c, i) { return '<th class="' + (i === 0 ? 'th-name' : 'th-clip') + '" title="' + esc(c) + '">' + esc(c) + '</th>' + (i === 0 && sq ? '<th>小隊</th>' : ''); }).join('') + '<th>備註（狀態紀錄）</th><th><span class="sr-only">操作</span></th></tr>';
    // 團報側邊條：每組固定一種柔和的顏色（依團報代號決定），和上一組同色時換下一個
    var GROUP_COLORS = ['#a7bfa9', '#a3b6cc', '#bfa9c4', '#d4b994', '#c9a6a0', '#94bcb8', '#bab88f', '#adadcf'];
    function groupColor(id, avoid) {
      var h = 0;
      String(id).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) % 9973; });
      var i = h % GROUP_COLORS.length;
      return i === avoid ? (i + 1) % GROUP_COLORS.length : i;
    }
    var list = sorted(D.students).filter(matches);
    shownList = list;
    $('#st-count', root).textContent = '顯示 ' + list.length + ' / ' + D.students.length + ' 位';
    var allBox = $('#st-all', root);
    allBox.disabled = RO() || !list.length;
    allBox.checked = list.length > 0 && list.every(function (x) { return selected[x.id]; });
    allBox.indeterminate = !allBox.checked && list.some(function (x) { return selected[x.id]; });
    allBox.addEventListener('change', function () {
      list.forEach(function (x) { if (allBox.checked) selected[x.id] = true; else delete selected[x.id]; });
      renderTable();
    });
    renderBatchBar();
    var body = $('#st-body', root);
    body.innerHTML = '';
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="' + (cols.length + 4 + (sq ? 1 : 0)) + '"><div class="empty">' + (D.students.length ? '沒有符合條件的學員' : '還沒有報名資料') + '</div></td></tr>';
      return;
    }
    var prevGroup = null, prevColor = -1;
    list.forEach(function (s) {
      var grouped = s.groupId && tier(s) < 4;
      var tr = document.createElement('tr');
      if (tier(s) >= 4) tr.className = 'faded';
      if (grouped) {
        tr.classList.add('in-group');
        if (prevGroup !== s.groupId) { tr.classList.add('group-start'); prevColor = groupColor(s.groupId, prevColor); }
        tr.style.setProperty('--gc', GROUP_COLORS[prevColor]);
      }
      prevGroup = grouped ? s.groupId : null;

      var tags = '';
      if (grouped) {
        tags += s.groupIncomplete ? '<span class="tag group" title="團員還沒全部報名，名額先預留">團報未齊</span>' : '<span class="tag group">團報</span>';
      }
      if (/早鳥/.test(s.priceType || '') && tier(s) < 4) tags += '<span class="tag early" title="' + esc(s.priceType) + '">早鳥</span>';
      // 同一種問題（例如兩個電話都有誤）只標一次，滑過可看全部
      var issueTip = {}, issueOrder = [], issueKey = {};
      (s.issues || []).forEach(function (x) {
        var k = ISSUE_TAG[x.key] || '資料待確認';
        if (!issueTip[k]) { issueTip[k] = []; issueOrder.push(k); issueKey[k] = x.key; }
        issueTip[k].push(x.field + '「' + x.value + '」' + x.msg);
      });
      issueOrder.forEach(function (k) {
        var tail = ISSUE_HINT[issueKey[k]] ? '\n' + ISSUE_HINT[issueKey[k]] : '';
        tags += '<span class="tag bad" title="' + esc(issueTip[k].join('\n') + tail) + '">' + k + (issueTip[k].length > 1 ? ' ×' + issueTip[k].length : '') + '</span>';
      });
      if (s.status === '候補中' && s.rank !== '') tags += '<span class="tag">候補 ' + esc(s.rank) + '</span>';
      if (refundReq(s) && s.status !== '申請取消') tags += '<span class="tag bad" title="學員已繳費並申請取消，點開看退款帳戶">待退款</span>';
      if (consentWait(s)) tags += '<span class="tag warn" title="學員已簽同意書，點開直接看簽名並審核">同意書待審</span>';
      if (s.room && tierOk(s)) tags += '<span class="tag" title="房間">房 ' + esc(s.room) + '</span>';
      if (s.notes && s.notes.length) { var ln = s.notes[s.notes.length - 1]; tags += '<span class="tag note" title="' + esc('最新備註（' + fmtTime(ln.t) + ' ' + (ln.name || ln.by) + '）：' + ln.text) + '">備註 ' + s.notes.length + '</span>'; }
      var deadlineNote = (tier(s) <= 1 && s.deadline && s.status !== '申請取消') ? '<div class="small muted deadline-note" style="margin-top:4px">期限 ' + esc(fmtTime(s.deadline)) + '</div>' : '';

      var html = '<td class="cell-check"><input type="checkbox" aria-label="勾選 ' + esc(s.name) + '"' + (selected[s.id] ? ' checked' : '') + (RO() ? ' disabled' : '') + '></td>' +
        '<td class="cell-status">' + pill(s.status) + deadlineNote + '</td>';
      cols.forEach(function (c, i) {
        // 欄寬固定、過長以「…」截斷；完整內容滑過看提示，或點該列看詳細資料
        var raw = String(s.data[c] === undefined || s.data[c] === null ? '' : s.data[c]);
        var tip = /^https?:\/\//i.test(raw) ? '' : ' title="' + esc(raw) + '"';
        if (i === 0) {
          html += '<td class="cell-name"><button type="button" class="name-btn clip-1 name-strong"' + tip + ' aria-label="查看 ' + esc(s.name) + ' 的詳細資料">' + esc(s.data[c] || s.name || '(未填姓名)') + '</button>' + (tags ? '<div class="name-tags">' + tags + '</div>' : '') + '</td>';
          if (sq) html += '<td class="cell-squad">' + (s.squad === '' ? '<span class="muted">—</span>' : esc(s.squad)) + '</td>';
        }
        else html += '<td class="cell-clip' + (highlightHit(hl[c], raw) ? ' hl' : '') + '"' + tip + '>' + valueHtml(s.data[c]) + '</td>';
      });
      var last = s.history && s.history.length ? s.history[s.history.length - 1] : null;
      html += '<td class="note-cell">' + (last ? '<div class="last">' + esc(last.msg) + '</div><div class="small" style="color:var(--text-3)">' + esc(fmtTime(last.t)) + '　·　共 ' + s.history.length + ' 筆</div>' : '') + '</td>';
      html += '<td class="cell-act" style="text-align:right"><button class="btn ghost icon act-btn" type="button" aria-haspopup="menu" aria-label="操作：' + esc(s.name) + '" title="操作">⋯</button></td>';
      tr.innerHTML = html;
      if (selected[s.id]) tr.classList.add('picked');
      $('.act-btn', tr).addEventListener('click', function (e) { e.stopPropagation(); openActions(this, s); });
      var cb = $('.cell-check input', tr);
      $('.cell-check', tr).addEventListener('click', function (e) { e.stopPropagation(); if (e.target !== cb && !cb.disabled) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); } });
      cb.addEventListener('change', function () {
        if (cb.checked) selected[s.id] = true; else delete selected[s.id];
        tr.classList.toggle('picked', cb.checked);
        allBox.checked = list.every(function (x) { return selected[x.id]; });
        allBox.indeterminate = !allBox.checked && list.some(function (x) { return selected[x.id]; });
        renderBatchBar();
      });
      tr.addEventListener('click', function (e) { if (e.target.closest('a')) return; openDetail(s); });
      body.appendChild(tr);
    });
  }

  /* ---------- 學員操作選單（每位學員列最後方） ---------- */
  function has(s, list) { return list.indexOf(s.status) >= 0; }
  var ACTIVE_NOT_DONE = ['已報名', '繳款待核覆', '匯款逾期', '匯款異常'];

  function openActions(anchor, s) {
    var ro = RO();
    var items = [{ header: s.name }];
    function add(label, ok, fn, danger, mail) { items.push({ label: label, disabled: ro || !ok, onClick: fn, danger: danger, mail: mail }); }
    if (s.status === '招生期外') {
      items.push({ header: '招生期外的報名' });
      add('受理報名…', true, function () {
        ask('受理報名', [{ name: 'sendMail', label: '寄送結果通知給學員（下一步可預覽）', type: 'checkbox', value: true }], function (v) { run(s, 'accept', v); });
      }, false, 'opt');
      items.push({ sep: true });
    }
    if (s.status === '資格審核中') {
      items.push({ header: '資格審核' });
      add('審核通過，寄繳費通知…', true, function () {
        var lp = D.project.lowIncomePrice, low = lp !== '' && lp !== null && lp !== undefined ? Number(lp) : null;
        ask('審核通過', [{ name: 'amount', label: '應繳金額（元）', type: 'number', required: true, value: low === null ? s.price : low,
          hint: (low === null ? '依報名時的價格預設 ' + money(s.price) + ' 元' : '依專案設定的低收報名費預設 ' + money(low) + ' 元（報名時的價格是 ' + money(s.price) + ' 元）') + '，可以改。填 0 = 全額補助，直接改為程序完成、不寄繳費通知；其他金額的匯款期限從現在起算，下一步可預覽「審核通過與繳費通知」。' }], function (v) { run(s, 'reviewPass', v); });
      }, false, 'yes');
      add('審核未通過…', true, function () {
        ask('審核未通過', [
          { name: 'amount', label: '應繳金額（元）', type: 'number', required: true, value: s.price, hint: '預設依一般方案計算的 ' + money(s.price) + ' 元。會改為已報名並寄「審核未通過通知」，匯款期限從現在起算。' },
          { name: 'reason', label: '補充說明（選填，會寫進信裡）', type: 'textarea' }
        ], function (v) { run(s, 'reviewFail', v); });
      }, false, 'yes');
      items.push({ sep: true });
    }
    if (s.status === '候補中' && s.groupId) {
      // 這團要的名額（候補的人＋還沒填表的同伴）超過剩餘名額才算「名額不足」；名額夠就直接整團遞補，不用超收
      var gWait = D.students.filter(function (x) { return x.groupId === s.groupId && x.status === '候補中'; }).length;
      var gi0 = (D.groups || {})[s.groupId], gNeed = Math.max(gWait, gi0 ? gi0.expected - gi0.active : 0);
      var short = gNeed > D.stats.available;
      items.push({ header: short ? '團報名額不足（這團要 ' + gNeed + ' 位' + (gNeed > gWait ? '，含還沒填表 ' + (gNeed - gWait) + ' 人' : '') + '，剩 ' + D.stats.available + ' 位）' : '團報候補（名額足夠）' });
      add(short ? '超收（整團直接錄取）…' : '整團遞補錄取（' + gWait + ' 人）…', true, function () {
        ask(short ? '超收' : '整團遞補錄取', [{ name: 'sendMail', label: '寄錄取通知給這團的候補學員（下一步可預覽）', type: 'checkbox', value: true }], function (v) { run(s, 'overAdmit', v); });
      }, false, 'opt');
      if (short) add('改為個人報名…', true, function () { askIndividual(s); }, false, 'opt');
      items.push({ sep: true });
    }
    items.push({ header: '寄送通知' });
    add(s.status === '資格審核中' ? '補寄報名資訊核對' : '補寄報名與繳款通知', has(s, ACTIVE_NOT_DONE.concat(['候補中', '資格審核中'])), function () { run(s, 'resend', {}); }, false, 'yes');
    add('匯款期限鄰近通知', has(s, ['已報名', '匯款逾期']), function () { run(s, 'deadline', {}); }, false, 'yes');
    add('匯款異常通知…', has(s, ACTIVE_NOT_DONE), function () {
      ask('匯款異常通知', [{ name: 'reason', label: '異常原因', type: 'textarea', required: true, placeholder: '例如：匯款金額不足 500 元／查無後五碼', presets: P('abnormal') }], function (v) { run(s, 'abnormal', v); });
    }, false, 'yes');
    add('報名費用異動通知…', has(s, ACTIVE_NOT_DONE.concat(['候補中'])), function () {
      ask('報名費用異動通知', [
        { name: 'amount', label: '新的應繳金額（元）', type: 'number', required: true, value: s.price, hint: '目前 ' + money(s.price) + ' 元。金額只能透過此通知修改，會寫回後端並寄信。' },
        { name: 'reason', label: '異動原因', type: 'textarea', required: true, presets: P('feeChange') }
      ], function (v) { run(s, 'feeChange', v); });
    }, false, 'yes');
    add('團報同伴填表提醒', !!s.groupIncomplete && D.activeStatuses.indexOf(s.status) >= 0 && s.status !== '申請取消', function () { run(s, 'groupRemind', {}); }, false, 'yes');
    add('寄送特殊訊息…', !!s.email, function () {
      ask('寄送特殊訊息', [{ name: 'subject', label: '主旨', required: true }, { name: 'body', label: '內容', type: 'textarea', required: true, format: true, presets: P('message'), presetJoin: '\n', hint: '可用粗體、顏色、連結、按鈕與 {{姓名}} 等變數；下一步會看到預覽' }], function (v) { run(s, 'custom', v); });
    }, false, 'yes');
    items.push({ sep: true }, { header: '報名狀態' });
    add('確認繳款…', has(s, ACTIVE_NOT_DONE), function () { confirmPaidQuick(s); }, false, 'yes');
    add('標記繳款待核覆', has(s, ['已報名', '匯款逾期', '匯款異常']), function () { run(s, 'markPending', {}); });
    add('遞補錄取', s.status === '候補中', function () { run(s, 'promote', {}); }, false, 'yes');
    add('調整候補順位…', s.status === '候補中', function () {
      ask('調整候補順位', [{ name: 'rank', label: '新的順位', type: 'number', required: true, value: s.rank }], function (v) { run(s, 'setRank', v); });
    });
    add('調整團報歸屬…', tierOk(s), function () { askGroup(s); });
    add('手動綁組…', tierOk(s), function () { askBind(s); });
    if (s.groupId && D.activeStatuses.indexOf(s.status) >= 0 && s.status !== '程序完成') add('改為個人報名（重算價格）…', true, function () { askIndividual(s); }, false, 'opt');
    if (D.project.squads > 0) add('調整小隊…', tierOk(s), function () {
      var opts = [{ value: '', label: '未分隊' }];
      for (var q = 1; q <= D.project.squads; q++) opts.push({ value: String(q), label: '第 ' + q + ' 隊' });
      ask('調整小隊', [{ name: 'squad', label: s.name + '　目前：' + squadText(s), type: 'select', options: opts, value: s.squad === '' ? '' : String(s.squad) }], function (v) {
        var a = {}; a[s.id] = v.squad;
        withBusy(api('setSquads', prefix, a)).then(function () { toast('已調整小隊'); return load().then(function () { refreshDetail(s.id); }); }).catch(function (e) { toast(e.message, true); });
      });
    });
    var rmList = (D.project.rooms && D.project.rooms.rooms) || [];
    if (rmList.length) add('調整房間…', tierOk(s), function () {
      var opts = [{ value: '', label: '未分房' }].concat(rmList.map(function (x) {
        var n = D.students.filter(function (y) { return y.room === x.no && tierOk(y); }).length;
        return { value: x.no, label: x.no + (x.label ? ' ' + x.label : '') + '（' + n + (x.beds ? '/' + x.beds : '') + ' 人）' };
      }));
      ask('調整房間', [{ name: 'room', label: s.name + '　目前：' + (s.room || '未分房'), type: 'select', options: opts, value: s.room || '' }], function (v) {
        var a = {}; a[s.id] = v.room;
        withBusy(api('setRooms', prefix, a)).then(function () { toast('已調整房間'); return load().then(function () { refreshDetail(s.id); }); }).catch(function (e) { toast(e.message, true); });
      });
    });
    add('手動變更狀態…', true, function () {
      var opts = Object.keys(D.statuses).map(function (k) { return D.statuses[k]; }).filter(function (x) { return x !== s.status; });
      ask('手動變更狀態', statusFields(opts), function (v) { run(s, 'setStatus', v); }, false, statusMore);
    });
    items.push({ sep: true });
    // 有未處理的退款申請（學員已繳費並填了取消表單）：不論目前狀態，都可以處理退款或撤銷申請
    var hasReq = s.status === '申請取消' || !!refundReq(s);
    if (hasReq) add('撤銷取消申請…', true, function () { revertCancel(s); });
    add(hasReq ? '處理退款並取消報名…' : '取消報名…', !has(s, ['報名取消', '報名失敗']), function () { cancelDialog(s); }, true, 'opt');
    add('完整刪除（測試資料）…', true, function () {
      formDialog({ title: '完整刪除 ' + s.name + '？', danger: true, okLabel: '永久刪除',
        desc: '只用在自己測試的資料。會刪掉名單上這一列（含備註、狀態紀錄）和 Google 表單上的那筆回覆，之後同步也不會再出現，無法復原。真的學員要取消請用「取消報名」。',
        fields: [{ name: 'name', label: '請輸入學員姓名「' + s.name + '」確認', required: true }],
        check: function (v) { return v.name.trim() === s.name ? '' : { name: 'name', msg: '姓名不符' }; } }).then(function (v) {
        if (!v) return;
        withBusy(api('deleteStudentData', prefix, s.id, v.name.trim())).then(function (r) { toast(r.message); closeDetail(); return load(); }).catch(function (e) { toast(e.message, true); });
      });
    }, true);
    popMenu(anchor, items);
  }

  function P(key) { return D.presets && D.presets[key] || []; }

  /** 依退款規定，今天取消可退幾 %；沒設定時間段時回傳 null（與後端 refundPct_ 相同） */
  function refundPctToday() {
    var tiers = (D.project.refund && D.project.refund.tiers) || [];
    if (!tiers.length) return null;
    var d = new Date(), day = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    for (var i = 0; i < tiers.length; i++) if (day <= tiers[i].until) return tiers[i].pct;
    return 0;
  }

  /**
   * 取消報名視窗。已繳費的人多一個「退款計算」：原繳費金額扣掉無法退回金額（依規定）、郵匯費與自行增添的項目，
   * 即時算出實際退款金額；信件「取消報名退款通知」會列出這份明細（0 元的項目不列）。
   * 學員申請過取消時，原因與退款規定估算的金額先帶入。
   */
  function cancelDialog(s) {
    var paidAmt = s.paid !== '' && Number(s.paid) > 0 ? Number(s.paid) : 0, req = refundReq(s), isReq = s.status === '申請取消';
    if (!paidAmt && !isReq) {
      ask('取消報名', [{ name: 'reason', label: '取消原因', type: 'textarea', required: true, presets: P('cancel') },
        { name: 'info', type: 'note', html: '此學員尚未確認繳款，不需退款，取消後只從預計收入扣除。' },
        { name: 'sendMail', label: '寄送「取消報名通知」給學員', type: 'checkbox', value: true }], function (v) { run(s, 'cancel', v); }, true);
      return;
    }
    var base = paidAmt || Number(s.price) || 0;
    var reqPct = !!(req && req.refund && req.refund.pct !== '' && req.refund.pct !== null && req.refund.pct !== undefined);
    var pct = reqPct ? Number(req.refund.pct) : refundPctToday();
    function ruleCut(b) { return pct === null ? 0 : b - Math.round(b * pct / 100); }
    var body = el('<form class="rc-dlg" onsubmit="return false">' +
      '<div class="field"><span>取消原因<em>*</em></span><textarea class="input" name="reason" rows="2"></textarea></div>' +
      '<div class="rc-calc"><div class="rc-title">退款計算</div>' +
        '<div class="rc-row"><span class="rc-l">原繳費金額</span><span class="rc-op"></span><input class="input rc-n" name="paid" type="number" min="0" step="1"><span class="rc-u">元</span></div>' +
        '<div class="rc-items"></div>' +
        '<button class="btn sm ghost rc-add" type="button">＋ 新增扣除項目</button>' +
        '<div class="rc-row rc-total"><span class="rc-l">實際退款金額</span><span class="rc-op">＝</span><b class="rc-sum"></b><span class="rc-u">元</span></div>' +
        '<div class="small muted rc-hint"></div>' +
      '</div>' +
      '<label class="check"><input type="checkbox" name="sendMail" checked><span>寄送「取消報名退款通知」給學員（附上這份退款明細，0 元的項目不列）</span></label>' +
      '<div class="small rc-err" style="color:var(--bad);min-height:16px"></div></form>');
    var ta = body.elements.reason, paidIn = body.elements.paid, list = $('.rc-items', body);
    ta.value = req ? '學員申請取消：' + (req.reason || '') : '';
    ta.parentNode.appendChild(presetChips(ta, P('cancel')));
    paidIn.value = base;
    paidIn.readOnly = !!paidAmt;   // 已確認繳款的金額不能在這裡改；申請取消時只回報了匯款，填實際收到的金額
    var labels = P('refundItem');
    function addRow(label, amount, fixed) {
      var row = el('<div class="rc-row rc-item"><span class="rc-l"></span><span class="rc-op">−</span><input class="input rc-n" type="number" min="0" step="1"><span class="rc-u">元</span></div>');
      if (fixed) { $('.rc-l', row).textContent = label; row.setAttribute('data-label', label); }
      else {
        var li = el('<input class="input rc-name" type="text" maxlength="40" placeholder="項目名稱" list="rc-presets">');
        li.value = label || '';
        $('.rc-l', row).appendChild(li);
        var x = el('<button class="btn sm ghost rc-del" type="button" title="刪除這一項" aria-label="刪除這一項">✕</button>');
        x.addEventListener('click', function () { row.remove(); sum(); });
        row.appendChild(x);
      }
      $('.rc-n', row).value = amount || 0;
      list.appendChild(row);
      return row;
    }
    body.appendChild(el('<datalist id="rc-presets">' + labels.map(function (t) { return '<option value="' + esc(t) + '">'; }).join('') + '</datalist>'));
    var ruleRow = addRow('無法退回金額（依規定）', ruleCut(base), true);
    addRow('郵匯費（手續費）', D.project.refundFee || 0, true);
    $('.rc-add', body).addEventListener('click', function () { $('.rc-name', addRow('', 0, false)).focus(); });
    function items() {
      return $$('.rc-item', body).map(function (r) {
        return { label: r.getAttribute('data-label') || ($('.rc-name', r) ? $('.rc-name', r).value.trim() : ''), amount: $('.rc-n', r).value };
      });
    }
    function sum() {
      var b = Number(paidIn.value) || 0, cut = items().reduce(function (a, it) { return a + (Number(it.amount) || 0); }, 0), left = b - cut;
      $('.rc-sum', body).textContent = money(left);
      $('.rc-total', body).classList.toggle('bad', left < 0);
      return left;
    }
    paidIn.addEventListener('input', function () { $('.rc-n', ruleRow).value = ruleCut(Number(paidIn.value) || 0); sum(); });
    body.addEventListener('input', sum);
    $('.rc-hint', body).textContent = (paidAmt ? '已確認繳款 ' + money(paidAmt) + ' 元。' : '還沒確認繳款，請填實際收到的金額。') +
      (pct === null ? '這個專案沒有設定退款規定，「無法退回金額」請自行填寫。' : '依退款規定' + (reqPct ? '（學員申請當天）' : '（今天取消）') + '可退 ' + pct + '%，已先算好「無法退回金額」，可以再改。') +
      '只有「無法退回金額（依規定）」計入收入，郵匯費與其他扣除項目不算收入。' + (req ? '學員申請時已經寄過「取消報名通知」。' : '');
    sum();
    modal({ title: isReq || req ? '處理退款並取消報名' : '取消報名', desc: s.name + (req ? '　退款帳戶：' + req.refund.bank + ' ' + (req.refund.branch || '') + '，戶名 ' + req.refund.name + '，帳號 ' + req.refund.no : ''), body: body, wide: true,
      buttons: [{ label: '取消', value: null }, { label: '下一步', cls: 'danger', validate: function () {
        var err = $('.rc-err', body);
        if (!ta.value.trim()) { err.textContent = '請填寫「取消原因」'; return false; }
        if (!(Number(paidIn.value) >= 0) || paidIn.value === '') { err.textContent = '請填正確的原繳費金額'; return false; }
        var bad = items().filter(function (it) { return Number(it.amount) > 0 && !it.label; });
        if (bad.length) { err.textContent = '有金額的扣除項目請填名稱'; return false; }
        if (items().some(function (it) { return it.amount !== '' && !(Number(it.amount) >= 0); })) { err.textContent = '扣除金額請填 0 以上的數字'; return false; }
        if (sum() < 0) { err.textContent = '扣除的金額超過原繳費金額'; return false; }
        return true;
      }, value: function () {
        return { reason: ta.value.trim(), paidAmount: paidAmt ? '' : paidIn.value, items: items().filter(function (it) { return Number(it.amount) > 0; }), sendMail: body.elements.sendMail.checked };
      } }]
    }).then(function (v) { if (v) run(s, 'cancel', v); });
  }

  function revertCancel(s) {
    ask('撤銷取消申請', [{ name: 'info', type: 'note', html: '學員改變心意、決定繼續參加時使用：狀態會改回申請取消之前的狀態，報名繼續有效。不會寄信，需要通知學員請用「寄送特殊訊息」。' },
      { name: 'reason', label: '說明（記在狀態紀錄）', type: 'textarea' }], function (v) { run(s, 'cancelRevert', v); });
  }

  /** 專案設定裡的預製表單：開關、連結、改內容／跟著系統預設；每個動作直接存 */
  function renderFormSettings(box) {
    var ro = RO(), list = D.project.forms || [];
    function saveForms(mut, msg) {
      var out = {};
      list.forEach(function (f) {
        var o = {};
        if (f.kind === 'consent') { if (f.open) o.on = true; if (f.mode && f.mode !== 'online') o.mode = f.mode; if (f.keepMonths !== undefined && f.keepMonths !== 12) o.keepMonths = f.keepMonths; }
        else if (!f.open) o.off = true;
        (f.fields || ['title', 'intro', 'done', 'button']).forEach(function (k) { if (f[k + 'Own']) o[k] = f[k]; });
        out[f.kind] = o;
      });
      mut(out);
      withBusy(api('updateProjectSettings', prefix, { forms: out })).then(function () { toast(msg); cacheClear(); return load().then(function () { if ($('.pf-list')) renderFormSettings($('.pf-list')); }); }).catch(function (e) { toast(e.message, true); });
    }
    box.innerHTML = '';
    if (!D.project.siteUrl) box.appendChild(el('<div class="small" style="color:var(--warn);margin-bottom:8px">還沒記錄網站網址：總管登入一次就會自動記下，之後信裡才會出現表單按鈕。</div>'));
    list.forEach(function (f) {
      var flds = f.fields || ['title', 'intro', 'done', 'button'];
      var own = flds.some(function (k) { return f[k + 'Own']; });
      var row = el('<div class="pf-set"><label class="check"><input type="checkbox"' + (f.open ? ' checked' : '') + (ro ? ' disabled' : '') + '><span><b></b></span></label>' +
        '<span class="small muted grow pf-state"></span>' +
        (f.url ? '<button class="btn sm ghost" type="button" data-a="copy">複製連結</button><a class="btn sm ghost" target="_blank" rel="noopener" data-a="open">打開</a>' : '') +
        (ro ? '' : (own ? '<button class="btn sm ghost" type="button" data-a="reset">跟著系統預設</button>' : '') + '<button class="btn sm" type="button" data-a="edit">編輯內容</button>') + '</div>');
      $('b', row).textContent = f.name;
      $('.pf-state', row).textContent = (f.open ? '開放中' : '已關閉') + '・' + (own ? '這個專案自訂' : '跟著系統預設');
      if ($('[data-a=open]', row)) $('[data-a=open]', row).href = f.url;
      if ($('[data-a=copy]', row)) $('[data-a=copy]', row).addEventListener('click', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(f.url) : Promise.reject()).then(function () { toast('已複製表單連結'); }).catch(function () { prompt('表單連結', f.url); });
      });
      $('input', row).addEventListener('change', function (e) {
        var on = e.target.checked;
        saveForms(function (out) {
          if (f.kind === 'consent') { if (on) out[f.kind].on = true; else delete out[f.kind].on; }
          else if (on) delete out[f.kind].off; else out[f.kind].off = true;
        }, on ? '已開放「' + f.name + '」' : '已關閉「' + f.name + '」，信裡的按鈕也不會出現');
      });

  /** 各小隊的專輔、隨輔：預設每隊 2 位專輔、2 位隨輔，可增減；聯絡方式選填 */
  function openSquadStaff() {
    var n = D.project.squads || 0, ro = RO();
    if (!(n > 0)) { toast('請先在專案設定填小隊數', true); return; }
    function fmtMobile(v) {   // 與後端 fmtMobile_ 相同：手機號碼寫成 0900-000-000
      v = String(v || '').trim();
      var d = v.replace(/[\s\-－–()（）.]/g, '');
      if (/^\+?8869\d{8}$/.test(d)) d = '0' + d.replace(/^\+?886/, '');
      return /^09\d{8}$/.test(d) ? d.slice(0, 4) + '-' + d.slice(4, 7) + '-' + d.slice(7) : v;
    }
    var st = D.project.squadStaff || { show: true, squads: {} };
    var body = el('<div class="ss-dlg"><label class="check"><input type="checkbox" name="ssShow"' + (st.show !== false ? ' checked' : '') + (ro ? ' disabled' : '') + '><span>在學員專區公布學員自己的小隊與專輔、隨輔</span></label><div class="ss-list"></div></div>');
    function row(x) {

        '<input class="input" placeholder="姓名" maxlength="40" aria-label="姓名"><input class="input" placeholder="聯絡方式（選填，例如 0900-000-000）" maxlength="100" aria-label="聯絡方式">' +
        (ro ? '' : '<button class="btn sm ghost" type="button" aria-label="刪除">刪除</button>') + '</div>');
      $('select', r).value = x.role; $$('input', r)[0].value = x.name || ''; $$('input', r)[1].value = x.contact || '';
      $$('select,input', r).forEach(function (i) { i.disabled = ro; });
      if (!ro) $('button', r).addEventListener('click', function () { r.remove(); });

    for (var i = 1; i <= n; i++) {
      var have = st.squads && st.squads[String(i)];

      var box = el('<div class="ss-squad" data-q="' + i + '"><div class="row"><b class="grow">第 ' + i + ' 小隊</b>' +
        (ro ? '' : '<button class="btn sm ghost" type="button" data-add="專輔">＋ 專輔</button><button class="btn sm ghost" type="button" data-add="隨輔">＋ 隨輔</button>') + '</div><div class="ss-rows"></div></div>');

      $('.ss-list', body).appendChild(box);

    modal({ title: '小隊專輔與隨輔', desc: '姓名必填、聯絡方式選填；沒填姓名的空白列不會儲存。', body: body, wide: true,
      buttons: ro ? [{ label: '關閉', value: null }] : [{ label: '取消', value: null }, {

          if (bad) { fieldError($$('input', bad)[0], '有填聯絡方式的列請填姓名'); return false; }
          return true;

  /** 學員專區網址的 QR Code：可下載成圖片放在 IG、海報；QR 程式用到時才載入 */
  function showPortalQr(url) {
    function draw() {
      var box = el('<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><div class="qr-box" style="background:#fff;padding:16px;border-radius:12px"></div>' +
        '<div class="small muted" style="word-break:break-all;text-align:center"></div><a class="btn primary" download="學員專區QR.png">下載圖片</a></div>');
      $('.small', box).textContent = url;
      new QRCode($('.qr-box', box), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
      setTimeout(function () {
        var c = $('.qr-box canvas', box), img = $('.qr-box img', box);
        if (!c) { $('a', box).href = img ? img.src : '#'; return; }
        // 下載的圖片四周留白，掃描比較穩定
        var pad = 24, out = document.createElement('canvas');
        out.width = c.width + pad * 2; out.height = c.height + pad * 2;
        var g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(c, pad, pad);
        $('a', box).href = out.toDataURL('image/png');
      }, 100);
      modal({ title: '學員專區 QR Code', desc: '掃描後直接打開這個專案的學員專區；換新網址後要重新下載。', body: box, buttons: [{ label: '關閉', value: null }] });
    }
    if (window.QRCode) { draw(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = draw;
    sc.onerror = function () { toast('QR Code 程式載入失敗，請檢查網路後再試', true); };
    document.head.appendChild(sc);
  }

  /** 批次確認繳款的對帳：一行列出最新回報的後五碼、金額、匯款日（沒有回報就用報名表填的後五碼） */

    onOpen: function (ov) {

  /**

   * 逐一勾選要不要套用、要不要寄「報名費用異動通知」。已確認繳款、自訂金額的人不會自動改。

    return withBusy(api('previewPriceReview', prefix)).then(function (r) {
      if (!r.items.length) { if (r.paid.length) toast('價格已更新；有 ' + r.paid.length + ' 位已確認繳款的學員金額不同，請視需要個別處理'); return; }

      function sync() {
        var rows = $$('.pr-row', body), a = 0, m = 0;

  /** 依報名時間算團報的價格（跟後端 computePrice_ 一樣取最低價；早鳥期限內含早鳥價、早鳥團報價）；沒有團報價時回傳 null */
  function groupPriceFor(s) {
    var p = D.project;
    if (!(p.groupPrice > 0) && !(p.earlyGroupPrice > 0)) return null;
    var t = s.time ? new Date(s.time) : new Date();
    var early = p.earlyDeadline && t <= new Date(String(p.earlyDeadline).slice(0, 10) + 'T23:59:59+08:00');
    var opts = [{ type: '原價', price: Number(p.price) }];
    if (p.groupPrice > 0) opts.push({ type: '團報價', price: Number(p.groupPrice) });
    if (early && p.earlyPrice > 0) opts.push({ type: '早鳥價', price: Number(p.earlyPrice) });
    if (early && p.earlyGroupPrice > 0) opts.push({ type: '早鳥團報價', price: Number(p.earlyGroupPrice) });
    opts.sort(function (a, b) { return a.price - b.price; });
    return opts[0];
  }

  /** 改為個人報名：價格依報名時間、團報價或自訂；候補中的人沒有空位時可以超收 */
  function askIndividual(s) {
    var p = D.project;
    var opts = [{ value: 'auto', label: '依報名時間（早鳥價或原價，系統自動判斷）' }];
    var gp = groupPriceFor(s);
    if (gp) opts.push({ value: 'group', label: '維持' + gp.type + ' ' + money(gp.price) + ' 元' });
    opts.push({ value: 'manual', label: '自訂金額' });
    var fields = [
      { name: 'priceMode', label: '價格', type: 'select', options: opts, value: 'auto' },
      { name: 'amount', label: '自訂金額（元）', type: 'number', value: s.price, hint: '選「自訂金額」時才會用到。下一步會顯示算出來的金額再確認。' }
    ];
    // 有空位就直接錄取；沒空位時才出現超收選項
    if (s.status === '候補中' && D.stats.available < 1) fields.push({ name: 'over', label: '沒有空位也錄取（超收）', type: 'checkbox', value: false });
    fields.push({ name: 'sendMail', label: s.status === '候補中' ? '寄報名成功通知（下一步可預覽）' : '金額有變時寄「報名費用異動通知」', type: 'checkbox', value: true });
    ask('改為個人報名：' + s.name, fields, function (v) { run(s, 'toIndividual', v); });
  }

  /** 手動綁組：模糊比對也對不到時（例如名字寫錯太多），一次勾選好幾位併成同一團 */
  function askBind(s) {
    var mates = s.groupId ? D.students.filter(function (x) { return x.groupId === s.groupId && x.id !== s.id && tierOk(x); }).map(function (x) { return x.name; }) : [];
    var opts = D.students.filter(function (x) { return x.id !== s.id && tierOk(x) && (!s.groupId || x.groupId !== s.groupId); })
      .map(function (x) { return { value: x.id, label: x.name, sub: x.status + (x.groupId ? '・已在其他團' : '') + (x.partners && x.partners.length ? '・寫的同伴：' + x.partners.join('、') : '') }; });
    ask('手動綁組：' + s.name, [{ name: 'withIds', label: '勾選要和 ' + s.name + ' 同一團的人', type: 'checklist', options: opts, required: true,
      hint: (mates.length ? '目前同團：' + mates.join('、') + '。' : '') + (s.partners && s.partners.length ? s.name + ' 寫的同伴：' + s.partners.join('、') + '。' : '') + '勾選的人會併進這一團；已在其他團的人會移過來。' }],
      function (v) { run(s, 'setGroup', v); });
  }

  function askGroup(s) {

      .map(function (x) { return { value: x.id, label: x.name + '（' + x.status + '）' }; });
    var opts = [{ value: '', label: s.groupId ? '移出團報，改為個人報名' : '（請選擇）' }].concat(others);
    ask('調整團報歸屬', [{ name: 'withId', label: '與誰同一團', type: 'select', options: opts }], function (v) { run(s, 'setGroup', v); });
  }

  /** 兩段式：先預覽 → 確認視窗 → 執行；取消也留紀錄 */
  function run(s, action, extra) {
    withBusy(api('previewAction', prefix, s.id, action, extra)).then(function (pv) {
      return mailConfirm(pv).then(function (ok) {
        if (!ok) { api('cancelAction', prefix, s.id, action).catch(function () {}); return; }
        return withBusy(api('runAction', prefix, s.id, action, extra)).then(function (r) {
          afterAction(s, r, pv.label);
        });
      });
    }).catch(function (e) { toast(e.message, true); });
  }
  /** 操作完成：重新載入名單；學員詳細資料開著就留在同一位學員並更新內容 */
  function afterAction(s, r, label) {
    if (r.note) toast(r.note, true); else toast('已完成：' + label);
    if (r.promoted && r.promoted.length) toast('已自動遞補：' + r.promoted.join('、'));
    return load().then(function () { refreshDetail(s.id); });
  }
  /** 詳細資料開著的是這位學員：用最新資料重畫 */
  function refreshDetail(id) {
    if (!detail || detailId !== id || !D) return;
    var fresh = D.students.filter(function (x) { return x.id === id; })[0];
    if (fresh) openDetail(fresh); else closeDetail();
  }

  /**
   * 確認繳款（兩步）：選單點「確認繳款…」→ 這個視窗核對金額、看信件預覽，按「確認繳款並寄出」就完成。
   * 金額與應繳不同時後端會擋下，錯誤顯示在視窗內。
   */
  function confirmPaidQuick(s) {
    withBusy(api('previewAction', prefix, s.id, 'confirmPaid', { amount: s.price })).then(function (pv) {
      var m = pv.mail;
      var body = el('<form class="cp-dlg" onsubmit="return false"><div class="dlg-note">' + payCheckHtml(s) + '</div>' +
        '<label class="field"><span>核對到的匯款金額（元）<em>*</em></span><input class="input" name="amount" type="number" step="any"><span class="hint">應繳 ' + money(s.price) + ' 元；金額一致才會標為程序完成並寄出確認信。不一致請改用「匯款異常通知」或「報名費用異動通知」。</span></label>' +
        (m ? '<dl class="kv"><dt>收件人</dt><dd></dd><dt>主旨</dt><dd></dd><dt>今日剩餘額度</dt><dd></dd></dl>' +
          (m.redirectedFrom ? '<div class="redirect-note">此專案為「系統維護」模式，信件會改寄到設定維護的管理員信箱。</div>' : '') +
          '<details class="cp-preview"><summary>信件預覽「' + esc(m.templateName) + '」</summary><iframe class="mail-frame" sandbox="" title="信件預覽"></iframe></details>' : '') + '</form>');
      body.elements.amount.value = s.price;
      if (m) {
        var dds = $$('dd', body); dds[0].textContent = m.to; dds[1].textContent = m.subject; dds[2].textContent = pv.quota + ' 封';
        $('iframe', body).srcdoc = m.html;
      }
      return modal({
        title: '確認繳款：' + s.name, body: body, wide: true,
        buttons: [{ label: '取消', value: null }, {
          label: m ? '確認繳款並寄出' : '確認繳款', cls: 'primary',
          validate: function () {
            clearFieldErrors(body);
            var v = body.elements.amount.value;
            if (v === '' || isNaN(Number(v))) { fieldError(body.elements.amount, '請填核對到的匯款金額'); return false; }
            if (Number(v) !== Number(s.price)) { fieldError(body.elements.amount, '金額 ' + money(v) + ' 與應繳 ' + money(s.price) + ' 元不符，請改用「匯款異常通知」或「報名費用異動通知」'); return false; }
            return true;
          },
          value: function () { return { amount: body.elements.amount.value }; },
          run: function (v) { return api('runAction', prefix, s.id, 'confirmPaid', v); }
        }]
      }).then(function (r) {
        if (!r) { api('cancelAction', prefix, s.id, 'confirmPaid').catch(function () {}); return; }
        return afterAction(s, r, '確認繳款');
      });
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 學員詳細資料 ---------- */
  var detail = null, detailId = null, detailS = null;
  function closeDetail() { if (detail) { detail.close(); detail = null; detailId = null; } }

  /** 同意書的簽名圖片、上傳檔案、簽署紀錄：從雲端硬碟讀回來顯示（查看會記錄在操作紀錄） */
  function showConsentFile(s, f) {
    withBusy(api('getConsentFile', prefix, s.id, f.id)).then(function (r) {
      var bin = atob(r.data), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
      var inner = /^image\//.test(r.mime) ? '<img class="consent-img" alt="">'
        : r.mime === 'application/pdf' ? '<iframe class="consent-pdf" title="同意書 PDF"></iframe>'
        : '<pre class="consent-txt"></pre>';
      var body = el('<div class="consent-view">' + inner + '<a class="btn sm" download>下載檔案</a></div>');
      var a = $('a', body); a.href = url; a.download = r.name;
      if ($('img', body)) $('img', body).src = url;
      if ($('iframe', body)) $('iframe', body).src = url;
      if ($('pre', body)) $('pre', body).textContent = new TextDecoder('utf-8').decode(arr);
      modal({ title: f.label || f.name, desc: s.name + '　' + r.name, body: body, wide: true, buttons: [{ label: '關閉', value: null }] }).then(function () { URL.revokeObjectURL(url); });
    }).catch(function (e) { toast(e.message, true); });
  }

  function consentOpen() { return (D.project.forms || []).some(function (f) { return f.kind === 'consent' && f.open; }); }
  function consentWait(s) { return !!(s.consent && !s.consent.review); }
  var CONSENT_FILTERS = [['none', '同意書未簽'], ['wait', '同意書待審'], ['redo', '退回重簽'], ['ok', '同意書已通過']];
  /** 同意書狀態：none 未簽、wait 已簽待審、redo 審核不通過等重簽、ok 審核通過 */
  function consentState(s) {
    var c = s.consent;
    if (!c) return 'none';
    if (!c.review) return 'wait';
    return c.review.ok ? 'ok' : 'redo';
  }

  /** 待審核的同意書直接攤開：簽名圖片與上傳的照片直接顯示，PDF 與簽署紀錄點按鈕看 */
  function showConsentInline(s, box) {
    (s.consent.files || []).forEach(function (f, i) {
      var item = el('<figure class="consent-fig"><figcaption></figcaption><div class="consent-ph small muted">載入中…</div></figure>');
      $('figcaption', item).textContent = f.label || f.name;
      box.appendChild(item);
      if (!/^image\//.test(f.mime)) {
        var b = el('<button class="btn sm ghost" type="button">' + (f.mime === 'application/pdf' ? '打開 PDF' : '看簽署紀錄（同意書全文）') + '</button>');
        b.addEventListener('click', function () { showConsentFile(s, f); });
        $('.consent-ph', item).replaceWith(b);
        item.removeChild($('figcaption', item));
        return;
      }
      api('getConsentFile', prefix, s.id, f.id).then(function (r) {
        var im = new Image();
        im.className = 'consent-img'; im.alt = f.label || f.name;
        im.onerror = function () { $('.consent-ph', item) && ($('.consent-ph', item).textContent = '圖片無法顯示，請按下方「查看」下載檢查'); };
        im.onload = function () { var ph = $('.consent-ph', item); if (ph) ph.replaceWith(im); };
        im.addEventListener('click', function () { showConsentFile(s, f); });
        im.src = 'data:' + r.mime + ';base64,' + r.data;
      }).catch(function (e) { var ph = $('.consent-ph', item); if (ph) ph.textContent = e.message; });
    });
  }

  /** 審核通過：一鍵完成，不寄信，區塊收起來 */
  function consentPass(s) {
    withBusy(api('runAction', prefix, s.id, 'consentPass', {})).then(function () {
      toast('同意書審核通過');
      var rv = { ok: true, t: new Date().toISOString(), by: '你', reason: '' };
      s.consent.review = rv; openDetail(s);   // 先在畫面上收起來，再背景更新名單
      return load().then(function () {
        var n = D.students.filter(function (x) { return x.id === s.id; })[0];
        if (n && n.consent && !n.consent.review) n.consent.review = rv;
        if (detail && n) openDetail(n);
      });
    }).catch(function (e) { toast(e.message, true); });
  }
  /** 不通過：填原因 → 預覽「同意書重簽通知」→ 寄出 */
  function consentRedo(s) {
    ask('同意書不通過：' + s.name, [{ name: 'reason', label: '要重簽的原因（會寫在信裡）', type: 'textarea', required: true, presets: P('consentRedo') }], function (v) { run(s, 'consentRedo', v); });
  }

  function openDetail(s) {
    var p = D.project;
    detailS = s;
    if (detail && detailId === s.id) {
      // 同一位學員：沿用抽屜、更新內容（操作完成後不關閉，捲動位置也保留）
      detail.setTitle(s.name || '(未填姓名)', pill(s.status) + '　' + esc(s.email));
    } else {
      closeDetail();
      detail = drawer({ title: s.name || '(未填姓名)', sub: pill(s.status) + '　' + esc(s.email), guard: false, dirty: function () { var ta = detail && $('.note-add textarea', detail.body); return !!(ta && ta.value.trim()); }, onClose: function () { detail = null; detailId = null; } });
      detailId = s.id;
      var head = $('.drawer-head', detail.el);
      var payBtn = el('<button class="btn sm primary hidden" type="button" data-pay>確認繳款…</button>');
      payBtn.addEventListener('click', function (e) { e.stopPropagation(); confirmPaidQuick(detailS); });
      head.insertBefore(payBtn, head.lastElementChild);
      var actBtn = el('<button class="btn sm" type="button" aria-haspopup="menu">操作</button>');
      actBtn.addEventListener('click', function (e) { e.stopPropagation(); openActions(actBtn, detailS); });
      head.insertBefore(actBtn, head.lastElementChild);
    }
    $('[data-pay]', detail.el).classList.toggle('hidden', RO() || ACTIVE_NOT_DONE.indexOf(s.status) < 0);
    var keepScroll = detail.body.scrollTop;

    var g = s.groupId ? D.groups[s.groupId] : null;
    var sys = [
      ['報名時間', fmtTime(s.time)],
      ['應繳金額', money(s.price) + ' 元' + (s.priceType ? '（' + s.priceType + '）' : '')],
      ['匯款期限', fmtTime(s.deadline) || '—'],
      ['已繳金額', s.paid === '' ? '—' : money(s.paid) + ' 元'],
      ['退款金額', s.status === '報名取消' ? (s.refund !== '' && s.refund !== undefined ? money(s.refund) + ' 元' : (s.paid !== '' && Number(s.paid) > 0 ? '全額（舊資料未記錄）' : '未繳費，不需退款')) : '—'],
      ['候補順位', s.rank === '' ? '—' : s.rank],
      ['小隊', p.squads > 0 ? squadText(s) : '未設定小隊數'],
      ['房間', s.room || ((p.rooms && p.rooms.rooms.length) ? '未分房' : '—')],
      ['團報', g ? g.names.join('、') + '（預期 ' + g.expected + ' 人' + (s.groupIncomplete ? '，未齊' : '') + (g.reserved ? '，預留 ' + g.reserved + ' 名額至 ' + fmtTime(g.holdUntil) : '') + '）' : (s.partners && s.partners.length ? '填寫同伴：' + s.partners.join('、') : '個人報名')],
      ['結果通知', /^\d{4}-\d{2}-\d{2}T/.test(s.notified) ? '已寄出（' + fmtTime(s.notified.split(' ')[0]) + '）' : (s.notified || '—')]
    ];
    var html = '';
    var rq = lastRefundReq(s), rqOpen = !!refundReq(s);
    if (rq) {
      var rf = rq.refund;
      html += '<div class="drawer-section"><div class="rq-card' + (rqOpen ? ' open' : '') + '"><div class="rq-head"><b>' + (rqOpen ? '學員申請取消，待處理退款' : rq.revoked ? '學員的取消申請（已撤銷）' : '學員的退款申請（已處理）') + '</b><span class="small muted">' + esc(fmtTime(rq.t)) + '</span></div>' +
        '<dl class="kv"><dt>取消原因</dt><dd>' + esc(rq.reason || '—') + '</dd>' +
        (rq.note ? '<dt>備註</dt><dd>' + esc(rq.note) + '</dd>' : '') +
        '<dt>銀行</dt><dd>' + esc(rf.bank) + '</dd><dt>分行</dt><dd>' + esc(rf.branch || '—') + '</dd><dt>戶名</dt><dd>' + esc(rf.name) + '</dd>' +
        '<dt>帳號</dt><dd><b class="rq-no">' + esc(rf.no) + '</b></dd>' +
        '<dt>可退金額</dt><dd>' + (rf.pct === null || rf.pct === undefined || rf.pct === '' ? '沒有設定退款規定，請自行判斷' : '依退款規定 ' + esc(rf.pct) + '%，' + money(rf.amount) + ' 元') + '</dd>' +
        (s.status === '報名取消' && s.refund !== '' && s.refund !== undefined ? '<dt>實際退回</dt><dd>' + money(s.refund) + ' 元' + (s.refundDetail && s.refundDetail.items && s.refundDetail.items.length ? '（原繳 ' + money(s.refundDetail.paid) + s.refundDetail.items.map(function (it) { return '，扣' + esc(it.label) + ' ' + money(it.amount); }).join('') + '）' : '') + '</dd>' : '') + '</dl>' +
        '<div class="rq-acts"><button class="btn sm" type="button" data-rq="copy">複製退款帳戶</button>' +
        (rqOpen && !RO() ? '<button class="btn sm danger" type="button" data-rq="go">處理退款並取消報名</button>' : '') + '</div>' +
        (rqOpen ? '<div class="small muted">退款匯出後按「處理退款並取消報名」，在退款計算填扣除的項目，系統會取消報名、寄「取消報名退款通知」（附退款明細），並記下退款金額。在那之前名額仍保留。</div>' : '') +
        '</div></div>';
    }
    html += '<div class="drawer-section"><h3>報名資訊</h3><dl class="kv">' +
      sys.map(function (row) { return '<dt>' + esc(row[0]) + '</dt><dd>' + esc(row[1]) + '</dd>'; }).join('') + '</dl></div>';

    // 同意書：專案有開放或學員簽過時顯示。待審核時直接攤開簽名與檔案，按「審核通過」收起來，「不通過」寄重簽通知
    var cf = (p.forms || []).filter(function (x) { return x.kind === 'consent'; })[0], cs = s.consent;
    if (cs || (cf && cf.open && tierOk(s))) {
      var rv = cs && cs.review, csHtml;
      if (!cs) csHtml = '<div class="consent-box"><span class="pill mute">尚未簽署</span>　<span class="small muted">信件可放 {{簽署同意書按鈕}}，學員專區也會出現「' + esc(cf.button) + '」按鈕</span></div>';
      else {
        var st = !rv ? '<span class="pill warn">待審核</span>' : rv.ok ? '<span class="pill ok">審核通過</span>' : '<span class="pill bad">已請重簽</span>';
        var files = (cs.files || []).map(function (f, i) { return '<button class="btn sm ghost" type="button" data-cf="' + i + '">' + esc(f.label || f.name) + '</button>'; }).join('');
        csHtml = '<div class="consent-box"><div>' + st + '　' + esc(fmtTime(cs.t)) + ' 簽署・' + (cs.mode === 'upload' ? '下載後上傳' : '線上簽署') + '</div>' +
          '<div class="small muted">' + esc((cs.docs || []).map(function (d) { return d.title; }).join('、')) + '</div>' +
          '<div class="small">' + esc((cs.signers || []).join('；')) + (cs.age !== null && cs.age !== undefined ? '　（營期開始時 ' + cs.age + ' 歲）' : '　（沒有出生日期，依未成年辦理）') + '</div>' +
          (!rv && !(cf && cf.purged) ? '<div class="consent-inline" id="cs-inline"></div>' +
            (RO() ? '' : '<div class="row wrap" style="gap:8px"><button class="btn primary sm" type="button" data-cr="pass">審核通過</button><button class="btn sm" type="button" data-cr="redo">不通過，寄重簽通知</button></div>')
          : cf && cf.purged ? '<div class="small muted">簽名與檔案已於 ' + esc(fmtTime(cf.purged)) + ' 依保存期限刪除</div>'
          : rv.ok ? '<div class="small muted">' + esc(fmtTime(rv.t)) + '・' + esc(rv.by) + ' 審核通過</div><details class="consent-more"><summary>查看簽名與檔案</summary><div class="consent-files">' + files + '</div></details>'
          : '<div class="small">不通過原因：' + esc(rv.reason) + '</div><div class="small muted">' + esc(fmtTime(rv.t)) + '・' + esc(rv.by) + ' 已寄重簽通知，等學員重新簽署</div><div class="consent-files">' + files + '</div>') +
          '</div>';
      }
      html += '<div class="drawer-section"><h3>同意書</h3>' + csHtml + '</div>';
    }

    var titles = (p.questions || []).slice();
    Object.keys(s.data).forEach(function (k) { if (titles.indexOf(k) < 0) titles.push(k); });
    html += '<div class="drawer-section"><h3>表單資料</h3>' + titles.map(function (t, i) {
      return '<div class="field-row"><div class="k">' + esc(t) + '</div><div class="v">' + valueHtml(s.data[t]) + '</div>' +
        (RO() ? '<span></span>' : '<button class="btn ghost sm" type="button" data-edit="' + i + '">修改</button>') + '</div>';
    }).join('') + '</div>';

    // 備註：管理員可以新增（不能修改或刪除），記錄時間與作者
    var notes = (s.notes || []).slice().reverse();
    html += '<div class="drawer-section note-sec"><h3>備註 <span class="small muted">' + (notes.length ? notes.length + ' 則' : '') + '</span></h3>' +
      (RO() ? '' : '<div class="note-add"><textarea class="input" rows="2" maxlength="2000" aria-label="新增備註" placeholder="例如：家長來電說會晚到。只有管理員看得到，新增後不能修改或刪除"></textarea>' +
        '<div class="row" style="gap:8px"><span class="small muted grow note-left"></span><button class="btn sm primary" type="button" data-note-add>新增備註</button></div></div>') +
      (notes.length ? '<ul class="timeline note-list">' + notes.map(function (n) {
        return '<li><div class="note-text">' + esc(n.text) + '</div><div class="t">' + esc(fmtTime(n.t)) + '　·　' + esc(n.name || n.by) + '</div></li>';
      }).join('') + '</ul>' : '<div class="small muted">還沒有備註</div>') + '</div>';

    var hist = (s.history || []).slice().reverse();
    html += '<div class="drawer-section"><h3>狀態紀錄</h3><ul class="timeline">' + hist.map(function (h) {
      return '<li><div>' + esc(h.msg) + '</div><div class="t">' + esc(fmtTime(h.t)) + '　·　' + esc(h.by) + '</div></li>';
    }).join('') + '</ul></div>';
    detail.body.innerHTML = html;
    detail.body.scrollTop = keepScroll;
    var noteBtn = $('[data-note-add]', detail.body);
    if (noteBtn) {
      var noteTa = $('.note-add textarea', detail.body);
      noteTa.addEventListener('input', function () {
        var n = noteTa.value.length;
        $('.note-left', detail.body).textContent = n > 1800 ? '已輸入 ' + n + ' / 2000 字' : '';
      });
      noteBtn.addEventListener('click', function () {
        clearFieldErrors(detail.body);
        var t = noteTa.value.trim();
        if (!t) { fieldError(noteTa, '請輸入備註內容'); return; }
        noteBtn.disabled = true; noteBtn.classList.add('is-busy');
        api('addNote', prefix, s.id, t).then(function (r) {
          s.notes = r.notes;
          toast('已新增備註' + (r.left < 5000 ? '（這位學員的備註快到上限，還能寫約 ' + Math.max(0, r.left) + ' 字）' : ''));
          openDetail(s);
          renderTable();
          load();
        }).catch(function (e) {
          noteBtn.disabled = false; noteBtn.classList.remove('is-busy');
          fieldError(noteTa, e.message);
        });
      });
    }
    if (rq) {
      $('[data-rq=copy]', detail.body).addEventListener('click', function () {
        var acc = rq.refund, txt = '戶名：' + acc.name + '\n銀行：' + acc.bank + (acc.branch ? ' ' + acc.branch : '') + '\n帳號：' + acc.no + (acc.amount !== '' && acc.amount !== null && acc.amount !== undefined ? '\n金額：' + money(acc.amount) + ' 元' : '');
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('已複製退款帳戶'); }).catch(function () { toast('複製失敗，請手動選取帳號', true); });
      });
      var go = $('[data-rq=go]', detail.body);
      if (go) go.addEventListener('click', function () { cancelDialog(s); });
    }

    var inl = $('#cs-inline', detail.body);
    if (inl) showConsentInline(s, inl);
    $$('[data-cr]', detail.body).forEach(function (b) {
      b.addEventListener('click', function () { if (b.getAttribute('data-cr') === 'pass') consentPass(s); else consentRedo(s); });
