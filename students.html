<!DOCTYPE html>
<!-- 營隊報名管理系統　© 2026 Daniel GUO. All rights reserved. -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="營隊管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>報名與學員管理｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/export.js"></script>
</head>
<body>
  <main id="app">
<div class="view-students hidden">
  <div class="page-head">
    <div>
      <div class="row wrap"><h1 id="st-title">載入中</h1><span id="st-status"></span></div>
      <div class="sub" id="st-sub"></div>
    </div>
    <div class="spacer"></div>
    <div class="row wrap">
      <button class="btn" type="button" id="st-sync">同步表單</button>
      <button class="btn" type="button" id="st-bulk">群發通知</button>
      <button class="btn" type="button" id="st-export">匯出 PDF</button>
      <button class="btn desk-only" type="button" id="st-tpl">信件範本</button>
      <button class="btn desk-only" type="button" id="st-forms">預製表單</button>
      <button class="btn" type="button" id="st-portal">學員專區</button>
      <button class="btn desk-only" type="button" id="st-squad">分小隊</button>
      <button class="btn desk-only" type="button" id="st-room">分房</button>
      <button class="btn primary" type="button" id="st-settings">專案設定</button>
      <span class="sync-note" id="st-synced"></span>
    </div>
    <div class="phone-note">手機版提供瀏覽、寄信等操作與專案設定。信件範本、預製表單、分小隊、分房、顯示欄位與學員專區的區塊編輯，請用電腦操作。</div>
  </div>
  <div id="st-banner"></div>
  <div class="stats" id="st-stats"></div>
  <div class="card">
    <div class="toolbar">
      <input class="input" id="st-search" placeholder="搜尋姓名、電話、身分證…" style="max-width:260px">
      <div class="chips" id="st-chips"></div>
      <select class="input squad-filter hidden" id="st-squad-filter" aria-label="依小隊篩選"></select>
      <span class="spacer"></span>
      <div class="seg seg-sm" id="st-density" role="radiogroup" aria-label="列表檢視">
        <label><input type="radio" name="density" value=""><span>預設</span></label>
        <label><input type="radio" name="density" value="dense"><span>窄</span></label>
      </div>
      <button class="btn sm ghost desk-only" type="button" id="st-cols">顯示欄位</button>
      <span class="muted small" id="st-count"></span>
    </div>
    <div class="table-wrap">
      <table class="list"><thead id="st-head"></thead><tbody id="st-body"></tbody></table>
    </div>
  </div>
</div>
<div class="loading" id="page-loading"><div class="spinner"></div>載入中</div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
<script>
App.page('students', function (root, params) {
  var prefix = params.prefix;
  var D = null;               // 伺服器回傳的專案資料
  var filter = 'all';
  var search = '';
  var squadFilter = '';       // '' 全部、'0' 未分隊、'1'… 第幾隊
  var ISSUE_TAG = { id: '身分證有誤', email: '信箱有誤', phone: '電話有誤' };
  var STROKE = (window.Intl && Intl.Collator) ? new Intl.Collator('zh-Hant-TW').compare : function (a, b) { return a < b ? -1 : a > b ? 1 : 0; };
  function hasIssue(s) { return !!(s.issues && s.issues.length) && tier(s) < 4; }
  /** 已繳費的學員填了取消報名表單、還沒處理：回傳最後一筆申請（含退款帳戶），否則 null */
  function refundReq(s) {
    if (['報名取消', '報名失敗'].indexOf(s.status) >= 0) return null;
    var list = (s.forms || []).filter(function (f) { return f.kind === 'cancel' && f.refund; });
    return list.length ? list[list.length - 1] : null;
  }
  function lastRefundReq(s) {
    var list = (s.forms || []).filter(function (f) { return f.kind === 'cancel' && f.refund; });
    return list.length ? list[list.length - 1] : null;
  }

  var FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'warn', label: '警示' },
    { key: 'todo', label: '待繳款／核對' },
    { key: 'done', label: '程序完成' },
    { key: 'wait', label: '候補中' },
    { key: 'gone', label: '取消／失敗' }
  ];

  function load() {
    return apiFast('getProjectData', prefix, function (d, fresh) {
      D = d;
      if (fresh) hideUpdate();   // 自己重新載入過，就是最新的名單
      if (fresh && $('#menu-pop')) return;   // 操作選單開著時不重畫，資料已更新
      render();
    })
      .catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 排序：警示 → 已報名（期限近的在上）→ 程序完成 → 候補 → 取消；同層依報名時間；團報相鄰 ---------- */
  function tier(s) {
    if (refundReq(s)) return 0;   // 申請取消待退款：排最上面
    if (D.warningStatuses.indexOf(s.status) >= 0) return 0;
    if (s.status === '程序完成') return 2;
    if (D.activeStatuses.indexOf(s.status) >= 0) return 1;
    if (s.status === '候補中') return 3;
    if (s.status === '報名取消') return 4;
    return 5;
  }
  function keyOf(s) {
    var t = tier(s);
    var k2 = 0;
    if (t === 1 || t === 0) { var d = Date.parse(s.deadline); k2 = isNaN(d) ? 9e15 : d; }
    if (t === 3 && D.project.waitOrder === '人工') k2 = s.rank === '' ? 9e15 : Number(s.rank);
    return [t, k2, Date.parse(s.time) || 0];
  }
  function cmp(a, b) { for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; }

  function sorted(list) {
    var keys = {};
    list.forEach(function (s) { keys[s.id] = keyOf(s); });
    var groupKey = {};
    list.forEach(function (s) {
      if (!s.groupId || tier(s) >= 4) return;
      var k = keys[s.id];
      if (!groupKey[s.groupId] || cmp(k, groupKey[s.groupId]) < 0) groupKey[s.groupId] = k;
    });
    return list.slice().sort(function (a, b) {
      var ga = a.groupId && tier(a) < 4 ? groupKey[a.groupId] : keys[a.id];
      var gb = b.groupId && tier(b) < 4 ? groupKey[b.groupId] : keys[b.id];
      var c = cmp(ga, gb);
      if (c) return c;
      var ida = a.groupId && tier(a) < 4 ? a.groupId : a.id, idb = b.groupId && tier(b) < 4 ? b.groupId : b.id;
      if (ida !== idb) return ida < idb ? -1 : 1;
      return cmp(keys[a.id], keys[b.id]);
    });
  }

  function matches(s) {
    var t = tier(s);
    if (filter === 'warn' && t !== 0 && !hasIssue(s)) return false;
    if (filter === 'refund' && !refundReq(s)) return false;
    if (squadFilter !== '' && D.project.squads > 0 && String(s.squad === '' ? 0 : s.squad) !== squadFilter) return false;
    if (filter === 'todo' && t !== 1 && t !== 0) return false;
    if (filter === 'done' && t !== 2) return false;
    if (filter === 'wait' && t !== 3) return false;
    if (filter === 'gone' && t < 4) return false;
    if (search) {
      var hay = (s.name + ' ' + s.email + ' ' + Object.keys(s.data).map(function (k) { return s.data[k]; }).join(' ')).toLowerCase();
      if (hay.indexOf(search) < 0) return false;
    }
    return true;
  }

  /* ---------- 版面 ---------- */
  function render() {
    var p = D.project;
    $('#st-title', root).textContent = p.name;
    $('#st-status', root).innerHTML = pill(D.effective);
    var regText = p.regStart || p.regEnd ? (p.regStart ? fmtDate(p.regStart) : '不限') + ' – ' + (p.regEnd ? fmtDate(p.regEnd) : '未定') : '未設定';
    var regTag = p.regState === 'before' ? '（尚未開始）' : p.regState === 'after' ? '（已結束）' : '';
    $('#st-sub', root).textContent = p.prefix + '　·　招生 ' + regText + regTag + '　·　營期 ' + fmtDate(p.start) + ' – ' + fmtDate(p.end) + '　·　遞補：' + p.promoteMode + '　·　候補順序：' + p.waitOrder;

    var banner = $('#st-banner', root);
    banner.className = ''; banner.textContent = '';
    if (D.readOnly) {
      banner.className = 'banner bad';
      banner.textContent = '此專案目前為「' + D.effective + '」，只能瀏覽，不能寄信或修改資料。';
    } else if (p.status === '系統維護') {
      banner.className = 'banner warn';
      banner.textContent = '系統維護中：所有寄出的信件會改寄到 ' + p.maintBy + '，不會寄給學員。';
    }
    ['#st-sync', '#st-bulk'].forEach(function (id) { $(id, root).disabled = D.readOnly; });
    var ls = D.lastSync;
    $('#st-synced', root).textContent = ls && ls.t ? '上次同步 ' + fmtTime(ls.t) + (/^系統/.test(ls.by) ? '（自動）' : '') : '尚未同步';
    $('#st-synced', root).title = ls && ls.t ? '由 ' + ls.by + ' 同步' : '';

    var st = D.stats;
    var pct = st.capacity ? Math.min(100, Math.round(st.active / st.capacity * 100)) : 0;
    var rpct = st.capacity && st.reserved ? Math.min(100 - pct, Math.round(st.reserved / st.capacity * 100)) : 0;
    // 團報還沒填完的同伴先預留：顯示「已錄取 + 預留」，例如 4+2，同伴填完一位就變 5+1
    $('#st-stats', root).innerHTML =
      stat('報名人數', st.active + (st.reserved ? '<span class="plus-rsv">+' + st.reserved + '</span>' : '') + '<small>/ ' + st.capacity + '</small>',
        (st.reserved ? '團報預留 ' + st.reserved + ' 位（同伴還沒填表）　' : '') + '剩餘名額 ' + st.available, pct, rpct) +
      stat('完成度', st.completion + '<small>%</small>', '程序完成 ' + st.done + ' 人', st.completion) +
      stat('預計收入', money(st.expectedIncome) + '<small>元</small>', '已錄取者應繳合計') +
      stat('已確認繳款', money(st.confirmedIncome) + '<small>元</small>', st.refunded || st.retained ? '含取消後保留 ' + money(st.retained) + '（已退 ' + money(st.refunded) + '）' : '程序完成者合計', paidPct(st)) +
      stat('警示', st.warnings + '<small>人</small>', warnFoot(st)) +
      stat('候補中', st.waitlist + '<small>人</small>', '取消 ' + st.cancelled + '　失敗 ' + st.failed);
    $$('#st-stats .stat', root).forEach(function (card, i) {
      var kind = ['count', 'done', 'income', 'paid', 'warn', 'wait'][i];
      card.classList.add('clickable'); card.tabIndex = 0; card.setAttribute('role', 'button');
      card.title = '點開看摘要';
      card.addEventListener('click', function () { openStatDetail(kind); });
      card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStatDetail(kind); } });
    });

    var chips = $('#st-chips', root);
    chips.innerHTML = '';
    var nRefund = D.students.filter(refundReq).length;
    if (filter === 'refund' && !nRefund) filter = 'all';
    FILTERS.concat(nRefund ? [{ key: 'refund', label: '待退款 ' + nRefund, bad: true }] : []).forEach(function (f) {
      var c = el('<button class="chip' + (f.bad ? ' chip-bad' : '') + '' + (filter === f.key ? ' on' : '') + '" type="button"></button>');
      c.textContent = f.label;
      c.addEventListener('click', function () { filter = f.key; render(); });
      chips.appendChild(c);
    });
    var sf = $('#st-squad-filter', root);
    sf.classList.toggle('hidden', !(p.squads > 0));
    if (p.squads > 0) {
      if (Number(squadFilter) > p.squads) squadFilter = '';
      var opts = '<option value="">全部小隊</option>';
      for (var q = 1; q <= p.squads; q++) opts += '<option value="' + q + '">第 ' + q + ' 隊（' + D.students.filter(function (x) { return x.squad === q && tier(x) < 4; }).length + '）</option>';
      opts += '<option value="0">未分隊（' + D.students.filter(function (x) { return x.squad === '' && tier(x) < 4; }).length + '）</option>';
      sf.innerHTML = opts; sf.value = squadFilter;
    } else squadFilter = '';
    renderTable();
  }

  /* ---------- 統計卡點開：快速摘要＋名單，可直接篩選或打開學員 ---------- */
  function openStatDetail(kind) {
    var st = D.stats, all = D.students;
    var isActive = function (s) { return D.activeStatuses.indexOf(s.status) >= 0; };
    var paidOf = function (s) { return s.paid === '' || s.paid === undefined ? (s.status === '程序完成' ? Number(s.price) || 0 : 0) : Number(s.paid) || 0; };
    var title = '', filterKey = null, rows = [], list = [], cols = null, progress = null;
    function countBy(arr, fn) { var m = {}; arr.forEach(function (s) { var k = fn(s); m[k] = (m[k] || 0) + 1; }); return m; }
    if (kind === 'count') {
      title = '報名人數';
      var by = countBy(all, function (s) { return s.status; });
      rows = [['已錄取', st.active + (st.reserved ? ' + 預留 ' + st.reserved : '') + ' / ' + st.capacity + ' 人'], ['剩餘名額', st.available + ' 人' + (st.reserved ? '（團報預留 ' + st.reserved + ' 位已扣除）' : '')]]
        .concat(Object.keys(by).map(function (k) { return [k, by[k] + ' 人']; }));
      if (D.project.squads > 0) {
        var sq = countBy(all.filter(isActive), function (s) { return s.squad === '' ? '未分隊' : '第 ' + s.squad + ' 隊'; });
        rows.push(['小隊', Object.keys(sq).sort().map(function (k) { return k + ' ' + sq[k]; }).join('、')]);
      }
      var groups = Object.keys(D.groups || {}).map(function (k) { return D.groups[k]; }).filter(function (g) { return g.expected > g.active; });
      if (groups.length) rows.push(['團報未齊', groups.map(function (g) { return (g.names || []).join('、') + '（' + g.active + '/' + g.expected + '）'; }).join('；')]);
      filterKey = 'all';
    } else if (kind === 'done') {
      title = '完成度';
      rows = [['程序完成', st.done + ' 人'], ['還沒完成', (st.active - st.done) + ' 人'], ['完成度', st.completion + '%']];
      list = all.filter(function (s) { return isActive(s) && s.status !== '程序完成'; })
        .sort(function (a, b) { return (Date.parse(a.deadline) || 9e15) - (Date.parse(b.deadline) || 9e15); });
      cols = function (s) { return [s.status, s.deadline ? '期限 ' + fmtTime(s.deadline) : '—', money(s.price) + ' 元']; };
      filterKey = 'todo';
    } else if (kind === 'income') {
      title = '預計收入';
      var types = {};
      all.filter(isActive).forEach(function (s) { var k = s.priceType || '未分類'; types[k] = types[k] || { n: 0, sum: 0 }; types[k].n++; types[k].sum += Number(s.price) || 0; });
      rows = Object.keys(types).map(function (k) { return [k, types[k].n + ' 人，' + money(types[k].sum) + ' 元']; });
      if (st.retained) rows.push(['取消後保留', money(st.retained) + ' 元']);
      rows.push(['合計', money(st.expectedIncome) + ' 元'], ['已確認', money(st.confirmedIncome) + ' 元'], ['尚未收到', money(Math.max(0, st.expectedIncome - st.confirmedIncome)) + ' 元']);
      list = all.filter(isActive);
      cols = function (s) { return [s.priceType || '—', money(s.price) + ' 元', s.status]; };
    } else if (kind === 'paid') {
      title = '已確認繳款';
      var paidList = all.filter(function (s) { return s.status === '程序完成' || (s.status === '報名取消' && paidOf(s) > 0); });
      rows = [['程序完成', st.done + ' 人'], ['已確認金額', money(st.confirmedIncome) + ' 元'], ['預計收入', money(st.expectedIncome) + ' 元'], ['尚未收到', money(Math.max(0, st.expectedIncome - st.confirmedIncome)) + ' 元']];
      progress = { label: '收款進度', pct: paidPct(st), text: '已確認 ' + money(st.confirmedIncome) + ' / 預計 ' + money(st.expectedIncome) + ' 元' };
      if (st.refunded || st.retained) rows.push(['取消後已退', money(st.refunded) + ' 元'], ['取消後保留', money(st.retained) + ' 元']);
      var diff = paidList.filter(function (s) { return s.status === '程序完成' && s.paid !== '' && Number(s.paid) !== Number(s.price); });
      if (diff.length) rows.push(['金額與應繳不同', diff.length + ' 人']);
      list = paidList;
      cols = function (s) { return [s.status, '已繳 ' + money(paidOf(s)) + ' 元', s.status === '報名取消' ? '退 ' + money(s.refund || 0) + ' 元' : (s.paid !== '' && Number(s.paid) !== Number(s.price) ? '應繳 ' + money(s.price) : '')]; };
      filterKey = 'done';
    } else if (kind === 'warn') {
      title = '警示';
      rows = [['招生期外', (st.outside || 0) + ' 人'], ['匯款逾期／異常', ((st.statusWarnings || 0) - (st.outside || 0)) + ' 人'],
        ['身分證有誤', (st.idInvalid || 0) + ' 人'], ['信箱有誤', (st.emailInvalid || 0) + ' 人'], ['電話有誤', (st.phoneInvalid || 0) + ' 人']]
        .filter(function (r) { return !/^0 /.test(r[1]); });
      if (!rows.length) rows = [['目前沒有警示', '']];
      if (D.students.filter(refundReq).length) rows.unshift(['申請取消待退款', D.students.filter(refundReq).length + ' 人']);
      list = all.filter(function (s) { return refundReq(s) || D.warningStatuses.indexOf(s.status) >= 0 || (tierOk(s) && (s.issues || []).length); });
      cols = function (s) {
        var why = [];
        if (refundReq(s)) why.push('申請取消待退款');
        if (D.warningStatuses.indexOf(s.status) >= 0) why.push(s.status);
        (s.issues || []).forEach(function (x) { why.push(ISSUE_TAG[x.key] + '：' + x.value); });
        return [why.join('、')];
      };
      filterKey = 'warn';
    } else if (kind === 'wait') {
      title = '候補中';
      rows = [['候補中', st.waitlist + ' 人'], ['候補順序', D.project.waitOrder], ['遞補模式', D.project.promoteMode], ['報名取消', st.cancelled + ' 人'], ['報名失敗', st.failed + ' 人']];
      list = all.filter(function (s) { return s.status === '候補中'; }).sort(function (a, b) { return cmp(keyOf(a), keyOf(b)); });
      cols = function (s, i) { return ['第 ' + (s.rank !== '' && s.rank !== undefined ? s.rank : i + 1) + ' 位', '報名 ' + fmtTime(s.time)]; };
      filterKey = 'wait';
    }
    var body = el('<div class="stat-detail">' + (progress ? '<div class="sd-progress"><div class="row"><span class="small muted grow">' + esc(progress.label) + '</span><b>' + progress.pct + '<small>%</small></b></div>' +
      '<div class="bar"><i style="width:' + progress.pct + '%"></i></div><div class="small muted">' + esc(progress.text) + '</div></div>' : '') + '<dl class="sd-rows"></dl><div class="sd-list"></div></div>');
    rows.forEach(function (r) {
      var dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = r[0]; dd.textContent = r[1];
      $('.sd-rows', body).appendChild(dt); $('.sd-rows', body).appendChild(dd);
    });
    if (cols) {
      var box = $('.sd-list', body);
      if (!list.length) box.innerHTML = '<div class="small muted">沒有學員</div>';
      list.slice(0, 200).forEach(function (s, i) {
        var it = el('<button type="button" class="sd-item"><b></b><span class="sd-cols"></span></button>');
        $('b', it).textContent = s.name;
        $('.sd-cols', it).textContent = cols(s, i).filter(String).join('　·　');
        it.addEventListener('click', function () { var ov = it.closest('.overlay'); if (ov) ov.remove(); openDetail(s); });
        box.appendChild(it);
      });
      if (list.length > 200) box.appendChild(el('<div class="small muted">只列出前 200 位，其餘請用名單篩選</div>'));
    }
    var buttons = [{ label: '關閉', value: null }];
    if (filterKey) buttons.push({ label: '在名單中篩選', cls: 'primary', value: filterKey });
    modal({ title: title, body: body, buttons: buttons }).then(function (v) {
      if (!v) return;
      filter = v; render();
      var t = $('#st-chips', root); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function warnFoot(st) {
    var parts = [];
    if (st.outside) parts.push('招生期外 ' + st.outside);
    var pay = (st.statusWarnings || 0) - (st.outside || 0);
    if (pay) parts.push('匯款逾期／異常 ' + pay);
    if (st.idInvalid) parts.push('身分證有誤 ' + st.idInvalid);
    if (st.emailInvalid) parts.push('信箱有誤 ' + st.emailInvalid);
    if (st.phoneInvalid) parts.push('電話有誤 ' + st.phoneInvalid);
    return parts.length ? parts.join('、') + (st.warnings < parts.length ? '（同一人可能有多項）' : '') : '招生期外、匯款逾期異常、資料有誤';
  }

  /** 收款進度：已確認繳款佔預計收入的比例 */
  function paidPct(st) { return st.expectedIncome > 0 ? Math.min(100, Math.round(st.confirmedIncome / st.expectedIncome * 100)) : 0; }

  function stat(label, value, foot, bar, bar2) {
    return '<div class="stat"><div class="label">' + esc(label) + '</div><div class="value">' + value + '</div>' +
      (bar !== undefined ? '<div class="bar' + (bar2 ? ' split' : '') + '"><i style="width:' + bar + '%"></i>' + (bar2 ? '<i class="rsv" style="width:' + bar2 + '%"></i>' : '') + '</div>' : '') +
      '<div class="foot">' + esc(foot) + '</div></div>';
  }

  /** 名單欄位：學員姓名一律放第一欄（就算沒勾選顯示），其他依專案設定 */
  function columns() {
    var nameCol = D.project.mapping.name;
    var cols = (D.project.display || []).filter(function (t) { return t && t !== nameCol; });
    return nameCol ? [nameCol].concat(cols) : cols;
  }
  function squadText(s) { return s.squad === '' || s.squad === undefined ? '未分隊' : '第 ' + s.squad + ' 隊'; }

  function valueHtml(v) {
    var s = String(v === undefined || v === null ? '' : v);
    if (!s) return '<span class="muted">—</span>';
    var parts = s.split(/,\s*/);
    var links = parts.filter(function (x) { return /^https?:\/\//i.test(x); });
    if (links.length && links.length === parts.length) {
      return links.map(function (u, i) {
        var label = /drive\.google\.com/.test(u) ? '查看檔案' : '開啟連結';
        return '<a class="link-btn" target="_blank" rel="noopener" href="' + esc(u) + '" onclick="event.stopPropagation()">' + label + (links.length > 1 ? ' ' + (i + 1) : '') + '</a>';
      }).join('');
    }
    return esc(s);
  }

  function renderTable() {
    var cols = columns();
    var hl = D.project.highlight || {};
    var sq = D.project.squads > 0;
    $('#st-head', root).innerHTML = '<tr><th>狀態</th>' + cols.map(function (c, i) { return '<th class="' + (i === 0 ? 'th-name' : 'th-clip') + '" title="' + esc(c) + '">' + esc(c) + '</th>' + (i === 0 && sq ? '<th>小隊</th>' : ''); }).join('') + '<th>備註（狀態紀錄）</th><th></th></tr>';
    // 團報側邊條：每組固定一種柔和的顏色（依團報代號決定），和上一組同色時換下一個
    var GROUP_COLORS = ['#a7bfa9', '#a3b6cc', '#bfa9c4', '#d4b994', '#c9a6a0', '#94bcb8', '#bab88f', '#adadcf'];
    function groupColor(id, avoid) {
      var h = 0;
      String(id).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) % 9973; });
      var i = h % GROUP_COLORS.length;
      return i === avoid ? (i + 1) % GROUP_COLORS.length : i;
    }
    var list = sorted(D.students).filter(matches);
    $('#st-count', root).textContent = '顯示 ' + list.length + ' / ' + D.students.length + ' 筆';
    var body = $('#st-body', root);
    body.innerHTML = '';
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="' + (cols.length + 3 + (sq ? 1 : 0)) + '"><div class="empty">' + (D.students.length ? '沒有符合條件的學員' : '還沒有報名資料') + '</div></td></tr>';
      return;
    }
    var prevGroup = null, prevColor = -1;
    list.forEach(function (s) {
      var grouped = s.groupId && tier(s) < 4;
      var tr = document.createElement('tr');
      if (tier(s) >= 4) tr.className = 'faded';
      if (grouped) {
        tr.classList.add('in-group');
        if (prevGroup !== s.groupId) { tr.classList.add('group-start'); prevColor = groupColor(s.groupId, prevColor); }
        tr.style.setProperty('--gc', GROUP_COLORS[prevColor]);
      }
      prevGroup = grouped ? s.groupId : null;

      var tags = '';
      if (grouped) {
        tags += s.groupIncomplete ? '<span class="tag group" title="團員還沒全部報名，名額先預留">團報未齊</span>' : '<span class="tag group">團報</span>';
      }
      if (/早鳥/.test(s.priceType || '') && tier(s) < 4) tags += '<span class="tag early" title="' + esc(s.priceType) + '">早鳥</span>';
      // 同一種問題（例如兩個電話都有誤）只標一次，滑過可看全部
      var issueTip = {}, issueOrder = [];
      (s.issues || []).forEach(function (x) {
        var k = ISSUE_TAG[x.key];
        if (!issueTip[k]) { issueTip[k] = []; issueOrder.push(k); }
        issueTip[k].push(x.field + '「' + x.value + '」' + x.msg);
      });
      issueOrder.forEach(function (k) { tags += '<span class="tag bad" title="' + esc(issueTip[k].join('\n') + '\n報名信已提醒更正') + '">' + k + (issueTip[k].length > 1 ? ' ×' + issueTip[k].length : '') + '</span>'; });
      if (s.status === '候補中' && s.rank !== '') tags += '<span class="tag">候補 ' + esc(s.rank) + '</span>';
      if (refundReq(s)) tags += '<span class="tag bad" title="學員已繳費並申請取消，點開看退款帳戶">待退款</span>';
      if (s.room && tierOk(s)) tags += '<span class="tag" title="房間">房 ' + esc(s.room) + '</span>';
      var deadlineNote = (tier(s) <= 1 && s.deadline) ? '<div class="small muted deadline-note" style="margin-top:4px">期限 ' + esc(fmtTime(s.deadline)) + '</div>' : '';

      var html = '<td>' + pill(s.status) + deadlineNote + '</td>';
      cols.forEach(function (c, i) {
        // 欄寬固定、過長以「…」截斷；完整內容滑過看提示，或點該列看詳細資料
        var raw = String(s.data[c] === undefined || s.data[c] === null ? '' : s.data[c]);
        var tip = /^https?:\/\//i.test(raw) ? '' : ' title="' + esc(raw) + '"';
        if (i === 0) {
          html += '<td class="cell-name"><div class="clip-1 name-strong"' + tip + '>' + valueHtml(s.data[c] || s.name) + '</div>' + (tags ? '<div>' + tags + '</div>' : '') + '</td>';
          if (sq) html += '<td class="cell-squad">' + (s.squad === '' ? '<span class="muted">—</span>' : esc(s.squad)) + '</td>';
        }
        else html += '<td class="cell-clip' + (highlightHit(hl[c], raw) ? ' hl' : '') + '"' + tip + '>' + valueHtml(s.data[c]) + '</td>';
      });
      var last = s.history && s.history.length ? s.history[s.history.length - 1] : null;
      html += '<td class="note-cell">' + (last ? '<div class="last">' + esc(last.msg) + '</div><div class="small" style="color:var(--text-3)">' + esc(fmtTime(last.t)) + '　·　共 ' + s.history.length + ' 筆</div>' : '') + '</td>';
      html += '<td style="text-align:right"><button class="btn ghost icon" type="button" aria-label="操作">⋯</button></td>';
      tr.innerHTML = html;
      $('button', tr).addEventListener('click', function (e) { e.stopPropagation(); openActions(this, s); });
      tr.addEventListener('click', function () { openDetail(s); });
      body.appendChild(tr);
    });
  }

  /* ---------- 學員操作選單（每位學員列最後方） ---------- */
  function has(s, list) { return list.indexOf(s.status) >= 0; }
  var ACTIVE_NOT_DONE = ['已報名', '繳款待核覆', '匯款逾期', '匯款異常'];

  function openActions(anchor, s) {
    var ro = D.readOnly;
    var items = [{ header: s.name }];
    function add(label, ok, fn, danger, mail) { items.push({ label: label, disabled: ro || !ok, onClick: fn, danger: danger, mail: mail }); }
    if (s.status === '招生期外') {
      items.push({ header: '招生期外的報名' });
      add('受理報名…', true, function () {
        ask('受理報名', [{ name: 'sendMail', label: '寄送結果通知給學員（下一步可預覽）', type: 'checkbox', value: true }], function (v) { run(s, 'accept', v); });
      }, false, 'opt');
      items.push({ sep: true });
    }
    if (s.status === '資格審核中') {
      items.push({ header: '資格審核' });
      add('審核通過，寄繳費通知…', true, function () {
        ask('審核通過', [{ name: 'amount', label: '應繳金額（元）', type: 'number', required: true, value: s.price,
          hint: '依報名時的價格預設 ' + money(s.price) + ' 元，有減免請改成實際金額。匯款期限從現在起算，下一步可預覽「審核通過與繳費通知」。' }], function (v) { run(s, 'reviewPass', v); });
      }, false, 'yes');
      add('審核未通過…', true, function () {
        ask('審核未通過', [
          { name: 'amount', label: '應繳金額（元）', type: 'number', required: true, value: s.price, hint: '預設依一般方案計算的 ' + money(s.price) + ' 元。會改為已報名並寄「審核未通過通知」，匯款期限從現在起算。' },
          { name: 'reason', label: '補充說明（選填，會寫進信裡）', type: 'textarea' }
        ], function (v) { run(s, 'reviewFail', v); });
      }, false, 'yes');
      items.push({ sep: true });
    }
    if (s.status === '候補中' && s.groupId) {
      // 同團還在候補的人數超過剩餘名額才算「名額不足」；名額夠就直接整團遞補，不用超收
      var gWait = D.students.filter(function (x) { return x.groupId === s.groupId && x.status === '候補中'; }).length;
      var short = gWait > D.stats.available;
      items.push({ header: short ? '團報名額不足（這團候補 ' + gWait + ' 人，剩 ' + D.stats.available + ' 位）' : '團報候補（名額足夠）' });
      add(short ? '超收（整團直接錄取）…' : '整團遞補錄取（' + gWait + ' 人）…', true, function () {
        ask(short ? '超收' : '整團遞補錄取', [{ name: 'sendMail', label: '寄錄取通知給這團的候補學員（下一步可預覽）', type: 'checkbox', value: true }], function (v) { run(s, 'overAdmit', v); });
      }, false, 'opt');
      if (short) add('改為個人報名…', true, function () { askIndividual(s); }, false, 'opt');
      items.push({ sep: true });
    }
    items.push({ header: '寄送通知' });
    add(s.status === '資格審核中' ? '補寄報名資訊核對' : '補寄報名與繳款通知', has(s, ACTIVE_NOT_DONE.concat(['候補中', '資格審核中'])), function () { run(s, 'resend', {}); }, false, 'yes');
    add('匯款期限鄰近通知', has(s, ['已報名', '匯款逾期']), function () { run(s, 'deadline', {}); }, false, 'yes');
    add('匯款異常通知…', has(s, ACTIVE_NOT_DONE), function () {
      ask('匯款異常通知', [{ name: 'reason', label: '異常原因', type: 'textarea', required: true, placeholder: '例如：匯款金額不足 500 元／查無後五碼', presets: P('abnormal') }], function (v) { run(s, 'abnormal', v); });
    }, false, 'yes');
    add('報名費用異動通知…', has(s, ACTIVE_NOT_DONE.concat(['候補中'])), function () {
      ask('報名費用異動通知', [
        { name: 'amount', label: '新的應繳金額（元）', type: 'number', required: true, value: s.price, hint: '目前 ' + money(s.price) + ' 元。金額只能透過此通知修改，會寫回後端並寄信。' },
        { name: 'reason', label: '異動原因', type: 'textarea', required: true, presets: P('feeChange') }
      ], function (v) { run(s, 'feeChange', v); });
    }, false, 'yes');
    add('團報同伴填表提醒', !!s.groupIncomplete && D.activeStatuses.indexOf(s.status) >= 0, function () { run(s, 'groupRemind', {}); }, false, 'yes');
    add('寄送特殊訊息…', !!s.email, function () {
      ask('寄送特殊訊息', [{ name: 'subject', label: '主旨', required: true }, { name: 'body', label: '內容', type: 'textarea', required: true, format: true, presets: P('message'), presetJoin: '\n', hint: '可用粗體、顏色、連結、按鈕與 {{姓名}} 等變數；下一步會看到預覽' }], function (v) { run(s, 'custom', v); });
    }, false, 'yes');
    items.push({ sep: true }, { header: '報名狀態' });
    add('確認繳款…', has(s, ACTIVE_NOT_DONE), function () {
      ask('確認繳款', [{ name: 'info', type: 'note', html: payCheckHtml(s) }, { name: 'amount', label: '核對到的匯款金額（元）', type: 'number', required: true, value: s.price, hint: '應繳 ' + money(s.price) + ' 元；金額一致才會標為程序完成並寄出確認信' }], function (v) { run(s, 'confirmPaid', v); });
    }, false, 'yes');
    add('標記繳款待核覆', has(s, ['已報名', '匯款逾期', '匯款異常']), function () { run(s, 'markPending', {}); });
    add('遞補錄取', s.status === '候補中', function () { run(s, 'promote', {}); }, false, 'yes');
    add('調整候補順位…', s.status === '候補中', function () {
      ask('調整候補順位', [{ name: 'rank', label: '新的順位', type: 'number', required: true, value: s.rank }], function (v) { run(s, 'setRank', v); });
    });
    add('調整團報歸屬…', tierOk(s), function () { askGroup(s); });
    add('手動綁組…', tierOk(s), function () { askBind(s); });
    if (s.groupId && D.activeStatuses.indexOf(s.status) >= 0 && s.status !== '程序完成') add('改為個人報名（重算價格）…', true, function () { askIndividual(s); }, false, 'opt');
    if (D.project.squads > 0) add('調整小隊…', tierOk(s), function () {
      var opts = [{ value: '', label: '未分隊' }];
      for (var q = 1; q <= D.project.squads; q++) opts.push({ value: String(q), label: '第 ' + q + ' 隊' });
      ask('調整小隊', [{ name: 'squad', label: s.name + '　目前：' + squadText(s), type: 'select', options: opts, value: s.squad === '' ? '' : String(s.squad) }], function (v) {
        var a = {}; a[s.id] = v.squad;
        withBusy(api('setSquads', prefix, a)).then(function () { toast('已調整小隊'); closeDetail(); return load(); }).catch(function (e) { toast(e.message, true); });
      });
    });
    var rmList = (D.project.rooms && D.project.rooms.rooms) || [];
    if (rmList.length) add('調整房間…', tierOk(s), function () {
      var opts = [{ value: '', label: '未分房' }].concat(rmList.map(function (x) {
        var n = D.students.filter(function (y) { return y.room === x.no && tierOk(y); }).length;
        return { value: x.no, label: x.no + (x.label ? ' ' + x.label : '') + '（' + n + (x.beds ? '/' + x.beds : '') + ' 人）' };
      }));
      ask('調整房間', [{ name: 'room', label: s.name + '　目前：' + (s.room || '未分房'), type: 'select', options: opts, value: s.room || '' }], function (v) {
        var a = {}; a[s.id] = v.room;
        withBusy(api('setRooms', prefix, a)).then(function () { toast('已調整房間'); closeDetail(); return load(); }).catch(function (e) { toast(e.message, true); });
      });
    });
    add('手動變更狀態…', true, function () {
      var opts = Object.keys(D.statuses).map(function (k) { return D.statuses[k]; }).filter(function (x) { return x !== s.status; });
      ask('手動變更狀態', [{ name: 'status', label: '新狀態', type: 'select', options: opts, required: true }, { name: 'reason', label: '變更原因', type: 'textarea', required: true, presets: P('status') }], function (v) { run(s, 'setStatus', v); });
    });
    items.push({ sep: true });
    add('取消報名…', !has(s, ['報名取消', '報名失敗']), function () { cancelDialog(s); }, true, 'opt');
    popMenu(anchor, items);
  }

  function P(key) { return D.presets && D.presets[key] || []; }

  /** 取消報名視窗；學員申請過取消（已繳費）時，原因與退回金額先帶入申請內容與退款規定估算的金額 */
  function cancelDialog(s) {
    var paidAmt = s.paid !== '' && Number(s.paid) > 0 ? Number(s.paid) : 0, req = refundReq(s);
    var est = req && req.refund.amount !== '' && req.refund.amount !== undefined && req.refund.amount !== null ? Number(req.refund.amount) : null;
    var fields = [{ name: 'reason', label: '取消原因', type: 'textarea', required: true, presets: P('cancel'), value: req ? '學員申請取消：' + (req.reason || '') : '',
      hint: paidAmt ? '' : '此學員尚未確認繳款，不需退款，取消後只從預計收入扣除。' }];
    if (paidAmt) fields.push({ name: 'refund', label: '退回金額（元）', type: 'number', required: true, value: est !== null ? Math.min(est, paidAmt) : paidAmt,
      hint: '已確認繳款 ' + money(paidAmt) + ' 元，' + (est !== null ? '依退款規定可退 ' + req.refund.pct + '%（' + money(est) + ' 元），已先帶入。' : '預設全額退款。') + '請填實際退回的金額，沒退的部分仍計入收入。信件可用 {{退款金額}}。' });
    fields.push({ name: 'sendMail', label: '寄送取消報名通知給學員', type: 'checkbox', value: true });
    ask(req ? '處理退款並取消報名' : '取消報名', fields, function (v) { run(s, 'cancel', v); }, true);
  }

  /** 專案設定裡的預製表單：開關、連結、改內容／跟著系統預設；每個動作直接存 */
  function renderFormSettings(box) {
    var ro = D.readOnly, list = D.project.forms || [];
    function saveForms(mut, msg) {
      var out = {};
      list.forEach(function (f) {
        var o = {};
        if (f.kind === 'consent') { if (f.open) o.on = true; if (f.mode && f.mode !== 'online') o.mode = f.mode; }
        else if (!f.open) o.off = true;
        (f.fields || ['title', 'intro', 'done', 'button']).forEach(function (k) { if (f[k + 'Own']) o[k] = f[k]; });
        out[f.kind] = o;
      });
      mut(out);
      withBusy(api('updateProjectSettings', prefix, { forms: out })).then(function () { toast(msg); cacheClear(); return load().then(function () { if ($('.pf-list')) renderFormSettings($('.pf-list')); }); }).catch(function (e) { toast(e.message, true); });
    }
    box.innerHTML = '';
    if (!D.project.siteUrl) box.appendChild(el('<div class="small" style="color:var(--warn);margin-bottom:8px">還沒記錄網站網址：總管登入一次就會自動記下，之後信裡才會出現表單按鈕。</div>'));
    list.forEach(function (f) {
      var flds = f.fields || ['title', 'intro', 'done', 'button'];
      var own = flds.some(function (k) { return f[k + 'Own']; });
      var row = el('<div class="pf-set"><label class="check"><input type="checkbox"' + (f.open ? ' checked' : '') + (ro ? ' disabled' : '') + '><span><b></b></span></label>' +
        '<span class="small muted grow pf-state"></span>' +
        (f.url ? '<button class="btn sm ghost" type="button" data-a="copy">複製連結</button><a class="btn sm ghost" target="_blank" rel="noopener" data-a="open">打開</a>' : '') +
        (ro ? '' : (own ? '<button class="btn sm ghost" type="button" data-a="reset">跟著系統預設</button>' : '') + '<button class="btn sm" type="button" data-a="edit">編輯內容</button>') + '</div>');
      $('b', row).textContent = f.name;
      $('.pf-state', row).textContent = (f.open ? '開放中' : '已關閉') + '・' + (own ? '這個專案自訂' : '跟著系統預設');
      if ($('[data-a=open]', row)) $('[data-a=open]', row).href = f.url;
      if ($('[data-a=copy]', row)) $('[data-a=copy]', row).addEventListener('click', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(f.url) : Promise.reject()).then(function () { toast('已複製表單連結'); }).catch(function () { prompt('表單連結', f.url); });
      });
      $('input', row).addEventListener('change', function (e) {
        var on = e.target.checked;
        saveForms(function (out) {
          if (f.kind === 'consent') { if (on) out[f.kind].on = true; else delete out[f.kind].on; }
          else if (on) delete out[f.kind].off; else out[f.kind].off = true;
        }, on ? '已開放「' + f.name + '」' : '已關閉「' + f.name + '」，信裡的按鈕也不會出現');
      });
      // 同意書：選擇簽署方式（線上簽、下載後上傳、兩種都開）
      if (f.kind === 'consent') {
        var ms = el('<div class="pf-mode"><span class="small muted">簽署方式</span><select class="input sm"' + (ro ? ' disabled' : '') + '>' +
          '<option value="online">線上簽署（閱讀後在網頁上簽名）</option><option value="upload">下載 PDF，簽好後拍照或上傳 PDF</option><option value="both">兩種都可以，學員自己選</option></select>' +
          '<span class="small muted">未滿 18 歲需學員與家長都簽；成年依報名資料的出生日期判斷</span></div>');
        $('select', ms).value = f.mode || 'online';
        $('select', ms).addEventListener('change', function (e) {
          var m = e.target.value;

  /** 學員專區網址的 QR Code：可下載成圖片放在 IG、海報；QR 程式用到時才載入 */
  function showPortalQr(url) {
    function draw() {
      var box = el('<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><div class="qr-box" style="background:#fff;padding:16px;border-radius:12px"></div>' +
        '<div class="small muted" style="word-break:break-all;text-align:center"></div><a class="btn primary" download="學員專區QR.png">下載圖片</a></div>');
      $('.small', box).textContent = url;
      new QRCode($('.qr-box', box), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
      setTimeout(function () {
        var c = $('.qr-box canvas', box), img = $('.qr-box img', box);
        if (!c) { $('a', box).href = img ? img.src : '#'; return; }
        // 下載的圖片四周留白，掃描比較穩定
        var pad = 24, out = document.createElement('canvas');
        out.width = c.width + pad * 2; out.height = c.height + pad * 2;
        var g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(c, pad, pad);
        $('a', box).href = out.toDataURL('image/png');
      }, 100);
      modal({ title: '學員專區 QR Code', desc: '掃描後直接打開這個專案的學員專區；換新網址後要重新下載。', body: box, buttons: [{ label: '關閉', value: null }] });
    }
    if (window.QRCode) { draw(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = draw;
    sc.onerror = function () { toast('QR Code 程式載入失敗，請檢查網路後再試', true); };
    document.head.appendChild(sc);
  }

  /**
   * 專案價格調整後（原價、團報價、早鳥價、早鳥團報價、早鳥期限）：列出應繳金額會變的學員，
   * 逐一勾選要不要套用、要不要寄「報名費用異動通知」。已確認繳款、自訂金額的人不會自動改。
   */
  function reviewPrices() {
    return withBusy(api('previewPriceReview', prefix)).then(function (r) {
      if (!r.items.length) { if (r.paid.length) toast('價格已更新；有 ' + r.paid.length + ' 位已確認繳款的學員金額不同，請視需要個別處理'); return; }
      var body = el('<div class="pr-dlg"><div class="row wrap" style="gap:12px"><label class="check"><input type="checkbox" data-all="apply" checked><span>全部套用</span></label>' +
        '<label class="check"><input type="checkbox" data-all="mail" checked><span>全部寄通知</span></label><span class="grow"></span><span class="small muted pr-sum"></span></div>' +
        '<div class="pr-list"></div>' +
        (r.paid.length ? '<div class="small muted">另有 ' + r.paid.length + ' 位已確認繳款（' + esc(r.paid.map(function (x) { return x.name; }).join('、')) + '）金額會不同，系統不會自動改，需要時請個別用「報名費用異動通知」。</div>' : '') + '</div>');
      var list = $('.pr-list', body);
      r.items.forEach(function (it) {
        var row = el('<div class="pr-row"><label class="check"><input type="checkbox" data-k="apply" checked><span></span></label>' +
          '<div class="grow"><b></b> <span class="small muted"></span><div class="pr-price"></div></div>' +
          '<label class="check pr-mail"><input type="checkbox" data-k="mail"' + (it.hasEmail ? ' checked' : ' disabled') + '><span>' + (it.hasEmail ? '寄通知' : '沒有信箱') + '</span></label></div>');
        row.setAttribute('data-id', it.id);
        $('b', row).textContent = it.name;
        $('.small', row).textContent = it.status + (it.group ? '・團報' : '');
        $('.pr-price', row).innerHTML = esc(it.fromType + ' ' + money(it.from)) + ' 元 → <b>' + esc(it.toType + ' ' + money(it.to)) + ' 元</b>' + (it.to < it.from ? '<span class="tag early">降價</span>' : '<span class="tag bad">漲價</span>');
        list.appendChild(row);
      });
      function sync() {
        var rows = $$('.pr-row', body), a = 0, m = 0;
        rows.forEach(function (rw) {
          var ap = $('[data-k=apply]', rw).checked, mi = $('[data-k=mail]', rw);
          mi.closest('label').classList.toggle('muted', !ap);
          if (ap) { a++; if (mi.checked && !mi.disabled) m++; }
        });
        $('.pr-sum', body).textContent = '套用 ' + a + ' 位，其中寄通知 ' + m + ' 位';
      }
      body.addEventListener('change', function (e) {
        var all = e.target.getAttribute('data-all');
        if (all) $$('[data-k=' + all + ']', body).forEach(function (i) { if (!i.disabled) i.checked = e.target.checked; });
        sync();
      });
      sync();
      return modal({ title: '價格已調整：要更新這些學員的應繳金額嗎？', desc: '下面是依新價格重新計算後金額會改變的學員（尚未確認繳款、價格由系統計算）。勾選「寄通知」的會寄「報名費用異動通知」，沒勾的只改金額。',
        body: body, wide: true, buttons: [{ label: '先不要', value: null }, { label: '套用', cls: 'primary', value: true }] }).then(function (ok) {
        if (!ok) return;
        var picks = $$('.pr-row', body).filter(function (rw) { return $('[data-k=apply]', rw).checked; }).map(function (rw) {
          var mi = $('[data-k=mail]', rw);
          return { id: rw.getAttribute('data-id'), mail: mi.checked && !mi.disabled };
        });
        if (!picks.length) return;
        return withBusy(api('applyPriceReview', prefix, picks)).then(function (res) {
          toast('已更新 ' + res.changed + ' 位的應繳金額' + (res.mailed ? '，寄出 ' + res.mailed + ' 封通知' : '') + (res.note ? '；' + res.note : ''), !!res.note);
          cacheClear(); return load();
        });
      });
    }).catch(function (e) { toast(e.message, true); });
  }

  /** 改為個人報名：價格依報名時間、團報價或自訂；候補中的人沒有空位時可以超收 */
  function askIndividual(s) {
    var p = D.project;
    var opts = [{ value: 'auto', label: '依報名時間（早鳥價或原價，系統自動判斷）' }];
    if (p.groupPrice > 0) opts.push({ value: 'group', label: '維持團報價 ' + money(p.groupPrice) + ' 元' });
    opts.push({ value: 'manual', label: '自訂金額' });
    var fields = [
      { name: 'priceMode', label: '價格', type: 'select', options: opts, value: 'auto' },
      { name: 'amount', label: '自訂金額（元）', type: 'number', value: s.price, hint: '選「自訂金額」時才會用到。下一步會顯示算出來的金額再確認。' }
    ];
    // 有空位就直接錄取；沒空位時才出現超收選項
    if (s.status === '候補中' && D.stats.available < 1) fields.push({ name: 'over', label: '沒有空位也錄取（超收）', type: 'checkbox', value: false });
    fields.push({ name: 'sendMail', label: s.status === '候補中' ? '寄報名成功通知（下一步可預覽）' : '金額有變時寄「報名費用異動通知」', type: 'checkbox', value: true });
    ask('改為個人報名：' + s.name, fields, function (v) { run(s, 'toIndividual', v); });
  }

  /** 手動綁組：模糊比對也對不到時（例如名字寫錯太多），一次勾選好幾位併成同一團 */
  function askBind(s) {
    var mates = s.groupId ? D.students.filter(function (x) { return x.groupId === s.groupId && x.id !== s.id && tierOk(x); }).map(function (x) { return x.name; }) : [];
    var opts = D.students.filter(function (x) { return x.id !== s.id && tierOk(x) && (!s.groupId || x.groupId !== s.groupId); })
      .map(function (x) { return { value: x.id, label: x.name, sub: x.status + (x.groupId ? '・已在其他團' : '') + (x.partners && x.partners.length ? '・寫的同伴：' + x.partners.join('、') : '') }; });
    ask('手動綁組：' + s.name, [{ name: 'withIds', label: '勾選要和 ' + s.name + ' 同一團的人', type: 'checklist', options: opts, required: true,
      hint: (mates.length ? '目前同團：' + mates.join('、') + '。' : '') + (s.partners && s.partners.length ? s.name + ' 寫的同伴：' + s.partners.join('、') + '。' : '') + '勾選的人會併進這一團；已在其他團的人會移過來。' }],
      function (v) { run(s, 'setGroup', v); });
  }

  function askGroup(s) {
    var others = D.students.filter(function (x) { return x.id !== s.id && tierOk(x); })
      .map(function (x) { return { value: x.id, label: x.name + '（' + x.status + '）' }; });
    var opts = [{ value: '', label: s.groupId ? '移出團報，改為個人報名' : '（請選擇）' }].concat(others);
    ask('調整團報歸屬', [{ name: 'withId', label: '與誰同一團', type: 'select', options: opts }], function (v) { run(s, 'setGroup', v); });
  }

  /** 兩段式：先預覽 → 確認視窗 → 執行；取消也留紀錄 */
  function run(s, action, extra) {
    withBusy(api('previewAction', prefix, s.id, action, extra)).then(function (pv) {
      return mailConfirm(pv).then(function (ok) {
        if (!ok) { api('cancelAction', prefix, s.id, action); return; }
        return withBusy(api('runAction', prefix, s.id, action, extra)).then(function (r) {
          if (r.note) toast(r.note, true); else toast('已完成：' + pv.label);
          if (r.promoted && r.promoted.length) toast('已自動遞補：' + r.promoted.join('、'));
          closeDetail();
          return load();
        });
      });
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ---------- 學員詳細資料 ---------- */
  var detail = null;

  /** 同意書的簽名圖片、上傳檔案、簽署紀錄：從雲端硬碟讀回來顯示（查看會記錄在操作紀錄） */
  function showConsentFile(s, f) {
    withBusy(api('getConsentFile', prefix, s.id, f.id)).then(function (r) {
      var bin = atob(r.data), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
      var inner = /^image\//.test(r.mime) ? '<img class="consent-img" alt="">'
        : r.mime === 'application/pdf' ? '<iframe class="consent-pdf" title="同意書 PDF"></iframe>'
        : '<pre class="consent-txt"></pre>';
      var body = el('<div class="consent-view">' + inner + '<a class="btn sm" download>下載檔案</a></div>');
      var a = $('a', body); a.href = url; a.download = r.name;
      if ($('img', body)) $('img', body).src = url;
      if ($('iframe', body)) $('iframe', body).src = url;
      if ($('pre', body)) $('pre', body).textContent = new TextDecoder('utf-8').decode(arr);
      modal({ title: f.label || f.name, desc: s.name + '　' + r.name, body: body, wide: true, buttons: [{ label: '關閉', value: null }] }).then(function () { URL.revokeObjectURL(url); });
    }).catch(function (e) { toast(e.message, true); });
  }

          '<div class="small muted">' + esc((cs.docs || []).map(function (d) { return d.title; }).join('、')) + '</div>' +

  /* ---------- 名單顯示欄位與強調顯示 ---------- */
  function openColumns() {
    var p = D.project, nameCol = p.mapping.name, ro = D.readOnly, hl = JSON.parse(JSON.stringify(p.highlight || {}));
    // 每題實際出現過的答案（多選題拆開），依次數排序，給「答案是…」勾選
    function answers(q) {
      var cnt = {};
      D.students.forEach(function (st) {
        String((st.data || {})[q] === undefined ? '' : st.data[q]).split(/,\s*/).forEach(function (x) { x = x.trim(); if (x && x.length <= 40 && !/^https?:/i.test(x)) cnt[x] = (cnt[x] || 0) + 1; });
      });
      return Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 30);
    }
    var body = el('<div><div class="small muted" style="margin-bottom:10px">勾選要在名單顯示的表單題目，學員姓名一定顯示在第一欄。右邊的「強調」可以讓符合條件的格子標上淡淡的底色（例如飲食是素食、過敏有填寫），匯出 PDF 也會一起標。</div>' +
      '<div class="col-list"></div></div>');
    var list = $('.col-list', body);
    (p.questions || []).forEach(function (q) {
      var isName = q === nameCol, r = hl[q] || null;
      var row = el('<div class="col-row" data-q="' + esc(q) + '"><div class="col-main">' +
        '<label class="check grow"><input type="checkbox" name="disp" value="' + esc(q) + '"' + (isName || p.display.indexOf(q) >= 0 ? ' checked' : '') + (isName || ro ? ' disabled' : '') + '><span>' + esc(q) + (isName ? '（姓名，固定顯示）' : '') + '</span></label>' +
        (isName ? '' : '<select class="input sm col-hl" aria-label="強調"' + (ro ? ' disabled' : '') + '><option value="">不強調</option><option value="filled">有填寫就強調（「無」不算）</option><option value="match">答案是…</option></select>') +
        '</div><div class="col-vals" hidden></div></div>');
      list.appendChild(row);
      if (isName) return;
      var sel = $('.col-hl', row), box = $('.col-vals', row);
      sel.value = r ? r.mode : '';
      function drawVals() {
        box.hidden = sel.value !== 'match';
        if (box.hidden || box.childNodes.length) return;
        var have = (hl[q] && hl[q].mode === 'match') ? hl[q].values : [];
        var opts = answers(q);
        var extra = have.filter(function (x) { return opts.indexOf(x) < 0; });
        box.innerHTML = (opts.length ? '<div class="col-opts">' + opts.map(function (x) {
          return '<label class="check"><input type="checkbox" value="' + esc(x) + '"' + (have.indexOf(x) >= 0 ? ' checked' : '') + (ro ? ' disabled' : '') + '><span>' + esc(x) + '</span></label>';
        }).join('') + '</div>' : '<div class="small muted">目前還沒有人回答這題，可以直接在下面輸入答案</div>') +
          '<input class="input sm col-extra" placeholder="其他答案（完全相同才算，多個用「、」分隔）" maxlength="400"' + (ro ? ' disabled' : '') + '>';
        $('.col-extra', box).value = extra.join('、');
      }
      sel.addEventListener('change', drawVals);
      drawVals();
    });
    modal({ title: '名單顯示欄位與強調', body: body, wide: true, buttons: ro ? [{ label: '關閉', value: null }] : [{ label: '取消', value: null }, { label: '儲存', cls: 'primary', value: true }] }).then(function (ok) {
      if (!ok) return;
      var disp = $$('input[name=disp]:checked', body).map(function (i) { return i.value; });
      var out = {}, bad = '';
      $$('.col-row', body).forEach(function (row) {
        var sel = $('.col-hl', row); if (!sel || !sel.value) return;
        var q = row.getAttribute('data-q');
        if (sel.value === 'filled') { out[q] = { mode: 'filled', values: [] }; return; }
        var vals = $$('.col-opts input:checked', row).map(function (i) { return i.value; })
          .concat(String(($('.col-extra', row) || {}).value || '').split(/[、,，\n]+/).map(function (x) { return x.trim(); }).filter(String));
        if (!vals.length) { bad = bad || q; return; }
        out[q] = { mode: 'match', values: vals };
      });
      if (bad) { toast('「' + bad + '」選了「答案是…」，請勾選或輸入要強調的答案', true); return; }
      var patch = {};
      if (JSON.stringify(disp) !== JSON.stringify(p.display)) patch.display = disp;
      if (JSON.stringify(out) !== JSON.stringify(p.highlight || {})) patch.highlight = out;
      if (!Object.keys(patch).length) { toast('沒有變更'); return; }
      withBusy(api('updateProjectSettings', prefix, patch)).then(function () { toast('已更新顯示欄位與強調'); return load(); }).catch(function (e) { toast(e.message, true); });
    });
  }

  /* ---------- 分小隊 ---------- */
  function genderOf(s) {
    var q = (D.project.questions || []).filter(function (t) { return /性別/.test(t); })[0];
    var v = q ? String(s.data[q] || '') : '';
    return /女/.test(v) ? '女' : /男/.test(v) ? '男' : '';
  }
  function openSquads() {
    var n = D.project.squads || 0;
    if (!(n > 0)) {
      if (D.readOnly) { toast('這個專案沒有設定小隊數', true); return; }
      formDialog({ title: '設定小隊數', desc: '要分幾個小隊？之後可在專案設定修改。', okLabel: '下一步',
        fields: [{ name: 'squads', label: '小隊數', type: 'number', required: true, value: 4 }] }).then(function (v) {
        if (!v) return;
        withBusy(api('updateProjectSettings', prefix, { squads: v.squads })).then(function () { return load(); }).then(openSquads).catch(function (e) { toast(e.message, true); });
      });
      return;
    }
    var list = D.students.filter(function (s) { return tierOk(s); }).sort(function (a, b) {
      return (a.squad === '' ? 99 : a.squad) - (b.squad === '' ? 99 : b.squad) || STROKE(a.name, b.name);
    });
    var cur = {};
    list.forEach(function (s) { cur[s.id] = s.squad === '' ? '' : String(s.squad); });
    var opts = '<option value="">未分隊</option>';
    for (var q = 1; q <= n; q++) opts += '<option value="' + q + '">第 ' + q + ' 隊</option>';
    var body = el('<div class="squad-dlg"><div class="squad-sum"></div>' +
      '<div class="row wrap" style="gap:8px"><button class="btn sm" type="button" data-a="auto">自動分配未分隊的人</button><button class="btn sm ghost" type="button" data-a="clear">全部改為未分隊</button>' +
      '<span class="small muted">自動分配會平均人數' + (list.some(genderOf) ? '並平衡男女' : '') + '，同團報的人盡量同隊</span></div>' +
      '<div class="squad-list">' + list.map(function (s) {
        return '<div class="squad-row" data-id="' + esc(s.id) + '"><div class="grow"><b>' + esc(s.name) + '</b> <span class="small muted">' + esc(s.status) + (genderOf(s) ? '・' + genderOf(s) : '') + (s.groupId ? '・團報' : '') + '</span></div>' +
          '<select class="input"' + (D.readOnly ? ' disabled' : '') + '>' + opts + '</select></div>';
      }).join('') + '</div></div>');
    function sync() {
      $$('.squad-row', body).forEach(function (r) { $('select', r).value = cur[r.getAttribute('data-id')]; });
      var cnt = [];
      for (var i = 1; i <= n; i++) cnt.push('第 ' + i + ' 隊 ' + list.filter(function (s) { return cur[s.id] === String(i); }).length + ' 人');
      var un = list.filter(function (s) { return cur[s.id] === ''; }).length;
      $('.squad-sum', body).textContent = cnt.join('　') + (un ? '　未分隊 ' + un + ' 人' : '');
    }
    body.addEventListener('change', function (e) { var r = e.target.closest('.squad-row'); if (r) { cur[r.getAttribute('data-id')] = e.target.value; sync(); } });
    $('[data-a=clear]', body).addEventListener('click', function () { list.forEach(function (s) { cur[s.id] = ''; }); sync(); });
    $('[data-a=auto]', body).addEventListener('click', function () {
      var size = [], sex = [];
      for (var i = 0; i <= n; i++) { size.push(0); sex.push({ '男': 0, '女': 0, '': 0 }); }
      list.forEach(function (s) { var q = Number(cur[s.id]); if (q) { size[q]++; sex[q][genderOf(s)]++; } });
      var todo = list.filter(function (s) { return cur[s.id] === ''; });
      // 團報的人先排在一起，再依性別、筆畫
      var groupSquad = {};
      list.forEach(function (s) { if (s.groupId && cur[s.id]) groupSquad[s.groupId] = cur[s.id]; });
      todo.sort(function (a, b) { return (a.groupId ? 0 : 1) - (b.groupId ? 0 : 1) || String(a.groupId).localeCompare(String(b.groupId)) || genderOf(a).localeCompare(genderOf(b)) || STROKE(a.name, b.name); });
      var cap = Math.ceil(list.length / n);
      todo.forEach(function (s) {
        var g = genderOf(s), best = 0;
        var pref = s.groupId && groupSquad[s.groupId] ? Number(groupSquad[s.groupId]) : 0;
        if (pref && size[pref] < cap) best = pref;
        if (!best) {
          for (var k = 1; k <= n; k++) {
            if (!best || sex[k][g] < sex[best][g] || (sex[k][g] === sex[best][g] && size[k] < size[best])) best = k;
          }
        }
        cur[s.id] = String(best); size[best]++; sex[best][g]++;
        if (s.groupId && !groupSquad[s.groupId]) groupSquad[s.groupId] = String(best);
      });
      sync();
    });
    sync();
    $('.squad-sum', body).insertAdjacentHTML('afterend', '<div><button class="btn sm ghost" type="button" data-a="staff">各小隊專輔與隨輔…</button></div>');
    $('[data-a=staff]', body).addEventListener('click', function () { openSquadStaff(); });
    modal({ title: '分小隊', desc: '共 ' + n + ' 隊，' + list.length + ' 位學員（已取消、失敗的不列入）。改完按儲存才會寫回。', body: body, wide: true,
      buttons: D.readOnly ? [{ label: '關閉', value: null }] : [{ label: '取消', value: null }, { label: '儲存', cls: 'primary', value: true }] }).then(function (ok) {
      if (!ok) return;
      var diff = {};
      list.forEach(function (s) { var before = s.squad === '' ? '' : String(s.squad); if (cur[s.id] !== before) diff[s.id] = cur[s.id]; });
      if (!Object.keys(diff).length) { toast('沒有變更'); return; }
      withBusy(api('setSquads', prefix, diff)).then(function (r) { toast('已更新 ' + r.changed + ' 人的小隊'); return load(); }).catch(function (e) { toast(e.message, true); });
    });
  }

      '<div class="small muted">類型寫「男」或「女」（例如 男生四人房），自動分配時只會放同性別的學員；床位留空表示不限。</div>' +
      '<div class="room-head"><span>房號</span><span>類型</span><span>床位</span><span>備註（學員看得到）</span><span></span></div><div class="room-list"></div></div>' +
      '<div class="room-sec"><div class="row wrap" style="gap:8px"><h3 class="grow">分配</h3>' + (ro ? '' : '<button class="btn sm" type="button" data-a="auto">自動分配未分房的人</button><button class="btn sm ghost" type="button" data-a="clear">全部改為未分房</button>') + '</div>' +
      '<div class="squad-sum room-sum"></div><div class="squad-list room-assign"></div></div></div>');
    var rl = $('.room-list', body);
    function roomRow(x) {
      var r = el('<div class="room-row"><input class="input" data-k="no" maxlength="20" placeholder="301"><input class="input" data-k="label" maxlength="20" placeholder="男生四人房"><input class="input" data-k="beds" type="number" min="1" max="50" placeholder="不限"><input class="input" data-k="note" maxlength="200" placeholder="例如：3 樓，靠電梯"><button class="btn sm ghost" type="button" data-a="del"' + (ro ? ' disabled' : '') + '>刪除</button></div>');
      ['no', 'label', 'beds', 'note'].forEach(function (k) { var i = $('[data-k=' + k + ']', r); i.value = x[k] === undefined || x[k] === null ? '' : x[k]; i.disabled = ro; });
      rl.appendChild(r);
      return r;
    }
    function rooms() {
      return $$('.room-row', rl).map(function (r) {
        var o = {}; ['no', 'label', 'beds', 'note'].forEach(function (k) { o[k] = $('[data-k=' + k + ']', r).value.trim(); });
        o.beds = o.beds === '' ? '' : Number(o.beds);
        return o;
      }).filter(function (x) { return x.no || x.label || x.note || x.beds !== ''; });
    }
    cfg.rooms.forEach(roomRow);
    function draw() {
      var rs = rooms().filter(function (x) { return x.no; }), cnt = {};
      list.forEach(function (s) { if (cur[s.id]) cnt[cur[s.id]] = (cnt[cur[s.id]] || 0) + 1; });
      var known = {}; rs.forEach(function (x) { known[x.no] = true; });
      var opts = '<option value="">未分房</option>' + rs.map(function (x) {
        return '<option value="' + esc(x.no) + '">' + esc(x.no) + (x.label ? ' ' + esc(x.label) : '') + '（' + (cnt[x.no] || 0) + (x.beds ? '/' + x.beds : '') + '）</option>';
      }).join('');
      $('.room-assign', body).innerHTML = list.map(function (s) {
        var lost = cur[s.id] && !known[cur[s.id]] ? '<option value="' + esc(cur[s.id]) + '">' + esc(cur[s.id]) + '（已不在房間清單）</option>' : '';
        return '<div class="squad-row" data-id="' + esc(s.id) + '"><div class="grow"><b>' + esc(s.name) + '</b> <span class="small muted">' + esc(s.status) + (genderOf(s) ? '・' + genderOf(s) : '') + (s.groupId ? '・團報' : '') + '</span></div>' +
          '<select class="input"' + (ro ? ' disabled' : '') + '>' + opts + lost + '</select></div>';
      }).join('') || '<div class="small muted">還沒有學員</div>';
      $$('.squad-row', body).forEach(function (r) { $('select', r).value = cur[r.getAttribute('data-id')]; });
      var full = rs.filter(function (x) { return x.beds && (cnt[x.no] || 0) > x.beds; }).map(function (x) { return x.no; });
      var un = list.filter(function (s) { return !cur[s.id]; }).length;
      $('.room-sum', body).innerHTML = esc(rs.length + ' 間房，已分 ' + (list.length - un) + ' 人' + (un ? '，未分房 ' + un + ' 人' : '')) +
        (full.length ? '　<span style="color:var(--bad)">' + esc('超過床位：' + full.join('、')) + '</span>' : '');
    }
    body.addEventListener('change', function (e) {
      var r = e.target.closest('.squad-row');
      if (r) cur[r.getAttribute('data-id')] = e.target.value;
      draw();
    });
    if (!ro) {
      rl.addEventListener('click', function (e) { var b = e.target.closest('[data-a=del]'); if (b) { b.closest('.room-row').remove(); draw(); } });
      $('[data-a=add]', body).addEventListener('click', function () { $('[data-k=no]', roomRow({})).focus(); });
      $('[data-a=batch]', body).addEventListener('click', function () {
        formDialog({ title: '一次新增多間房', desc: '房號是數字時，從起始號碼連續新增，例如 301 到 310。', okLabel: '新增',
          fields: [{ name: 'from', label: '起始房號', type: 'number', required: true }, { name: 'to', label: '結束房號', type: 'number', required: true },
            { name: 'label', label: '類型（選填，例如 男生四人房）' }, { name: 'beds', label: '每間床位（選填）', type: 'number' }] }).then(function (v) {
          if (!v) return;
          var a = Number(v.from), z = Number(v.to);
          if (!(a > 0 && z >= a && z - a < 100)) { toast('房號範圍不正確（一次最多 100 間）', true); return; }
          var have = {}; rooms().forEach(function (x) { have[x.no] = true; });
          for (var i = a; i <= z; i++) if (!have[String(i)]) roomRow({ no: String(i), label: v.label || '', beds: v.beds || '' });
          draw();
        });
      });
      $('[data-a=clear]', body).addEventListener('click', function () { list.forEach(function (s) { cur[s.id] = ''; }); draw(); });
      $('[data-a=auto]', body).addEventListener('click', function () {
        var rs = rooms().filter(function (x) { return x.no; });
        if (!rs.length) { toast('請先新增房間', true); return; }
        var cnt = {}, groupRoom = {};
        list.forEach(function (s) { if (cur[s.id]) { cnt[cur[s.id]] = (cnt[cur[s.id]] || 0) + 1; if (s.groupId) groupRoom[s.groupId] = cur[s.id]; } });
        function fits(x, s) { var g = roomGender(x.label); return (!g || !genderOf(s) || g === genderOf(s)) && (!x.beds || (cnt[x.no] || 0) < x.beds); }
        var todo = list.filter(function (s) { return !cur[s.id]; });
        todo.sort(function (a, b) { return (a.groupId ? 0 : 1) - (b.groupId ? 0 : 1) || String(a.groupId).localeCompare(String(b.groupId)) || genderOf(a).localeCompare(genderOf(b)) || STROKE(a.name, b.name); });
        var left = 0;
        todo.forEach(function (s) {
          var pick = null, pref = s.groupId && groupRoom[s.groupId];
          if (pref) pick = rs.filter(function (x) { return x.no === pref && fits(x, s); })[0] || null;
          // 先放進已經有人、還有空床的房間，房間比較不會零散
          if (!pick) pick = rs.filter(function (x) { return fits(x, s) && cnt[x.no] && sameSex(x.no, s); })[0] || rs.filter(function (x) { return fits(x, s) && !cnt[x.no]; })[0] || null;
          if (!pick) { left++; return; }
          cur[s.id] = pick.no; cnt[pick.no] = (cnt[pick.no] || 0) + 1;
          if (s.groupId && !groupRoom[s.groupId]) groupRoom[s.groupId] = pick.no;
        });
        function sameSex(no, s) { var g = genderOf(s); return !g || list.every(function (y) { return cur[y.id] !== no || !genderOf(y) || genderOf(y) === g; }); }
        draw();
        if (left) toast('有 ' + left + ' 位找不到合適的空床（床位不夠或性別不符），請手動分配', true);
      });
    }
    draw();
    modal({ title: '分房', desc: list.length + ' 位學員（已取消、失敗的不列入）。改完按儲存才會寫回；學員專區與信件的 {{房號}} 會顯示房間。', body: body, wide: true,
      buttons: ro ? [{ label: '關閉', value: null }] : [{ label: '取消', value: null }, { label: '儲存', cls: 'primary', value: true }] }).then(function (ok) {
      if (!ok) return;
      var rs = rooms(), seen = {}, err = '';
      rs.forEach(function (x) {
        if (err) return;
        if (!x.no) err = '每間房都要填房號';
        else if (seen[x.no]) err = '房號重複：' + x.no;
        else if (x.beds !== '' && !(x.beds >= 1 && x.beds <= 50)) err = '房號 ' + x.no + ' 的床位請填 1 到 50';
        seen[x.no] = true;
      });
      if (err) { toast(err, true); return; }
      var lost = list.filter(function (s) { return cur[s.id] && !seen[cur[s.id]]; }).map(function (s) { return s.name; });
      if (lost.length) { toast(lost.join('、') + ' 的房間已不在清單，請改分其他房間', true); return; }
      var newCfg = { show: $('[name=show]', body).checked, mates: $('[name=mates]', body).checked, rooms: rs };
      var oldKnown = {}; cfg.rooms.forEach(function (x) { oldKnown[x.no] = true; });
      var first = {}, later = {}, n = 0;
      list.forEach(function (s) {
        if (cur[s.id] === (s.room || '')) return;
        n++;
        if (!cur[s.id] || oldKnown[cur[s.id]]) first[s.id] = cur[s.id]; else later[s.id] = cur[s.id];
      });
      var cfgChanged = JSON.stringify(newCfg) !== JSON.stringify(cfg);
      if (!cfgChanged && !n) { toast('沒有變更'); return; }
      // 先把要搬走的人移出，再存房間清單（刪掉的房間要先沒人），最後分到新房間
      var job = Promise.resolve();
      if (Object.keys(first).length) job = job.then(function () { return api('setRooms', prefix, first); });
      if (cfgChanged) job = job.then(function () { return api('updateProjectSettings', prefix, { rooms: newCfg }); });
      if (Object.keys(later).length) job = job.then(function () { return api('setRooms', prefix, later); });
      withBusy(job).then(function () { toast('已儲存分房' + (n ? '（' + n + ' 人變更）' : '')); cacheClear(); return load(); }).catch(function (e) { toast(e.message, true); load(); });
    });
  }

  /* ---------- 事件 ---------- */
  $('#st-search', root).addEventListener('input', function (e) { search = e.target.value.trim().toLowerCase(); if (D) renderTable(); });
  $('#st-settings', root).addEventListener('click', function () { if (D) openSettings(); });
  $('#st-bulk', root).addEventListener('click', function () { if (D) openBulk(); });
  $('#st-tpl', root).addEventListener('click', function () { if (D) openProjectTemplates(); });
  $('#st-forms', root).addEventListener('click', function () { if (D) openForms(); });
  $('#st-portal', root).addEventListener('click', function () { if (D) openPortal(); });
  $('#st-squad', root).addEventListener('click', function () { if (D) openSquads(); });
  $('#st-room', root).addEventListener('click', function () { if (D) openRooms(); });
  $('#st-cols', root).addEventListener('click', function () { if (D) openColumns(); });
  // 列表檢視：預設／窄（記在這台電腦的瀏覽器）
  var density = '';
  try { density = localStorage.getItem('st_density') || ''; } catch (e) {}
  function applyDensity() {
    $('table.list', root).classList.toggle('dense', density === 'dense');
    $$('#st-density input', root).forEach(function (i) { i.checked = i.value === density; });
  }
  $('#st-density', root).addEventListener('change', function (e) {
    density = e.target.value;
    try { localStorage.setItem('st_density', density); } catch (er) {}
    applyDensity();
  });
  applyDensity();
  $('#st-squad-filter', root).addEventListener('change', function (e) { squadFilter = e.target.value; renderTable(); });
  /** 匯出 PDF 的程式在 assets/export.js；沒載到（檔案沒上傳、舊快取）就現場補載一次 */
  function withExport(fn) {
    if (typeof openExportDialog === 'function') return fn();
    var sc = document.createElement('script');
    sc.src = 'assets/export.js?v=' + Date.now();
    sc.onload = function () { if (typeof openExportDialog === 'function') fn(); else toast('assets/export.js 內容不對，請到 GitHub 用更新包的版本整份取代', true); };
    sc.onerror = function () { toast('找不到 assets/export.js：請確認 GitHub 的 assets 資料夾裡有這個檔案（更新包裡有）', true); };
    document.head.appendChild(sc);
  }
  $('#st-export', root).addEventListener('click', function () {
    if (!D) return;
    withExport(openExport);
  });
  function openExport() {
    var f = FILTERS.filter(function (x) { return x.key === filter; })[0];
    openExportDialog({
      prefix: prefix, project: D.project, groups: D.groups || {},
      filtered: sorted(D.students).filter(matches), all: sorted(D.students),
      filterLabel: (f ? f.label : '全部') + (search ? '＋搜尋「' + search + '」' : ''),
      displayCols: columns(), squads: D.project.squads || 0, rooms: ((D.project.rooms || {}).rooms || []).filter(function (x) { return x.no; })
    });
  }
  $('#st-sync', root).addEventListener('click', function () {
    withBusy(api('syncNow', prefix)).then(function (r) {
      toast('同步完成：新增 ' + r.added + ' 筆' + (r.overdue ? '，標記逾期 ' + r.overdue + ' 筆' : '') + (r.promoted ? '，自動遞補 ' + r.promoted + ' 人' : ''));
      return load();
    }).catch(function (e) { toast(e.message, true); });
  });

  // 通知鈴鐺在同一個專案頁點「查看這位學員」時直接打開，不重新載入；找不到回傳 false
  App.openStudent = function (id) {
    var hit = D && D.students.filter(function (x) { return x.id === id; })[0];
    if (hit) openDetail(hit);
    return !!hit;
  };
  /* ---------- 名單有變動時不自動重畫（避免正在編輯時被刷新），在下方跳出提示，按了才更新（每 30 秒問一次，頁面在背景時不問） ---------- */
  var watching = false, pending = null, updBar = null;
  function hideUpdate() { pending = null; if (updBar) { updBar.remove(); updBar = null; } }
  function applyUpdate() {
    if (!pending) return;
    D = pending; hideUpdate(); render(); cacheSet(cacheKey('getProjectData', [prefix]), D);
    toast('名單已更新');
  }
  function showUpdate(d) {
    var old = {}, added = 0, changed = 0;
    D.students.forEach(function (x) { old[x.id] = x.status; });
    d.students.forEach(function (x) { if (!(x.id in old)) added++; else if (old[x.id] !== x.status) changed++; });
    var parts = [];
    if (added) parts.push(added + ' 筆新報名');
    if (changed) parts.push(changed + ' 位學員狀態有變動');
    pending = d;
    if (!updBar) {
      updBar = el('<div class="upd-bar" role="status"><span></span><button class="btn sm primary" type="button">更新名單</button><button class="btn sm ghost icon" type="button" aria-label="稍後再說" title="稍後再說">✕</button></div>');
      $('.btn.primary', updBar).addEventListener('click', applyUpdate);
      $('.icon', updBar).addEventListener('click', function () { updBar.classList.add('hidden'); });
      document.body.appendChild(updBar);
    }
    updBar.classList.remove('hidden');
    $('span', updBar).textContent = (parts.length ? '有 ' + parts.join('、') : '名單資料有更新') + '，按「更新名單」後顯示。';
  }
  function checkNew() {
    if (watching || !D || document.hidden) return;
    watching = true;
    api('projectStamp', prefix).then(function (r) {
      var cur = pending || D;
      if (!D || r.stamp === D.stamp || r.stamp === cur.stamp) return;
      return api('getProjectData', prefix).then(function (d) { if (D && d.stamp !== D.stamp) showUpdate(d); });
    }).catch(function () { /* 背景檢查失敗就略過 */ }).then(function () { watching = false; });
  }
  setInterval(checkNew, 30000);
  document.addEventListener('visibilitychange', checkNew);

  load().then(function () {
    // 從通知鈴鐺點進來：直接打開那位學員
    if (!params.student || !D) return;
    var hit = D.students.filter(function (x) { return x.id === params.student; })[0];
    if (hit) openDetail(hit); else toast('找不到這位學員，可能已被移除', true);
  });
});
</script>
</body>
</html>
