<!DOCTYPE html>
<!-- 營隊報名管理系統　© 2026 Daniel GUO. All rights reserved. -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>營隊表單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/loading.js"></script>
  <style>
    /* 學員填的預製表單：不用登入，版面跟寄出的信一樣（標頭色條＋白底內容） */
    .pf-wrap { max-width: 640px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
    .pf-head { padding: 18px 24px; color: #fff; font-weight: 700; font-size: 17px; background: #2f5d62; }
    .pf-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .pf-body h1 { margin: 0; font-size: 22px; }
    .pf-intro { line-height: 1.8; color: var(--text); }
    .pf-steps { display: flex; flex-direction: column; gap: 14px; }
    .pf-info { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pf-info div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .pf-info div:last-child { border-bottom: 0; }
    .pf-info b { color: var(--text-2); font-weight: 500; }
    .pf-msg { padding: 14px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); line-height: 1.7; }
    .pf-err { color: var(--bad); min-height: 18px; font-size: 13px; }
    .pf-done { line-height: 1.8; padding: 8px 0; }
    .pf-foot { color: var(--text-3); font-size: 13px; text-align: center; line-height: 1.7; }
    .pf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pf-row > * { min-width: 0; }
    /* iPhone 的日期欄位有固定的最小寬度、文字置中，會撐破版面：改成跟一般欄位一樣 */
    .pf-body input[type=date] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; text-align: left; }
    .pf-body input[type=date]::-webkit-date-and-time-value { text-align: left; }
    .pf-sec { font-weight: 700; color: var(--text); margin-top: 4px; }
    .pf-est { padding: 12px 16px; border-radius: 12px; background: var(--surface-2, #f4f5f3); line-height: 1.7; font-size: 14px; }
    .pf-policy table { width: 100%; }
    .pf-mask { position: fixed; inset: 0; background: rgba(20, 24, 22, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
    .pf-dlg { background: var(--surface, #fff); border-radius: 18px; width: 100%; max-width: 480px; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow: auto; }
    .pf-dlg h2 { margin: 0; font-size: 18px; }
    .pf-dlg .pf-info div { grid-template-columns: 96px 1fr; }
    .pf-dlg-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    /* iPhone 點到字級小於 16px 的輸入框會自動放大畫面 */
    .input { font-size: 16px; }
    /* 匯款回報：匯款帳戶與應繳金額，各附複製鍵 */
    .pf-pay { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .pf-pay > b { display: block; padding: 10px 14px; background: var(--surface-2, #f4f5f3); font-size: 14px; }
    .pf-pay div { display: grid; grid-template-columns: 80px 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 14px; }
    .pf-pay div span:first-child { color: var(--text-2); }
    .pf-pay div strong { min-width: 0; overflow-wrap: anywhere; letter-spacing: .3px; }
    @media (min-width: 521px) { .pf-mask { align-items: center; } }
    @media (max-width: 520px) { .pf-row { grid-template-columns: 1fr; } .pf-body { padding: 20px 16px; } }
  </style>
</head>
<body>
  <div class="pf-wrap">
    <div class="card">
      <div class="pf-head" id="pf-camp">載入中…</div>
      <div class="pf-body" id="pf-body"><div class="ld"><div class="ld-spin"></div><div class="ld-msg">載入中…</div></div></div>
    </div>
    <div class="pf-foot" id="pf-foot" style="margin-top:20px"></div>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var prefix = q.get('p') || '', kind = q.get('f') || '';
  var ftok = /^F[0-9a-f]{32}$/.test(q.get('t') || '') ? q.get('t') : '';   // 從學員專區打開：用學員專區的身分，不用再輸入身分證
  var body = document.getElementById('pf-body'), head = document.getElementById('pf-camp');
  var F = null, who = null;

  function esc(t) { return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!window.CAMP_CONFIG || !CAMP_CONFIG.API_URL) return Promise.reject(new Error('網站尚未設定完成，請洽籌辦團隊'));
    return fetch(CAMP_CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('連線失敗，請稍後再試'); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || '發生錯誤'); return j.result; });
  }
  function busy(btn, on, label, busyLabel) { btnBusy(btn, on, label, busyLabel); }

  /** 二次確認：列出要送出的內容，按「確定送出」才送 */
  function confirmBox(title, rows, warn, danger) {
    return new Promise(function (resolve) {
      var mask = document.createElement('div');
      mask.className = 'pf-mask';
      mask.innerHTML = '<div class="pf-dlg" role="dialog" aria-modal="true"><h2></h2><div class="pf-info">' +
        rows.map(function (x) { return '<div><b>' + esc(x[0]) + '</b><span style="white-space:pre-wrap;word-break:break-word">' + esc(x[1]) + '</span></div>'; }).join('') +
        '</div><div class="pf-msg"></div><div class="pf-dlg-btns"><button class="btn ghost" type="button" data-v="0">返回修改</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" type="button" data-v="1">確定送出</button></div></div>';
      mask.querySelector('h2').textContent = title;
      mask.querySelector('.pf-msg').textContent = warn;
      function done(v) { mask.remove(); document.removeEventListener('keydown', key); resolve(v); }
      function key(e) { if (e.key === 'Escape') done(false); }
      mask.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) done(b.getAttribute('data-v') === '1'); else if (e.target === mask) done(false); });
      document.addEventListener('keydown', key);
      document.body.appendChild(mask);
      mask.querySelector('[data-v="1"]').focus();
    });
  }

  function closed(msg) {
    head.textContent = '營隊表單';
    body.innerHTML = '<div class="pf-msg"></div>';
    body.firstChild.textContent = msg;
  }

  /** 從學員專區打開（網址有 t=）：直接查，不用輸入姓名與身分證；憑證過期時改回一般查詢 */
  function startToken() {
    showLoading(body, '正在讀取你的報名資料…');
    who = { name: '', key: ftok };
    call('publicLookup', prefix, kind, '', ftok).then(function (r) { who.name = r.info[0][1]; confirmStep(r); })
      .catch(function (e) { ftok = ''; start(e.message); });
  }

  function start(msg) {
    body.innerHTML =
      '<h1>' + esc(F.title) + '</h1><div class="pf-intro">' + F.introHtml + '</div>' + (typeof msg === 'string' && msg ? '<div class="pf-msg" id="pf-tmsg"></div>' : '') +
      '<form class="pf-steps" id="pf-find" autocomplete="on">' +
      '<div class="pf-row"><label class="field"><span>學員姓名<em>*</em></span><input class="input" name="name" autocomplete="name" required></label>' +
      '<label class="field"><span>' + esc(F.keyLabel) + '<em>*</em></span><input class="input" name="key" required' + (F.keyLabel === '身分證字號' ? ' autocapitalize="characters" maxlength="10"' : ' type="email" autocomplete="email"') + '></label></div>' +
      '<div class="pf-err"></div><div><button class="btn primary" type="submit">查詢我的報名</button></div></form>';
    if (document.getElementById('pf-tmsg')) document.getElementById('pf-tmsg').textContent = msg;
    var form = document.getElementById('pf-find');
    form.elements.name.value = q.get('n') || '';
    (form.elements.name.value ? form.elements.key : form.elements.name).focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button'), err = form.querySelector('.pf-err');
      err.textContent = '';
      busy(btn, true, '查詢我的報名', '查詢中…');
      who = { name: form.elements.name.value.trim(), key: form.elements.key.value.trim() };
      call('publicLookup', prefix, kind, who.name, who.key).then(function (r) { confirmStep(r); })
        .catch(function (e2) { err.textContent = e2.message; busy(btn, false, '查詢我的報名'); });
    });
  }

  function confirmStep(r) {
    var info = '<div class="pf-info">' + r.info.map(function (x) { return '<div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('') + '</div>';
    var html = '<h1>' + esc(F.title) + '</h1><div class="small muted">' + (r.viaPortal ? '從學員專區打開，已帶入你的報名資料' : '請確認以下是你的報名資料') + '</div>' + (r.nameNotice ? '<div class="pf-msg">' + esc(r.nameNotice) + '</div>' : '') + info +
      (kind === 'pay' && r.info.some(function (x) { return x[0] === '上次回報'; }) ? '<div class="pf-msg">你已經回報過匯款了，籌辦團隊查帳後會寄確認信。只有補匯差額或上次填錯時才需要再回報一次。</div>' : '');
    if (!r.ok) {
      body.innerHTML = html + '<div class="pf-msg" id="pf-block"></div>' + (r.viaPortal ? '' : '<div><button class="btn" type="button" id="pf-back">重新查詢</button></div>');
      document.getElementById('pf-block').textContent = r.message;
      if (!r.viaPortal) document.getElementById('pf-back').onclick = start;
      return;
    }
    var fields = '';
    if (kind === 'pay') {
      if (r.payRows && r.payRows.length) fields += '<div class="pf-pay"><b>匯款資訊</b>' + r.payRows.map(function (x, i) {
        return '<div><span>' + esc(x[0]) + '</span><strong>' + esc(x[1]) + '</strong>' + (x[2] ? '<button class="btn sm ghost" type="button" data-copy="' + i + '">複製' + (x[0] === '應繳金額' ? '金額' : x[0] === '帳號' ? '帳號' : x[0] === '銀行' ? '代碼' : '') + '</button>' : '<span></span>') + '</div>';
      }).join('') + '</div>';
      fields += '<label class="field"><span>匯款帳號後五碼<em>*</em></span><input class="input" name="last5" inputmode="numeric" maxlength="5" pattern="\\d{5}" required placeholder="例如 12345"><span class="hint">轉出帳號（或無摺存款單上）的最後 5 碼，籌辦團隊用來查帳</span></label>' +
        '<div class="pf-row"><label class="field"><span>匯款金額（元）</span><input class="input" name="amount" inputmode="numeric" maxlength="9" value="' + esc(r.price) + '"><span class="hint">只填數字，例如 6000</span></label>' +
        '<label class="field"><span>匯款日期</span><input class="input" name="date" type="date" value="' + esc(r.today) + '"></label></div>' +
        '<label class="field"><span>匯款人姓名</span><input class="input" name="payer" maxlength="40" autocomplete="off" placeholder="選填，例如 王媽媽"><span class="hint">用家長或其他人的帳戶匯款時請填，方便籌辦團隊對帳</span></label>';
    } else {
      if (r.refundHtml) fields += '<div class="pf-policy">' + r.refundHtml + '</div>';
      fields += '<label class="field"><span>取消原因<em>*</em></span><textarea class="input" name="reason" rows="2" maxlength="500" required></textarea></label>';
      if (r.paid) {
        var est = r.refund || {};
        fields += '<div class="pf-msg">你已經繳費。送出後報名不會馬上取消，籌辦團隊核對後會退款到下面的帳戶並寄信通知。</div>' +
          (est.pct !== null && est.pct !== undefined ? '<div class="pf-est">依退款規定，今天申請可退還 <b>' + esc(est.pct) + '%</b>' + (est.amount !== '' ? '，約 <b>' + esc(Number(est.amount).toLocaleString('en-US')) + ' 元</b>' + (est.fee ? '（已扣郵匯費 ' + esc(Number(est.fee).toLocaleString('en-US')) + ' 元）' : '') : '') + '。' + esc(est.note || '實際金額以籌辦團隊核對為準') + '</div>' : '') +
          '<div class="pf-sec">退款帳戶</div>' +
          '<div class="pf-row"><label class="field"><span>銀行<em>*</em></span><input class="input" name="r_bank" required maxlength="60" placeholder="例如 台灣銀行（004）"></label>' +
          '<label class="field"><span>分行<em>*</em></span><input class="input" name="r_branch" required maxlength="60" placeholder="例如 新竹分行"></label></div>' +
          '<div class="pf-row"><label class="field"><span>帳號<em>*</em></span><input class="input" name="r_no" required maxlength="30" inputmode="numeric" placeholder="完整帳號"></label>' +
          '<label class="field"><span>戶名<em>*</em></span><input class="input" name="r_name" required maxlength="60"></label></div>';
      }
    }
    fields += '<label class="field"><span>' + esc(F.noteLabel) + '</span><textarea class="input" name="note" rows="3" maxlength="1000" placeholder="選填"></textarea></label>';
    var danger = kind !== 'pay';
    body.innerHTML = html + '<form class="pf-steps" id="pf-send">' + fields +
      '<label class="check"><input type="checkbox" name="me" required><span>以上是我的報名資料' + (danger && !r.paid ? '，確定要取消（無法復原）' : '') + '</span></label>' +
      '<div class="pf-err"></div><div class="row" style="gap:8px;display:flex;flex-wrap:wrap"><button class="btn ' + (danger ? 'danger' : 'primary') + '" type="submit">送出</button>' + (r.viaPortal ? '' : '<button class="btn ghost" type="button" id="pf-back">不是我，重新查詢</button>') + '</div></form>';
    if (!r.viaPortal) document.getElementById('pf-back').onclick = start;
    var form = document.getElementById('pf-send');
    Array.prototype.forEach.call(form.querySelectorAll('[data-copy]'), function (b) { b.addEventListener('click', function () { copyBtn(b, r.payRows[Number(b.getAttribute('data-copy'))][2]); }); });
    // 匯款金額只收數字：全形轉半形，其他字（例如「六千」、「元」）輸入時就拿掉
    if (form.elements.amount) form.elements.amount.addEventListener('input', function () {
      var el = this, v = el.value.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[^\d]/g, '');
      if (v !== el.value) el.value = v;
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button[type=submit]'), err = form.querySelector('.pf-err');
      err.textContent = '';
      var data = {};
      ['last5', 'amount', 'date', 'payer', 'reason', 'note', 'r_bank', 'r_branch', 'r_no', 'r_name'].forEach(function (k) { if (form.elements[k]) data[k] = form.elements[k].value.trim(); });
      if (kind === 'pay' && !/^\d{5}$/.test(data.last5)) { err.textContent = '匯款帳號後五碼請填 5 位數字'; form.elements.last5.focus(); return; }
      if (kind === 'pay' && data.amount && !/^\d{1,9}$/.test(data.amount.replace(/,/g, ''))) { err.textContent = '匯款金額請填數字，例如 6000'; form.elements.amount.focus(); return; }
      if (data.r_no !== undefined && !/^[\d\s-]{6,30}$/.test(data.r_no)) { err.textContent = '退款帳號請填數字（可含 - 或空白）'; return; }
      // 送出前再確認一次
      var rows = [['學員姓名', who.name]];
      if (kind === 'pay') rows.push(['後五碼', data.last5], ['匯款金額', data.amount ? Number(data.amount.replace(/,/g, '')).toLocaleString('en-US') + ' 元' : '（未填）'], ['匯款日期', data.date || '（未填）'], ['匯款人姓名', data.payer || '（未填）']);
      else rows.push(['取消原因', data.reason]);
      if (data.r_bank !== undefined) rows.push(['退款銀行', data.r_bank + ' ' + data.r_branch], ['退款帳號', data.r_no], ['戶名', data.r_name]);
      if (data.note) rows.push([F.noteLabel, data.note]);
      var warn = kind === 'pay' ? '送出後狀態會改為「繳款待核覆」，籌辦團隊查帳後會寄確認信。'
        : r.paid ? '送出後會通知籌辦團隊處理退款，退款完成前報名仍然有效。'
        : kind === 'unwait' ? '送出後會立即取消你的候補，無法復原。' : '送出後會立即取消你的報名，無法復原。';
      confirmBox(kind === 'pay' ? '確定送出匯款回報？' : kind === 'unwait' ? '確定取消候補？' : '確定取消報名？', rows, warn, kind !== 'pay' && !r.paid).then(function (yes) {
        if (!yes) return;
        busy(btn, true, '送出');
        call('publicSubmit', prefix, kind, who.name, who.key, data).then(function (res) {
          body.innerHTML = '<h1>' + esc(F.title) + '</h1><div class="pf-done">' + res.doneHtml + '</div>';
          window.scrollTo(0, 0);
        }).catch(function (e2) { err.textContent = e2.message; busy(btn, false, '送出'); });
      });
    });
  }

  if (!prefix || !kind) { closed('網址不完整，請從信裡的按鈕重新打開'); return; }
  showLoading(document.getElementById('pf-body'));
  call('publicForm', prefix, kind).then(function (f) {
    if (f.closed) { closed(f.message); return; }
    F = f;
    document.title = f.title + '｜' + f.campName;
    head.textContent = f.campName;
    head.style.background = f.headerColor;
    document.getElementById('pf-foot').innerHTML = (f.contactsHtml ? '<div style="text-align:left;margin-bottom:16px">' + f.contactsHtml + '</div>' : '') + f.signatureHtml;
    if (ftok) startToken(); else start();
  }).catch(function (e) { closed(e.message); });
})();
</script>
<footer style="text-align:center;color:#9aa3a0;font-size:12px;padding:8px 16px calc(20px + env(safe-area-inset-bottom, 0px))">營隊報名管理系統　© 2026 Daniel GUO. All rights reserved.</footer>
</body>
</html>
