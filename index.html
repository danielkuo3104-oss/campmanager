<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
    <div class="login-wrap">
      <form class="card login-card" id="login-form" autocomplete="on">
        <div class="brand-mark">營</div>
        <h1>營隊報名管理系統</h1>
        <p class="muted" style="margin:6px 0 24px">請以管理員信箱與密碼登入</p>
        <div style="display:flex;flex-direction:column;gap:14px">
          <label class="field"><span>信箱</span><input class="input" name="email" type="email" autocomplete="username" required></label>
          <label class="field"><span>密碼</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
          <div class="small" id="login-error" style="color:var(--bad);min-height:18px"></div>
          <button class="btn primary" type="submit" style="height:42px">登入</button>
        </div>
      </form>
    </div>
  
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script>App.loginPage();</script>
</body>
</html>
