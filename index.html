<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="營隊管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>登入｜營隊報名管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
    <div class="login-wrap">
      <form class="card login-card" id="login-form" autocomplete="on">
        <div class="brand-mark">營</div>
        <h1>營隊報名管理系統</h1>
        <p class="muted" style="margin:6px 0 24px">請以管理員信箱與密碼登入</p>
        <div style="display:flex;flex-direction:column;gap:14px">
          <label class="field"><span>信箱</span><input class="input" name="email" type="email" autocomplete="username" required></label>
          <label class="field"><span>密碼</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
          <label class="check"><input type="checkbox" name="remember"><span>保持登入（30 天內不用再登入，公用電腦請勿勾選）</span></label>
          <div class="small" id="login-error" style="color:var(--bad);min-height:18px"></div>
          <button class="btn primary" type="submit" style="height:42px">登入</button>
          <div class="small muted" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <a href="register.html">還沒有帳號？申請註冊</a>
            <a href="#" onclick="forgotPassword();return false">忘記密碼？</a>
            <a href="#" class="install-btn hidden" onclick="installApp();return false">安裝到桌面</a>
          </div>
        </div>
      </form>
    </div>
  
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script>App.loginPage();</script>
</body>
</html>
